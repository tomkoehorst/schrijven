/* ----- Sprint ----- */
let sprint = LS.get('sprint', null), sprintTick = null;
function fmtLeft(){ if (!sprint) return ''; const s = Math.max(0, Math.round((sprint.end - Date.now()) / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function startSprint(min){
  sprint = {end: Date.now() + min * 60000, min, startWords: dayTotal(dayKey()), start: Date.now()};
  LS.set('sprint', sprint); runSprint();
  closeCoach();
  if (!currentId) newSheet();
  if (!$('#app').classList.contains('focus')) toggleFocus();
  setTimeout(() => ta.focus(), 80);
}
function runSprint(){
  clearInterval(sprintTick);
  const badge = $('#sprintBadge'), line = $('#sprintLine');
  if (!sprint){ badge.classList.remove('on'); line.classList.remove('on'); return; }
  badge.classList.add('on'); line.classList.add('on');
  const tick = () => {
    if (!sprint) return;
    const left = sprint.end - Date.now();
    badge.textContent = fmtLeft();
    line.style.width = Math.min(100, (1 - left / (sprint.min * 60000)) * 100) + '%';
    const l = $('#sprintLeft'); if (l) l.textContent = fmtLeft();
    if (left <= 0) endSprint();
  };
  tick(); sprintTick = setInterval(tick, 1000);
}
function endSprint(stopped){
  if (!sprint) return;
  const s = sprint; sprint = null; LS.set('sprint', null); runSprint();
  const words = Math.max(0, dayTotal(dayKey()) - s.startWords);
  const mins = Math.max(1, Math.round((Math.min(Date.now(), s.end) - s.start) / 60000));
  stats.sprints.push({id: uid(), at: Date.now(), min: mins, words}); stats.sprints = stats.sprints.slice(-60); saveStatsSoon();
  if ($('#app').classList.contains('focus')) toggleFocus();
  const prev = stats.sprints.slice(0, -1).map(x => x.words / x.min);
  const pace = words / mins, better = prev.length && pace > Math.max(...prev);
  openModal(`<div style="text-align:center"><div style="width:96px;height:96px;margin:0 auto 10px">${cat(words ? 'happy' : 'sleepy')}</div>
    <h3>${stopped ? 'Sprint gestopt' : 'Sprint klaar!'}</h3>
    <p><b style="font-size:28px;color:var(--text)">${words}</b> woorden in ${mins} min<br>${Math.round(pace)} woorden per minuut${better ? ' — <b>je snelste sprint tot nu toe</b>' : ''}</p>
    <p class="muted">Lees nu nog niet terug. Neem even pauze, of ga meteen door.</p>
    <div class="btns" style="justify-content:center"><button class="btn ghost" data-close>Klaar</button><button class="btn" id="again">Nog een sprint</button></div></div>`);
  $('#again').onclick = () => { closeModal(); startSprint(s.min); };
}

/* ----- Text analysis (shared by style check, analysis and ideas) ----- */
const STOP = new Set(('de het een en van in op te dat die is was zijn er aan met voor als om niet maar ook dan bij of door naar uit over tot nog zo wat wie hoe waar wel al ze zij hij ik je jij u we wij jullie hun hen hem haar mijn jouw zijn ons onze mij me deze dit daar hier toen nu want omdat dus heb heeft had hebben hadden ben bent wordt werd worden werden zal zou kan kon kunnen moet moest mag wil wilde zich men iets niets alles iemand niemand meer veel weer even toch wel nog geen naar tegen zonder onder tussen achter boven sinds tijdens welke welk zoals waar waarom wanneer elk elke ieder alle andere ander zelf eens ging gaat komt kwam zei zegt was waren').split(' '));
const FILLERS = ['eigenlijk','gewoon','best wel','best','heel erg','heel','erg','echt','natuurlijk','misschien','enigszins','nogal','vrij','behoorlijk','ontzettend','enorm','helemaal','uiteraard','sowieso','inderdaad','simpelweg','feitelijk','als het ware','in principe','op zich','een beetje','redelijk','vrijwel','zeg maar','ergens','wellicht','dus eigenlijk','toch wel'];
const FILL_RE = new RegExp('(?<![\\p{L}])(' + FILLERS.sort((a, b) => b.length - a.length).map(f => f.replace(/ /g, '\\s+')).join('|') + ')(?![\\p{L}])', 'giu');
const PASS_RE = /(?<![\p{L}])(wordt|worden|werd|werden)(?![\p{L}])((?:\s+[\p{L}’'-]+){0,6}?)\s+(ge[\p{L}]+?(?:d|t|en))(?![\p{L}])/giu;
const SENSES = {
  zien:   /\b(zag|zie|ziet|zagen|keek|kijk|kijkt|licht|donker|kleur|glans|glinster\w*|schaduw\w*|rood|blauw|groen|geel|wit|zwart|grijs|fel|schitter\w*)\b/gi,
  horen:  /\b(hoor|hoort|hoorde|geluid\w*|stil|stilte|klonk|klinkt|fluister\w*|ruis\w*|kraak\w*|bonk\w*|zoem\w*|piep\w*|lawaai|zacht\s+gezongen|zong|zingt|schreeuw\w*|galm\w*)\b/gi,
  ruiken:  /\b(ruik|ruikt|rook|geur\w*|stank|stonk|parfum|muf|fris\w*\s+lucht|lucht\s+van)\b/gi,
  proeven: /\b(proef|proeft|proefde|smaak|smaakte|zoet|zuur|bitter|zout|hartig|op\s+mijn\s+tong)\b/gi,
  voelen:  /\b(voel|voelt|voelde|koud|kou|warm|warmte|zacht|ruw|glad|pijn|tinteling|kriebel\w*|huiver\w*|ril\w*|nat|droog|plakkerig)\b/gi
};
const syll = w => Math.max(1, (w.toLowerCase().replace(/ij/g, 'i').match(/[aeiouyáéíóúàèëïöü]+/g) || []).length);

function analyse(text){
  const clean = text.replace(/\+\+[\s\S]*?\+\+/g, m => ' '.repeat(m.length)).replace(/^#{1,6}\s/gm, m => ' '.repeat(m.length));
  const words = [...clean.matchAll(/[\p{L}\p{N}][\p{L}\p{N}’'-]*/gu)].map(m => ({w: m[0], lw: m[0].toLowerCase(), i: m.index}));
  const sentences = [];
  for (const m of clean.matchAll(/[^.!?\n]+(?:[.!?]+["”’']?|\n|$)/g)){
    const raw = m[0]; const lead = raw.length - raw.trimStart().length;
    const ws = [...raw.matchAll(/[\p{L}\p{N}][\p{L}\p{N}’'-]*/gu)];
    if (ws.length) sentences.push({start: m.index + lead, end: m.index + raw.trimEnd().length, n: ws.length, first: ws[0][0].toLowerCase(), text: raw.trim()});
  }
  const content = words.filter(x => x.lw.length >= 4 && !STOP.has(x.lw) && !/^\d+$/.test(x.lw));
  const freq = {}; for (const x of content) freq[x.lw] = (freq[x.lw] || 0) + 1;
  return {clean, words, sentences, content, freq};
}

function checkRanges(text){
  const A = analyse(text), R = [];
  for (const s of A.sentences){ if (s.n > 35) R.push([s.start, s.end, 'c-xlong', 'xlong']); else if (s.n > 25) R.push([s.start, s.end, 'c-long', 'long']); }
  for (const m of A.clean.matchAll(FILL_RE)) R.push([m.index, m.index + m[0].length, 'c-fill', 'fill', m[0].toLowerCase()]);
  for (const m of A.clean.matchAll(PASS_RE)) R.push([m.index, m.index + m[0].length, 'c-pass', 'pass', m[0]]);
  // repeated content words close together (within 60 words)
  const last = {};
  A.content.forEach((x, idx) => {
    const k = x.lw.length > 6 ? x.lw.slice(0, -2) : x.lw;   // crude stem: lopen/loopt don't match, huizen/huis mostly do
    if (last[k] !== undefined && idx - last[k].idx <= 60 && x.lw.length >= 5){
      R.push([last[k].i, last[k].i + last[k].len, 'c-rep', 'rep', x.lw]); R.push([x.i, x.i + x.w.length, 'c-rep', 'rep', x.lw]);
    }
    last[k] = {idx, i: x.i, len: x.w.length};
  });
  // three sentences in a row starting with the same word
  for (let i = 2; i < A.sentences.length; i++){
    const a = A.sentences[i-2], b = A.sentences[i-1], c = A.sentences[i];
    if (a.first === b.first && b.first === c.first) for (const s of [a, b, c]) R.push([s.start, s.start + s.first.length, 'c-start', 'start', s.first]);
  }
  return {ranges: R, A};
}
function renderChecks(){
  const el = $('#checks'); if (!el) return;
  if (!settings.check || !currentId || previewOn){ el.innerHTML = ''; return; }
  const text = ta.value, {ranges} = checkRanges(text);
  if (!ranges.length){ el.textContent = text + '\n​'; return; }
  const marks = new Array(text.length + 1).fill('');
  for (const [s, e, cls] of ranges) for (let i = s; i < e && i < text.length; i++) if (!marks[i].includes(cls)) marks[i] += ' ' + cls;
  let out = '', run = '', cur = null;
  for (let i = 0; i <= text.length; i++){
    const m = i < text.length ? marks[i] : '\0';
    if (m !== cur){ if (run) out += cur ? `<span class="${cur.trim()}">${esc(run)}</span>` : esc(run); run = ''; cur = m; }
    if (i < text.length) run += text[i];
  }
  el.innerHTML = out + '\n​';
}
let checkT;
function scheduleChecks(){ clearTimeout(checkT); checkT = setTimeout(() => { renderChecks(); if (coachOpen && (coachTab === 'style' || coachTab === 'analysis')) renderCoach(); }, 350); }

function coachStyle(){
  if (!currentId) return '<p class="muted" style="margin-top:14px">Open een tekst om de stijlcheck te gebruiken.</p>';
  const {ranges} = checkRanges(ta.value);
  const by = t => ranges.filter(r => r[3] === t);
  const uniq = (arr, i) => [...new Set(arr.map(r => r[i]))];
  const longs = by('long').length + by('xlong').length;
  const fills = by('fill'), pass = by('pass'), reps = uniq(by('rep'), 4), starts = uniq(by('start'), 4);
  const row = (cls, n, title, sub) => `<div class="chk"><span class="sm ${cls}" style="${cls === 'c-long' ? '' : 'background:var(--pane2)'}">${n}</span><div><b>${title}</b><small>${sub}</small></div></div>`;
  const total = longs + fills.length + pass.length + reps.length + starts.length;
  return `<div style="height:8px"></div>
    <button class="toggle ${settings.check ? 'on' : ''}" data-a="check"><span>Markeringen in de tekst</span><span class="sw"></span></button>
    <h4>${total ? 'Wat opvalt' : 'Ziet er strak uit'}</h4>
    ${total === 0 ? `<div style="display:flex;gap:12px;align-items:center"><div style="width:64px;height:64px;flex:none">${cat('happy')}</div><p class="muted" style="margin:0">Geen lange zinnen, vulwoorden of herhalingen gevonden. Mooi werk.</p></div>` : ''}
    ${longs ? row('c-long', longs, 'Lange zinnen', 'Meer dan 25 woorden (roze = meer dan 35). Knip ze op, of zet er bewust een korte zin naast.') : ''}
    ${fills.length ? row('c-fill', fills.length, 'Vulwoorden', uniq(fills, 4).slice(0, 8).map(w => '“' + esc(w) + '”').join(', ') + '. Schrap ze en lees of de zin sterker wordt.') : ''}
    ${pass.length ? row('c-pass', pass.length, 'Lijdende vorm', 'Bijvoorbeeld “' + esc(pass[0][4].slice(0, 50)) + '”. Wie doet het? Maak die persoon het onderwerp.') : ''}
    ${reps.length ? row('c-rep', reps.length, 'Herhaalde woorden', reps.slice(0, 8).map(w => '“' + esc(w) + '”').join(', ') + ' — dicht bij elkaar gebruikt.') : ''}
    ${starts.length ? row('c-start', starts.length, 'Zelfde zinsbegin', 'Drie zinnen op rij beginnen met ' + starts.map(w => '“' + esc(w) + '”').join(', ') + '.') : ''}
    <p class="muted" style="margin-top:12px">Tip: schrijf eerst, check later. Zet de markeringen uit tijdens een sprint.</p>`;
}

function coachAnalysis(){
  if (!currentId) return '<p class="muted" style="margin-top:14px">Open een tekst om hem te analyseren.</p>';
  const A = analyse(ta.value);
  const nW = A.words.length, nS = A.sentences.length;
  if (nW < 30) return `<div style="display:flex;gap:12px;align-items:center;margin-top:14px"><div style="width:64px;height:64px;flex:none">${cat('curious')}</div><p class="muted" style="margin:0">Schrijf eerst wat meer (minstens 30 woorden), dan kan ik iets zinnigs over je tekst zeggen.</p></div>`;
  const avg = nW / Math.max(1, nS);
  const sd = Math.sqrt(A.sentences.reduce((a, s) => a + (s.n - avg) ** 2, 0) / Math.max(1, nS));
  const syl = A.words.reduce((a, x) => a + syll(x.w), 0) / nW;
  const flesch = Math.round(206.835 - 0.93 * avg - 77 * syl);
  const level = flesch >= 80 ? 'Heel makkelijk' : flesch >= 65 ? 'Makkelijk' : flesch >= 50 ? 'Gemiddeld' : flesch >= 35 ? 'Moeilijk' : 'Zeer moeilijk';
  const uniq = new Set(A.words.map(x => x.lw)).size / nW;
  const dialogChars = (ta.value.match(/[“"„«‘][^”"»’\n]{2,}[”"»’]/g) || []).join('').length;
  const dialog = Math.round(dialogChars / Math.max(1, ta.value.length) * 100);
  const past = (A.clean.match(/\b(was|waren|had|hadden|zei|ging|kwam|liep|keek|stond|zat|wist|dacht|werd)\b/gi) || []).length;
  const pres = (A.clean.match(/\b(is|zijn|heeft|hebben|zegt|gaat|komt|loopt|kijkt|staat|zit|weet|denkt|wordt)\b/gi) || []).length;
  const ik = (A.clean.match(/\b(ik|mij|me|mijn)\b/gi) || []).length, hij = (A.clean.match(/\b(hij|zij|ze|hem|haar)\b/gi) || []).length, je = (A.clean.match(/\b(je|jij|jou|jouw|u|uw)\b/gi) || []).length;
  const persp = ik > hij && ik > je ? 'Ik-perspectief' : je > ik && je > hij ? 'Je spreekt de lezer aan' : hij > 0 ? 'Hij/zij-perspectief' : '—';
  const senses = Object.entries(SENSES).map(([k, re]) => [k, (A.clean.match(re) || []).length]);
  const top = Object.entries(A.freq).sort((a, b) => b[1] - a[1]).slice(0, 6).filter(x => x[1] > 1);
  const tips = [];
  if (sd < 4 && nS > 5) tips.push('Je zinnen zijn ongeveer even lang. Wissel af: een korte zin na een lange geeft ritme en nadruk.');
  if (avg > 20) tips.push('Gemiddeld zijn je zinnen vrij lang. Probeer er een paar op te knippen.');
  if (avg < 8 && nS > 5) tips.push('Veel korte zinnen geeft tempo. Mooi voor spanning — voor rust kun je zinnen verbinden.');
  if (past > 4 && pres > 4 && Math.min(past, pres) / Math.max(past, pres) > 0.45) tips.push('Je wisselt tussen verleden en tegenwoordige tijd. Is dat bewust?');
  const missing = senses.filter(s => !s[1]).map(s => s[0]);
  if (missing.length >= 3) tips.push('Je gebruikt vooral ' + (senses.filter(s => s[1]).map(s => s[0]).join(' en ') || 'weinig zintuigen') + '. Een geur of geluid maakt een scène direct tastbaarder.');
  if (uniq < 0.42 && nW > 200) tips.push('Je woordkeus is vrij herhalend. Kijk bij "Stijl" welke woorden vaak terugkomen.');
  return `
    <h4>Leesbaarheid</h4>
    <div class="meter"><span>Niveau (Flesch-Douma)</span><b>${level} · ${flesch}</b></div>
    <div class="meter"><span>Gemiddelde zinslengte</span><b>${avg.toFixed(1)} woorden</b></div>
    <div class="meter"><span>Ritme (variatie zinslengte)</span><b>${sd < 4 ? 'Eentonig' : sd < 8 ? 'Gevarieerd' : 'Heel wisselend'}</b></div>
    <div class="meter"><span>Woordenrijkdom</span><b>${Math.round(uniq * 100)}% unieke woorden</b></div>
    <h4>Verteller</h4>
    <div class="meter"><span>Perspectief</span><b>${persp}</b></div>
    <div class="meter"><span>Tijd</span><b>${past > pres * 1.5 ? 'Verleden tijd' : pres > past * 1.5 ? 'Tegenwoordige tijd' : 'Gemengd'}</b></div>
    <div class="meter"><span>Dialoog</span><b>${dialog}% van de tekst</b></div>
    <h4>Zintuigen</h4>
    <div class="senses">${senses.map(([k, n]) => `<span class="${n ? 'on' : ''}">${k}${n ? ' · ' + n : ''}</span>`).join('')}</div>
    ${top.length ? `<h4>Kernwoorden</h4><div class="senses">${top.map(([w, n]) => `<span class="on">${esc(w)} · ${n}</span>`).join('')}</div>` : ''}
    ${tips.length ? `<h4>Tips</h4>${tips.map(t => `<div class="tip">${t}</div>`).join('')}` : ''}`;
}

/* ----- "Ik zit vast": ideas from rules + your own text ----- */
function pick(arr, n, seed){
  const a = arr.slice(); let s = seed * 9301 + 49297;
  for (let i = a.length - 1; i > 0; i--){ s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, n);
}
function ideas(){
  const text = currentId ? ta.value : '';
  const A = analyse(text), nW = A.words.length;
  const pool = [];
  const add = (k, q, w, opts = {}) => pool.push({k, q, w, ...opts});
  if (nW < 15){
    const starters = [
      ['Begin klein', 'Beschrijf wat je nu ziet, alsof je het voor iemand opschrijft die blind is.', 'Concreet beginnen haalt de druk eraf.'],
      ['Herinnering', 'Schrijf over een geur uit je jeugd. Waar was je? Wie was er bij?', 'Geuren openen herinneringen als geen ander zintuig.'],
      ['Eerste zin', 'Begin met: “Niemand wist dat ik…” en schrijf vijf minuten door.', 'Een geheim is een sterke motor voor een tekst.'],
      ['Brief', 'Schrijf een brief aan iemand die je nooit meer gesproken hebt.', 'Een lezer in gedachten maakt schrijven persoonlijker.'],
      ['Lijstje', 'Maak een lijst van tien dingen die je deze week opvielen. Kies er één en schrijf verder.', 'Lijsten zijn een makkelijke opwarmer.'],
      ['Dialoog', 'Twee mensen wachten op een perron. De trein heeft vertraging. Schrijf alleen wat ze zeggen.', 'Dialoog schrijft vaak sneller dan beschrijving.'],
      ['Ochtendpagina', 'Schrijf drie pagina’s wat er in je opkomt, zonder te stoppen. Kwaliteit doet er niet toe.', 'De klassieke oefening van Julia Cameron.'],
      ['Object', 'Pak het dichtstbijzijnde voorwerp. Wie had het hiervoor? Wat heeft het meegemaakt?', 'Een voorwerp met een verleden is een verhaal.']
    ];
    for (const s of starters) add(...s);
    add('Sprint', 'Zet een sprint van 10 minuten en schrijf zonder één keer te stoppen.', 'Je innerlijke criticus kan niet bijhouden.', {sprint: 10});
    return pick(pool, 3, ideaSeed);
  }
  const fiction = /[“"„«]/.test(text) || (A.clean.match(/\b(zei|vroeg|keek|liep|hij|zij)\b/gi) || []).length > nW * 0.025;
  const lastSentence = A.sentences.length ? A.sentences[A.sentences.length - 1].text : '';
  const firstSentence = A.sentences.length ? A.sentences[0].text : '';
  const kw = Object.entries(A.freq).filter(x => x[1] >= 2).sort((a, b) => b[1] - a[1]).map(x => x[0]).slice(0, 5);
  const recent = A.content.slice(-80).map(x => x.lw).filter(w => w.length >= 5 && !kw.includes(w));
  const fresh = [...new Set(recent)].slice(-6);
  const senses = Object.entries(SENSES).filter(([k, re]) => !(A.clean.match(re) || []).length).map(x => x[0]);
  const hasDialog = /[“"„«‘][^”"»’\n]{2,}[”"»’]/.test(text);
  const q = w => '«' + esc(w) + '»';

  if (fiction){
    if (!hasDialog) add('Dialoog', 'Laat iemand iets zeggen wat hij of zij eigenlijk niet wil zeggen.', 'Er staat nog geen dialoog in je tekst. Een uitspraak brengt leven en spanning.');
    if (senses.length) { const s = senses[(ideaSeed) % senses.length]; add('Zintuig', {zien:'Wat valt je personage op als het nu om zich heen kijkt? Eén detail is genoeg.', horen:'Welk geluid is er op dit moment? Iets ver weg, of juist heel dichtbij?', ruiken:'Wat ruikt je personage hier? Laat de geur iets oproepen.', proeven:'Laat je personage iets eten of drinken. Hoe smaakt het — en waar doet het aan denken?', voelen:'Wat voelt je personage lichamelijk? Kou, een stoel die knelt, een hand op een schouder.'}[s], 'Je gebruikt “' + s + '” nog niet in deze tekst.'); }
    add('Wending', 'Laat iets misgaan. Wat is het ergste dat er nu zou kunnen gebeuren?', 'Problemen zijn brandstof voor een verhaal.');
    add('Verlangen', 'Wat wil je hoofdpersoon op dit moment het allerliefst — en wat houdt dat tegen?', 'Verlangen + obstakel = beweging.');
    add('Tijdsprong', 'Begin de volgende alinea met “Een uur later…” of “Die nacht…”.', 'Niet alles hoeft beschreven; een sprong houdt tempo.');
    add('Perspectief', 'Schrijf dezelfde scène een paar zinnen lang vanuit iemand anders die erbij is.', 'Een ander perspectief laat zien wat je nog mist.');
    add('Geheim', 'Wat weet je hoofdpersoon dat de anderen niet weten? Laat het bijna uitlekken.', 'Geheimen geven elke zin een onderstroom.');
    add('Lichaam', 'Laat een emotie zien via het lichaam in plaats van haar te benoemen.', 'Show, don’t tell: trillende handen zeggen meer dan “ze was bang”.');
  } else {
    add('Voorbeeld', 'Geef een concreet voorbeeld of een korte anekdote bij je laatste punt.', 'Voorbeelden maken een betoog geloofwaardig en onthoudbaar.');
    add('Tegenwerping', 'Wat zou een criticus zeggen van je laatste alinea? Schrijf die tegenwerping op en reageer erop.', 'Een tegengeluid maakt je tekst sterker.');
    add('Kern', 'Vat in één zin samen wat je lezer moet onthouden. Is je tekst daar al naartoe aan het werken?', 'Een heldere kern geeft richting aan de rest.');
    add('Lezersvraag', 'Welke vraag heeft je lezer nu? Beantwoord die in de volgende alinea.', 'Schrijven is een gesprek met iemand die niet terug kan praten.');
    add('Persoonlijk', 'Vertel een moment uit je eigen leven dat dit onderwerp raakt.', 'Persoonlijke ervaring maakt een tekst warm.');
    add('Structuur', 'Zet je volgende punten eerst als kopjes (##) neer. Vul ze daarna één voor één in.', 'Een skelet maakt een lege pagina minder eng.');
    add('Waarom', 'Vraag drie keer “waarom?” bij je laatste bewering en schrijf de antwoorden op.', 'Zo kom je bij de echte reden onder je argument.');
  }
  for (const w of kw.slice(0, 3)){
    add('Uit je tekst', `Wat weet je lezer nog niet over ${q(w)}?`, `${q(w)} komt ${A.freq[w]}× voor — het is duidelijk belangrijk. Graaf dieper.`);
    add('Uit je tekst', fiction ? `Wat als ${q(w)} ineens verdwijnt, kapotgaat of verandert?` : `Wat zou er gebeuren als ${q(w)} er niet was?`, 'Iets wegnemen laat zien waarom het ertoe doet.');
  }
  if (fresh.length){ const w = fresh[ideaSeed % fresh.length]; add('Uit je tekst', `Beschrijf ${q(w)} alsof je het voor het eerst ziet.`, 'Je noemde het net. Zoom erop in met één verrassend detail.'); }
  if (lastSentence){
    add('Doorschrijven', `Je laatste zin: “${esc(lastSentence.slice(0, 120))}${lastSentence.length > 120 ? '…' : ''}” — stel jezelf de vraag “En toen?” en schrijf het eerste antwoord op.`, 'Het eerste antwoord is vaak goed genoeg om op door te gaan.');
    const startWord = fiction ? ['Maar', 'Toen', 'Plotseling', 'Niemand'][ideaSeed % 4] : ['Maar', 'Bijvoorbeeld', 'Toch', 'Stel je voor'][ideaSeed % 4];
    add('Zinsbegin', `Begin je volgende zin met “${startWord}…”`, 'Een vast beginwoord duwt je een richting op.');
  }
  if (firstSentence && A.sentences.length > 8) add('Terug naar het begin', `Je begon met: “${esc(firstSentence.slice(0, 110))}${firstSentence.length > 110 ? '…' : ''}” — wat beloofde die zin, en heb je dat al waargemaakt?`, 'Het begin wijst vaak de weg naar het vervolg.');
  add('Slechtste versie', 'Schrijf het slechtst denkbare vervolg. Overdrijf. Vaak zit er iets bruikbaars in.', 'Perfectionisme is de grootste blokkade.');
  add('Sprint', 'Zet een sprint van 10 minuten. Niet stoppen, niet verbeteren, niet teruglezen.', 'Snelheid verslaat twijfel.', {sprint: 10});
  add('Overslaan', 'Sla dit stuk over: zet ++hier nog iets++ neer en schrijf de scène of het punt dat je wél voor je ziet.', 'Je hoeft niet op volgorde te schrijven.');
  // keep variety: one from the text, one craft technique, one wildcard
  const fromText = pool.filter(p => /Uit je tekst|Doorschrijven|Terug|Zintuig|Dialoog/.test(p.k));

async function srcUpsert(row){
  if (!sbUser) throw new Error('Niet ingelogd');
  const payload = {...stripLocal(row), user_id: sbUser.id}; if (noGrpCol) delete payload.grp;
  let { error } = await sb.from('sources').upsert(payload);
  if (error && /grp/.test(error.message || '') && !noGrpCol){ noGrpCol = true; delete payload.grp; ({ error } = await sb.from('sources').upsert(payload)); }
  if (error) throw error;
}

async function srcPull(){
  if (!sbUser) return;

  if (error && /grp/.test(error.message || '') && !noGrpCol){ noGrpCol = true; ({ data, error } = await sb.from('sources').select(srcMeta()).order('updated', {ascending:false}).limit(2000)); }
  if (error){ if (/sources/.test(error.message || '')) srcTableMissing = true; return; }
  srcTableMissing = false;
  const next = {};
  for (const r of data) next[r.id] = srcRow(r);
  // keep local items still being saved
  for (const [id, s] of Object.entries(sources)) if (s._pending && !next[id]) next[id] = s;

}

const srcRow = r => ({id:r.id, grp:r.grp||'', kind:r.kind||'article', url:r.url||'', title:r.title||'', site:r.site||'', byline:r.byline||'', published:r.published||'', excerpt:r.excerpt||'', tags:Array.isArray(r.tags) ? r.tags : [], note:r.note||'', fav:!!r.fav, created:Number(r.created)||Date.now(), updated:Number(r.updated)||Date.now()});
function srcRealtime(p){
  if (p.eventType === 'DELETE'){ if (p.old && sources[p.old.id]){ delete sources[p.old.id]; delete srcContent[p.old.id]; } }
  else if (p.new && p.new.user_id === sbUser.id){
    const local = sources[p.new.id];
    if (local && local._editing && Date.now() - local._editing < 3000) return;
    sources[p.new.id] = srcRow(p.new);
    if (typeof p.new.content === 'string' && p.new.content) srcContent[p.new.id] = p.new.content;

async function callFn(body){
  const { data, error } = await sb.functions.invoke(CFG.bronnenFunction || 'bronnen', {body});
  if (error){
    let msg = error.message || 'Fout', status = 0;
    const ctx = error.context;
    if (ctx && typeof ctx.status === 'number'){
      status = ctx.status;
      try { const t = await ctx.text(); try { const j = JSON.parse(t); msg = j.error || j.msg || j.message || t; } catch(_){ if (t) msg = t; } } catch(_){}
    }
    srcFnOk = false;
    if (status === 404) msg = 'Edge Function “bronnen” niet gevonden (404) — controleer of hij precies zo heet';
    else if (status === 401) msg = 'Geen toegang tot de Edge Function (401) — log opnieuw in';
    else if (status === 503 || /BOOT_ERROR|boot/i.test(msg)) msg = 'De Edge Function start niet op (' + (status || 'boot error') + ') — kijk bij Logs in Supabase';
    else if (!status) msg = 'Kan de Edge Function niet bereiken: ' + (error.name || '') + ' ' + (error.message || '');
    else msg = 'Edge Function fout ' + status + ': ' + String(msg).slice(0, 200);
    lastFnError = msg;
    throw new Error(msg);
  }
  srcFnOk = true; lastFnError = '';
  if (data && data.error) throw new Error(data.error);
  return data;
}

async function saveFromUrl(raw, hint = {}, opts = {}){
  if (!requireLogin()) return null;
  let url = String(raw || '').trim();
  const m = url.match(/https?:\/\/\S+/); if (m) url = m[0];
  else if (/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(url)) url = 'https://' + url;
  try { new URL(url); } catch(e){ toast('Dat lijkt geen geldige link'); return null; }
  const dup = Object.values(sources).find(s => s.url && normUrl(s.url) === normUrl(url));
  if (dup){ toast('Die had je al bewaard'); if (!opts.stay) openSource(dup.id); return dup.id; }
  const id = uid(), now = Date.now();
  const s = {id, grp: hint.grp ?? defaultProject(), kind:'article', url, title: hint.title || host(url) || url, site: hint.site || host(url), byline:'', published:'', excerpt: hint.excerpt || '', tags: hint.tags || [], note:'', fav:false, created:now, updated:now, _pending:true};
  sources[id] = s; persistSources();
  if (opts.onCreated) opts.onCreated(id);
  if (!opts.stay){ setView('sources'); openSource(id); } else renderLib();
  try { await srcUpsert(stripLocal(s)); } catch(e){ toast('Bewaren mislukt: ' + (e.message || e)); delete sources[id]; persistSources(); renderList(); renderReader(); return null; }
  try {
    const a = await callFn({action:'fetch', url});
    Object.assign(s, {url: a.url || url, title: a.title || s.title, site: a.site || s.site, byline: a.byline || '', published: a.published || '', excerpt: a.excerpt || s.excerpt, updated: Date.now()});
    srcContent[id] = a.content || '';
    await srcUpsert({...stripLocal(s), content: a.content || ''});
    toast(a.content ? 'Artikel bewaard' : 'Link bewaard (geen leesbare tekst gevonden)');
  } catch(e){
    toast('Link bewaard — artikel ophalen lukte niet: ' + (e.message || e));
  }
  delete s._pending; persistSources(); renderList(); if (currentSrc === id) renderReader(); if (rpOpen && rpSrc === id) renderResearch();
  if (isBoard()) renderBoard();
  return id;
}
const stripLocal = s => { const o = {...s}; for (const k of Object.keys(o)) if (k.startsWith('_')) delete o[k]; return o; };
async function saveWiki(lang, title, opts = {}){
  if (!requireLogin()) return;
  const url = `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(title.replace(/ /g, '_'))}`;
  const dup = Object.values(sources).find(s => s.url === url);
  if (dup){ toast('Die had je al bewaard'); if (!opts.stay) openSource(dup.id); return dup.id; }
  try {
    const api = `https://${lang}.wikipedia.org/w/api.php?origin=*&format=json&action=query&prop=extracts|info&inprop=url&explaintext=1&exsectionformat=wiki&redirects=1&titles=${encodeURIComponent(title)}`;
    const j = await (await fetch(api)).json();
    const page = Object.values(j.query.pages)[0];
    const content = (page.extract || '').replace(/^(={2,})\s*(.+?)\s*\1\s*$/gm, (m0, eq, h) => (eq.length <= 2 ? '## ' : '### ') + h).replace(/\n{3,}/g, '\n\n').trim();
    const excerpt = content.split('\n\n')[0].slice(0, 380);
    const id = uid(), now = Date.now();
    const s = {id, grp: defaultProject(), kind:'wiki', url: page.fullurl || url, title: page.title, site: 'Wikipedia (' + lang.toUpperCase() + ')', byline:'', published:'', excerpt, tags:[], note:'', fav:false, created:now, updated:now};
    sources[id] = s; srcContent[id] = content; persistSources();
    await srcUpsert({...s, content: content.slice(0, 200000)});
    if (!opts.stay){ setView('sources'); openSource(id); } else renderLib();
    toast('Wikipedia-artikel bewaard'); return id;
  } catch(e){ toast('Wikipedia ophalen mislukt'); return null; }
}

let snippets = LS.get('snippets', {});
let boardTag = '', boardQ = '', snipTableMissing = false;
const persistSnips = () => LS.set('snippets', snippets);
const MONTHS = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const MON_RE = MONTHS.join('|') + '|jan|feb|mrt|apr|jun|jul|aug|sep|sept|okt|nov|dec';
const monthIdx = m => { m = m.toLowerCase(); const i = MONTHS.findIndex(x => x.startsWith(m.slice(0, 3)) || (m === 'mrt' && x === 'maart')); return i; };
/* "12 maart 1953", "maart 1953", "1953-03-12", "12-03-1953", "1953" → {key:'1953-03-12', label} */
function parseDate(str){
  str = String(str || '').trim(); if (!str) return null;
  let m, bc = false;
  if ((m = str.match(/^(.*?)\s*(v\.\s?chr\.?|v\.\s?c\.?|voor christus|bce?)$/i))){ bc = true; str = m[1].trim(); }
  if ((m = str.match(/^(\d{4})-(\d{1,2})(?:-(\d{1,2}))?$/))) return mk(+m[1], +m[2], m[3] ? +m[3] : 0);
  if ((m = str.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/))) return mk(+m[3], +m[2], +m[1]);
  if ((m = str.match(new RegExp('^(\\d{1,2})\\s+(' + MON_RE + ')\\.?\\s+(\\d{1,4})$', 'i')))) return mk(+m[3], monthIdx(m[2]) + 1, +m[1]);
  if ((m = str.match(new RegExp('^(' + MON_RE + ')\\.?\\s+(\\d{1,4})$', 'i')))) return mk(+m[2], monthIdx(m[1]) + 1, 0);
  if ((m = str.match(/^(?:ca\.?\s*|rond\s+)?(\d{1,4})$/i))) return mk(+m[1], 0, 0);
  return null;
  function mk(y, mo, d){
    if (!y || mo > 12 || d > 31) return null;
    if (bc) y = -y;
    const key = String(y + 100000).padStart(6, '0') + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const label = (d ? d + ' ' : '') + (mo ? MONTHS[mo - 1] + ' ' : '') + (y < 0 ? (-y) + ' v.Chr.' : y);
    return {key, label, year: y};
  }
}
/* Find a date inside a piece of text, for pre-filling */
function detectDate(text){
  let bcm = text.match(new RegExp('\\b((?:\\d{1,2}\\s+)?(?:(?:' + MON_RE + ')\\.?\\s+)?\\d{1,4})\\s*v\\.\\s?chr\\.?', 'i'));
  if (bcm && parseDate(bcm[1] + ' v.Chr.')) return parseDate(bcm[1] + ' v.Chr.').label;
  let m = text.match(new RegExp('\\b(\\d{1,2})\\s+(' + MON_RE + ')\\.?\\s+(\\d{4})\\b', 'i'));
  if (m) return `${+m[1]} ${MONTHS[monthIdx(m[2])]} ${m[3]}`;
  m = text.match(new RegExp('\\b(' + MON_RE + ')\\.?\\s+(\\d{4})\\b', 'i'));
  if (m) return `${MONTHS[monthIdx(m[1])]} ${m[2]}`;
  m = text.match(/\b(\d{1,2})-(\d{1,2})-(\d{4})\b/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = text.match(/\b(1[0-9]{3}|20[0-9]{2})\b/); if (m) return m[1];
  return '';
}

/* ----- Supabase ----- */
async function snipUpsert(row){
  if (!sbUser) throw new Error('Niet ingelogd');
  const r = stripLocal(row);
  const payload = {...r, user_id: sbUser.id}; if (noGrpCol) delete payload.grp;
  let { error } = await sb.from('snippets').upsert(payload);
  if (error && /grp/.test(error.message || '') && !noGrpCol){ noGrpCol = true; delete payload.grp; ({ error } = await sb.from('snippets').upsert(payload)); }
  if (error){ snipTableMissing = /does not exist|could not find the table|schema cache/i.test(error.message || '') && !/column/i.test(error.message || ''); throw error; }
}
async function snipPull(){
  if (!sbUser) return;
  const { data, error } = await sb.from('snippets').select('*').order('created', {ascending:false}).limit(5000);
  if (error){ snipTableMissing = /does not exist|could not find the table|schema cache/i.test(error.message || ''); return; }
  snipTableMissing = false;
  const next = {};
  for (const r of data) next[r.id] = snipRow(r);
  for (const [id, s] of Object.entries(snippets)) if (s._pending && !next[id]) next[id] = s;
  snippets = next; persistSnips(); renderLib(); if (isBoard()) renderBoard(); else if (view === 'sources') renderReader(); if (rpOpen) renderResearch();
}
const snipRow = r => ({id:r.id, grp:r.grp||'', source_id:r.source_id||'', text:r.text||'', note:r.note||'', tags:Array.isArray(r.tags) ? r.tags : [], date:r.date||'', color:r.color||'', created:Number(r.created)||Date.now(), updated:Number(r.updated)||Date.now()});
function snipRealtime(p){
  if (p.eventType === 'DELETE'){ if (p.old) delete snippets[p.old.id]; }
  else if (p.new && p.new.user_id === sbUser.id){
    const l = snippets[p.new.id]; if (l && l._editing && Date.now() - l._editing < 3000) return;
    snippets[p.new.id] = snipRow(p.new);
  }
  persistSnips(); renderLib();
  if (isBoard() && !(document.activeElement && document.activeElement.closest && document.activeElement.closest('#board'))) renderBoard();
}
async function saveSnippet(s, isNew){
  s.updated = Date.now(); if (isNew) s._pending = true;
  snippets[s.id] = s; persistSnips(); renderLib();
  if (isBoard()) renderBoard(); if (view === 'sources') renderReader();
  try { await snipUpsert(s); delete s._pending; persistSnips(); return true; }
  catch(e){
    if (isNew){ delete snippets[s.id]; persistSnips(); if (isBoard()) renderBoard(); if (view === 'sources') renderReader(); }
    toast((snipTableMissing ? 'Tabel “snippets” niet gevonden — draai schema.sql in Supabase. ' : 'Fragment bewaren mislukt: ') + (e.message || e) + (e.code ? ' [' + e.code + ']' : ''));
    return false;
  }
}
async function removeSnippet(id){
  const s = snippets[id]; if (!s) return;
  delete snippets[id]; persistSnips(); renderLib(); if (isBoard()) renderBoard(); if (view === 'sources') renderReader();
  try { const { error } = await sb.from('snippets').delete().eq('id', id); if (error) throw error; }
  catch(e){ snippets[id] = s; persistSnips(); if (isBoard()) renderBoard(); toast('Verwijderen mislukt'); }
}

/* ----- Insert text into the sheet you last worked on ----- */
function insertIntoSheet(block, msg){
  let id = currentId && sheets[currentId] && !sheets[currentId].trashed ? currentId : null;
  if (!id){
    id = uid(); sheets[id] = {body:'', group:'inbox', fav:false, trashed:false, goal:0, created:Date.now(), updated:Date.now()};
    currentId = id; LS.set('current', id); ta.value = '';
  }
  const sh = sheets[id], v = sh.body || '';
  let pos = id === currentId && ta.value === v ? ta.selectionEnd : v.length; if (!pos) pos = v.length;
  const before = v.slice(0, pos), after = v.slice(pos);
  const pre = !before ? '' : before.endsWith('\n\n') ? '' : before.endsWith('\n') ? '\n' : '\n\n';
  const body = before + pre + block + '\n\n' + after.replace(/^\n+/, '');
  sh.body = body; sh.updated = Date.now();
  if (id === currentId){ ta.value = body; const p = (before + pre + block + '\n\n').length; ta.setSelectionRange(p, p); curWords = countWords(body); renderMirror(); }
  saveSheet(id, true); renderLib();
  toast((msg || 'Toegevoegd aan') + ' “' + titleOf(sh) + '”');
}
function quoteBlock(text, src){
  const quote = text.split(/\n+/).map(l => '> ' + l.trim()).filter(l => l.length > 2).join('\n>\n');
  if (!src) return quote;
  const ref = src.url ? `[${src.title.replace(/[\[\]]/g, '')}](${src.url})` : src.title;
  return `${quote}\n> — ${src.site && src.kind !== 'note' ? src.site + ', ' : ''}${ref}`;
}

/* ----- Board views ----- */
const isBoard = () => view === 'board' || view === 'timeline';
function boardFiltered(){
  const q = boardQ.trim().toLowerCase();
  return Object.values(snippets).filter(s => {
    if (!projMatch(s)) return false;
    if (boardTag === '__nodate') { if (parseDate(s.date)) return false; }
    else if (boardTag && !(s.tags || []).includes(boardTag)) return false;
    if (!q) return true;
    const src = sources[s.source_id];
    return [s.text, s.note, s.date, (s.tags || []).join(' '), src ? src.title : ''].join(' ').toLowerCase().includes(q);
  });
}
function card(s){
  const src = sources[s.source_id], d = parseDate(s.date);

function renderBoard(){

      <button class="ib back" data-a="blib" title="Bibliotheek"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="seg"><button data-goview="board" class="${!tl ? 'on' : ''}">Braindump</button><button data-goview="timeline" class="${tl ? 'on' : ''}">Tijdlijn</button></div>
      <div class="grow"></div>
      <div class="search" style="margin:0;width:min(260px,40vw)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="boardQ" type="search" placeholder="Zoeken…" value="${esc(boardQ)}"></div>
    </div>

/* ================= Projecten, plakken & snel bewaren, onderzoekspaneel ================= */
let projFilter = LS.get('projFilter', '');           // '' = alle, '__none' = zonder project, anders groep-id

const grpColor = id => (groups.find(g => g.id === id) || {}).color || 'var(--line)';

/* ----- Paste to save ----- */
const isUrl = t => /^https?:\/\/\S+$/.test(t) || /^www\.\S+\.\S+$/.test(t);
function boardLink(url){
  const snipId = uid();
  saveFromUrl(url, {}, {stay: true, onCreated: id => saveSnippet({id: snipId, source_id: id, grp: defaultProject(), text: url, note:'', tags: boardTag && boardTag !== '__nodate' ? [boardTag] : [], date:'', color:'', created: Date.now(), updated: Date.now()}, true)})
    .then(id => { const s = sources[id], sn = snippets[snipId]; if (s && sn && sn.text === url){ sn.text = s.title + (s.excerpt ? '\n\n' + s.excerpt : ''); saveSnippet(sn, false); } });
}
function quickThought(text){
  return saveSnippet({id: uid(), source_id:'', grp: defaultProject(), text, note:'', tags: boardTag && boardTag !== '__nodate' && isBoard() ? [boardTag] : [], date:'', color:'', created: Date.now(), updated: Date.now()}, true);
}
document.addEventListener('paste', e => {
  const text = ((e.clipboardData && e.clipboardData.getData('text')) || '').trim(); if (!text) return;

  if ($('#modal').classList.contains('open')) return;
  if (view === 'sources'){ e.preventDefault(); url ? saveFromUrl(url) : snippetDialog({text}); }
  else if (isBoard()){ e.preventDefault(); url ? boardLink(url) : quickThought(text).then(ok => ok && toast('Op de braindump gezet')); }
});

/* ================= Onderzoekspaneel ================= */
let rpOpen = LS.get('rpOpen', false), rpTab = 'related', rpQ = '', rpMode = 'mine', rpSrc = null, rpResults = [], rpServerHits = null;
const stem = w => { if (w.length > 4) w = w.replace(/(tjes|etjes|jes|tje|je|heden|en|es|s|e)$/, ''); return w.slice(0, 7); };
function tokens(text){
  const out = new Set();
  for (const m of String(text || '').toLowerCase().matchAll(/[\p{L}][\p{L}’'-]{3,}/gu)) if (!STOP.has(m[0])) out.add(stem(m[0]));
  return out;
}
function currentParagraph(){
  const v = ta.value, p = ta.selectionStart || 0;
  let a = v.lastIndexOf('\n\n', p - 1); a = a < 0 ? 0 : a + 2;
  let b = v.indexOf('\n\n', p); if (b < 0) b = v.length;
  let para = v.slice(a, b);
  if (tokens(para).size < 4) para = v.slice(Math.max(0, p - 700), p + 200);
  return para.replace(/\+\+[\s\S]*?\+\+/g, ' ');
}
function related(){
  const sh = sheets[currentId]; if (!sh) return {items: [], words: []};
  const para = tokens(currentParagraph()), title = tokens(titleOf(sh));
  const score = (txt, grp) => {
    const t = tokens(txt); let s = 0; const hit = [];
    for (const w of t){ if (para.has(w)){ s += 1; hit.push(w); } else if (title.has(w)) s += 0.5; }
    if (s && grp && grp === sh.group) s += 1;
    return {s, hit};
  };
  const items = [];
  for (const n of Object.values(snippets)){ const src = sources[n.source_id]; const r = score(n.text + ' ' + n.note + ' ' + (n.tags || []).join(' ') + ' ' + (src ? src.title : ''), n.grp); if (r.s >= 1) items.push({type:'snip', x:n, ...r}); }
  for (const s of Object.values(sources)){ const r = score(s.title + ' ' + s.excerpt + ' ' + s.note + ' ' + (s.tags || []).join(' '), s.grp); if (r.s >= 1) items.push({type:'src', x:s, ...r}); }
  items.sort((a, b) => b.s - a.s);
  return {items: items.slice(0, 10), para};
}
function rpItem(it){
  if (it.type === 'snip'){
    const n = it.x, src = sources[n.source_id], d = parseDate(n.date);
    return `<div class="rpi"><div class="rpk">Fragment${src ? ' · ' + esc(src.site || host(src.url)) : ''}${d ? ' · ' + esc(d.label) : ''}</div>
      <div class="rpt">${esc(n.text)}</div>${it.hit && it.hit.length ? `<div class="rph">past bij: ${it.hit.slice(0, 4).map(esc).join(', ')}</div>` : ''}
      <div class="rpa"><button data-rpins="${n.id}">Invoegen</button>${src ? `<button data-rpread="${src.id}">Bron lezen</button>` : ''}</div></div>`;
  }
  const s = it.x;
  return `<div class="rpi"><div class="rpk">${esc(KIND[s.kind] || 'Bron')} · ${esc(s.site || host(s.url))}</div>
    <div class="rpt"><b>${esc(s.title)}</b>${s.note ? '<br>✎ ' + esc(s.note) : s.excerpt ? '<br>' + esc(s.excerpt) : ''}</div>${it.hit && it.hit.length ? `<div class="rph">past bij: ${it.hit.slice(0, 4).map(esc).join(', ')}</div>` : ''}
    <div class="rpa"><button data-rpread="${s.id}">Lezen</button></div></div>`;
}
function renderResearch(){

      (items.length ? items.map(rpItem).join('') : `<div class="empty" style="padding:20px 6px">${cat('curious')}Nog niets in je verzameling dat bij deze alinea past.<br>Probeer <a href="#" data-rptab="search" style="color:var(--accent);font-weight:800">Zoeken</a> — ook in Wikipedia of op internet.</div>`);

      <div class="seg" style="margin-bottom:12px;display:inline-flex"><button data-rpmode="mine" class="${rpMode === 'mine' ? 'on' : ''}">Verzameling</button><button data-rpmode="wiki" class="${rpMode === 'wiki' ? 'on' : ''}">Wikipedia</button><button data-rpmode="web" class="${rpMode === 'web' ? 'on' : ''}">Web</button></div>

function rpSearchHtml(){
  const q = rpQ.trim().toLowerCase();

    const tag = q.startsWith('#') ? q.slice(1) : null;
    const hit = x => tag ? (x.tags || []).some(t => t.toLowerCase() === tag) : null;
    const sn = Object.values(snippets).filter(n => hit(n) ?? [n.text, n.note, (n.tags || []).join(' ')].join(' ').toLowerCase().includes(q)).map(x => ({type:'snip', x}));
    const sr = Object.values(sources).filter(s => hit(s) ?? ((rpServerHits && rpServerHits.has(s.id)) || [s.title, s.excerpt, s.note, (s.tags || []).join(' ')].join(' ').toLowerCase().includes(q))).map(x => ({type:'src', x}));
    const all = [...sn, ...sr];
    return all.length ? all.slice(0, 40).map(rpItem).join('') : '<p class="muted">Niets gevonden in je verzameling.</p>';

/* ================= Nog uitzoeken (??, [check]), opzoeken en [[links]] ================= */

/* ----- 1. Nog uitzoeken ----- */
const TODO_RE = /\?\?|\[check(?::\s*([^\]\n]*))?\]/gi;
let todoScope = LS.get('todoScope', 'sheet');      // 'sheet' | 'project'
function todosIn(id){
  const v = (sheets[id] && sheets[id].body) || '', out = [];
  for (const m of v.matchAll(TODO_RE)){
    const i = m.index;
    let start = Math.max(v.lastIndexOf('\n', i - 1), v.lastIndexOf('. ', i - 1) + 1, v.lastIndexOf('! ', i - 1) + 1, v.lastIndexOf('? ', i - 1) + 1);
    if (start < 0) start = 0;
    const sentence = v.slice(start, i).replace(/^[\s.!?#>*-]+/, '').replace(/\+\+/g, '').trim();
    const q = (m[1] || '').trim();
    let pa = v.lastIndexOf('\n\n', i); pa = pa < 0 ? 0 : pa + 2; let pb = v.indexOf('\n\n', i); if (pb < 0) pb = v.length;
    out.push({sheet: id, index: i, len: m[0].length, marker: m[0], question: q, text: q || sentence || '(leeg)', context: sentence, para: v.slice(pa, pb)});
  }
  return out;
}
function allTodos(){
  const cur = sheets[currentId]; if (!cur) return [];
  if (todoScope === 'sheet') return todosIn(currentId);
  const g = cur.group || 'inbox';
  return Object.entries(sheets).filter(([, s]) => !s.trashed && (s.group || 'inbox') === g).flatMap(([id]) => todosIn(id));
}
function todoKeywords(t){
  if (typeof termsFrom === 'function' && t.para){
    const own = termsFrom(t.question || t.context), all = termsFrom(t.para);
    const parts = [...own.names, ...all.names.filter(n => !own.names.includes(n))].slice(0, 3);
    const keys = [...own.keys, ...all.keys].filter(k => !/^(gebeurde|precies|eigenlijk|ongeveer|gebeurd|wanneer|waarom|hoeveel)$/.test(k));
    const q = [...parts, ...keys.slice(0, parts.length ? 1 : 3)].join(' ').trim();
    if (q) return q;
  }
  const words = [...String(t.question || t.context).matchAll(/[\p{L}\p{N}][\p{L}\p{N}’'-]*/gu)].map(m => m[0]).filter(w => w.length > 2 && !STOP.has(w.toLowerCase()));
  const names = words.filter(w => /^\p{Lu}/u.test(w));
  return [...new Set([...names, ...words])].slice(0, 5).join(' ');
}

  const list = allTodos();

  if (!list.length) return scope + `<div class="empty" style="padding:16px 6px">${cat('happy')}Niets meer uit te zoeken.<br><span class="muted">Typ <b>??</b> achter iets wat je nog moet nakijken, of <b>[check: je vraag]</b>.</span></div>`;
  return scope + list.map((t, i) => `<div class="rpi todo-i"><div class="rpk">Nog uitzoeken${multi && t.sheet !== currentId ? ' · ' + esc(titleOf(sheets[t.sheet])) : ''}</div>
    <div class="rpt">${esc(t.text)}</div>
    <div class="answer" data-answer="${i}"><span class="muted">Antwoord zoeken…</span></div>
    <div class="rpa"><button data-todo="find" data-ti="${i}">Zoek</button><button data-todo="wiki" data-ti="${i}">Wikipedia</button><button data-todo="web" data-ti="${i}">Web</button><button data-todo="go" data-ti="${i}" class="ghost">Ga naar</button><button data-todo="done" data-ti="${i}" class="ok">✓ Klaar</button></div></div>`).join('');

let todoList = [];

  const t = todoList[i]; if (!t) return;

/* ----- 2. Opzoeken ----- */
let rpLookup = null;          // {term, wiki, dict, mine}
function wikitextToText(s){
  return s.replace(/\{\{[^{}]*\}\}/g, '').replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g, '$1').replace(/'''?/g, '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
}
async function dictLookup(term){
  const tries = [term, term.toLowerCase()].filter((v, i, a) => a.indexOf(v) === i);
  for (const t of tries){
    try {
      const j = await (await fetch(`https://nl.wiktionary.org/w/api.php?action=parse&format=json&origin=*&prop=wikitext&redirects=1&page=${encodeURIComponent(t)}`)).json();
      const wt = j && j.parse && j.parse.wikitext && j.parse.wikitext['*']; if (!wt) continue;
      const nl = (wt.split(/\{\{=nld=\}\}/)[1] || wt).split(/\{\{=[a-z]{2,3}=\}\}/)[0];
      const defs = nl.split('\n').filter(l => /^#[^:*#]/.test(l)).map(l => wikitextToText(l.replace(/^#+/, ''))).filter(Boolean).slice(0, 5);
      const synBlock = (nl.split('{{-syn-}}')[1] || '').split(/\n\{\{-/)[0];
      const syns = [...synBlock.matchAll(/\[\[([^\]|#]+)/g)].map(m => m[1]).filter((v, i, a) => a.indexOf(v) === i).slice(0, 14);
      if (defs.length || syns.length) return {word: t, defs, syns};
    } catch(e){}
  }
  return null;
}
async function wikiSummary(term){
  const lang = LS.get('wikiLang', 'nl');
  const get = async t => { const r = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(t.replace(/ /g, '_'))}`); return r.ok ? r.json() : null; };
  try {
    let s = await get(term);
    if (!s || s.type === 'disambiguation' || !s.extract){
      const j = await (await fetch(`https://${lang}.wikipedia.org/w/api.php?origin=*&format=json&action=query&list=search&srlimit=1&srsearch=${encodeURIComponent(term)}`)).json();
      const hit = j.query.search[0]; if (hit) s = await get(hit.title);
    }
    return s && s.extract ? {lang, title: s.title, extract: s.extract, url: s.content_urls && s.content_urls.desktop.page} : null;
  } catch(e){ return null; }
}
async function lookup(term){
  term = String(term || '').trim().replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, ''); if (!term) return;
  if (term.split(/\s+/).length >= 2){ startDiscover(term, true); return; }
  if (!rpOpen) toggleResearch(true);
  rpSrc = null; rpLookup = {term, loading: true};
  const low = term.toLowerCase();
  rpLookup.mine = [
    ...Object.values(snippets).filter(n => (n.text + ' ' + n.note).toLowerCase().includes(low)).map(x => ({type:'snip', x})),
    ...Object.values(sources).filter(s => (s.title + ' ' + s.excerpt + ' ' + s.note).toLowerCase().includes(low)).map(x => ({type:'src', x}))
  ].slice(0, 8);
  renderResearch();
  const [dict, wiki, more] = await Promise.all([dictLookup(term), wikiSummary(term), wikiHits(term)]);
  if (!rpLookup || rpLookup.term !== term) return;
  Object.assign(rpLookup, {dict, wiki, more: (more || []).filter(m => !wiki || m.title !== wiki.title), loading: false}); renderResearch();
}
function lookupHtml(){

  let h = `<button class="rpback" data-rpa="back">‹ Terug</button><h3 style="margin:6px 0 10px;font-size:19px">${esc(L.term)}</h3>`;

/* ----- 4. [[Links]] ----- */
const LINK_RE = /\[\[([^\]\n|]+)(?:\|[^\]\n]*)?\]\]/g;
function linkTargets(){
  const out = [];
  for (const [id, s] of Object.entries(sheets)) if (!s.trashed && (s.body || '').trim()) out.push({kind:'sheet', id, title: titleOf(s), sub: 'Tekst'});
  for (const s of Object.values(sources)) out.push({kind:'src', id: s.id, title: s.title, sub: KIND[s.kind] || 'Bron'});
  for (const n of Object.values(snippets)) out.push({kind:'snip', id: n.id, title: n.text.split('\n')[0].slice(0, 70), sub: 'Fragment'});
  return out;
}
function resolveLink(title){
  const t = title.trim().toLowerCase();
  const all = linkTargets();
  return all.find(x => x.title.toLowerCase() === t) || all.find(x => x.title.toLowerCase().startsWith(t)) || null;
}
function openTarget(x){
  if (!x){ toast('Niets gevonden met die naam'); return; }
  if (x.kind === 'sheet'){ if (view === 'sources' || isBoard()) setView('all'); openSheet(x.id); ta.focus(); return; }
  if (!rpOpen) toggleResearch(true);
  rpLookup = null;
  if (x.kind === 'src'){ rpSrc = x.id; renderResearch(); return; }
  const n = snippets[x.id];
  if (n && n.source_id && sources[n.source_id]){ rpSrc = n.source_id; renderResearch(); }
  else snippetDialog({id: x.id});
}
/* Links in this sheet and texts that link here (backlinks) */
function linksHtml(){
  const sh = sheets[currentId]; if (!sh) return '';
  const out = [...new Set([...(sh.body || '').matchAll(LINK_RE)].map(m => m[1].trim()))];
  const me = titleOf(sh).toLowerCase();
  const back = Object.entries(sheets).filter(([id, s]) => id !== currentId && !s.trashed && [...(s.body || '').matchAll(LINK_RE)].some(m => m[1].trim().toLowerCase() === me));
  if (!out.length && !back.length) return '';
  return `<div class="linkbox">${out.length ? `<div class="rpk">Links in deze tekst</div><div class="lchips">${out.map(t => { const r = resolveLink(t); return `<button data-link="${esc(t)}" class="${r ? '' : 'miss'}" title="${r ? esc(r.sub) : 'Nog niets met deze naam'}">${esc(t)}</button>`; }).join('')}</div>` : ''}
    ${back.length ? `<div class="rpk" style="margin-top:8px">Verwijzen hierheen</div><div class="lchips">${back.map(([id, s]) => `<button data-opensheet="${id}">${esc(titleOf(s))}</button>`).join('')}</div>` : ''}</div>`;
}
/* Where is a source used? (cited by URL or linked by title) */
function usedIn(src){
  const t = src.title.toLowerCase();
  return Object.entries(sheets).filter(([, s]) => !s.trashed && ((src.url && (s.body || '').includes(src.url)) || [...(s.body || '').matchAll(LINK_RE)].some(m => m[1].trim().toLowerCase() === t)));
}
function usedInHtml(src){

  return `<div class="linkbox"><div class="rpk">Gebruikt in</div><div class="lchips">${u.map(([id, s]) => `<button data-opensheet="${id}">${esc(titleOf(s))}</button>`).join('')}</div></div>`;
}

/* ----- Autocomplete for [[ ----- */
let ac = null;   // {start, items, sel}
function acCheck(){
  const p = ta.selectionStart, before = ta.value.slice(Math.max(0, p - 60), p);
  const m = before.match(/\[\[([^\]\n[]{0,50})$/);
  if (!m || ta.selectionStart !== ta.selectionEnd){ acClose(); return; }
  const q = m[1].toLowerCase();
  const items = linkTargets().filter(x => x.title && x.id !== currentId && (!q || x.title.toLowerCase().includes(q))).sort((a, b) => (a.title.toLowerCase().startsWith(q) ? 0 : 1) - (b.title.toLowerCase().startsWith(q) ? 0 : 1)).slice(0, 8);

/* Keystrokes sent by tools like Logi Options+ often carry no physical key code (e.code is empty).
   Fall back to the virtual key code, then to the key itself. */
function codeOf(e){
  if (e.code && e.code !== 'Unidentified') return e.code;
  const k = e.keyCode || e.which || 0;
  if (k >= 65 && k <= 90) return 'Key' + String.fromCharCode(k);
  if (k >= 48 && k <= 57) return 'Digit' + String.fromCharCode(k);
  if (k >= 112 && k <= 135) return 'F' + (k - 111);
  if (k === 32) return 'Space';
  const key = String(e.key || '');
  if (/^[a-z]$/i.test(key)) return 'Key' + key.toUpperCase();
  if (/^\d$/.test(key)) return 'Digit' + key;
  if (/^F\d{1,2}$/.test(key)) return key;
  return key || '';
}
let lastKeyInfo = '';
/* AltGr (= Ctrl+Alt on many Windows layouts, e.g. US-International) arrives as a typed

const altGr = e => !!(e.getModifierState && e.getModifierState('AltGraph'));
function comboOf(e){
  const parts = [];
  const ag = altGr(e) && !(e.ctrlKey && e.altKey);
  if (e.ctrlKey || e.metaKey || ag) parts.push('Ctrl');
  if (e.altKey || ag) parts.push('Alt');
  if (e.shiftKey) parts.push('Shift');
  if (['Control','Alt','Shift','Meta','AltGraph'].includes(e.key) || [16, 17, 18, 91, 92, 93, 225].includes(e.keyCode)) return null;
  const code = codeOf(e); if (!code) return null;
  parts.push(code);
  return parts.join('+');
}
const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
function prettyCombo(c){
  if (!c) return '—';
  return c.split('+').map(p => p === 'Ctrl' ? (isMac ? '⌘' : 'Ctrl') : p === 'Alt' ? (isMac ? '⌥' : 'Alt') : p === 'Shift' ? '⇧' : p.replace(/^Key/, '').replace(/^Digit/, '').replace('Space', 'Spatie').replace('Arrow', '')).join(isMac ? '' : ' + ');
}
let capturing = null;
document.addEventListener('keydown', e => {
  if (capturing){ e.preventDefault(); e.stopPropagation(); capturing(e); return; }
  const c = comboOf(e); if (!c) return;
  lastKeyInfo = `${prettyCombo(c)}   (code: ${e.code || 'leeg'}, key: ${e.key}, keyCode: ${e.keyCode})`;
  const kt = document.getElementById('keyTest'); if (kt) kt.textContent = lastKeyInfo;
  const usable = /^F\d+$/.test(codeOf(e)) || e.ctrlKey || e.metaKey || e.altKey || altGr(e);
  if (!usable) return;
  const map = keyMap(), id = Object.keys(map).find(k => map[k] === c);
  if (!id) return;
  e.preventDefault(); e.stopPropagation();
  const a = ACTIONS.find(x => x.id === id); if (a) a.run();
}, true);

KIND.book = 'Boek'; KIND.paper = 'Wetenschap';
const netCache = new Map();
async function getJSON(url){
  if (netCache.has(url)) return netCache.get(url);
  const p = fetch(url).then(r => r.ok ? r.json() : null).catch(() => null);
  netCache.set(url, p);
  const v = await p; if (v === null) netCache.delete(url);
  return v;
}
const wikiLang = () => LS.get('wikiLang', 'nl');
async function wpSearch(q, lang, n = 6){
  const j = await getJSON(`https://${lang}.wikipedia.org/w/api.php?origin=*&format=json&action=query&list=search&srlimit=${n}&srsearch=${encodeURIComponent(q)}`);
  return (j && j.query && j.query.search) || [];
}
async function wpSummary(title, lang){
  const s = await getJSON(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title.replace(/ /g, '_'))}`);
  return s && s.extract ? {lang, title: s.title, extract: s.extract, desc: s.description || '', qid: s.wikibase_item || '', thumb: s.thumbnail && s.thumbnail.source, url: s.content_urls && s.content_urls.desktop.page, type: s.type} : null;
}
/* Find the best article for a query; Dutch first, English as fallback */
async function wpBest(q){
  const langs = [wikiLang(), wikiLang() === 'nl' ? 'en' : 'nl'];
  for (const lang of langs){
    const qq = lang === 'en' ? toEnglish(q) : q;
    const hits = await wpSearch(qq, lang, 8);
    if (!hits.length) continue;
    // Pick the hit whose title/snippet best matches the search words, not blindly the first one
    const words = qq.toLowerCase().split(/\s+/).filter(w => w.length > 2 && !STOP.has(w));
    const score = (h, i) => { const t = h.title.toLowerCase(), sn = String(h.snippet || '').replace(/<[^>]+>/g, '').toLowerCase(); let sc = 0; for (const w of words){ if (t.includes(w)) sc += 2; else if (sn.includes(w)) sc += 1; } return sc - i * 0.15; };
    const ranked = hits.map((h, i) => ({h, s: score(h, i)})).sort((a, b) => b.s - a.s);
    if (ranked[0].s < 1 && lang === langs[0]) continue;     // nothing really matches: try the other language
    for (const {h} of ranked.slice(0, 3)){ const s = await wpSummary(h.title, lang); if (s && s.type !== 'disambiguation') return {main: s, hits: ranked.map(x => x.h), lang}; }
  }
  return null;
}

/* Links in the introduction of an article: the most relevant "related topics" */
const NOISE = new RegExp('^(\\d|.*v\\.\\s?Chr|.*eeuw$|' + MONTHS.join('|') + '|januari|BC$|AD$|Help:|Bestand:|Categorie:|Wikipedia:|Sjabloon:)', 'i');
async function wpLeadLinks(title, lang){
  const j = await getJSON(`https://${lang}.wikipedia.org/w/api.php?action=parse&format=json&origin=*&prop=links&section=0&redirects=1&page=${encodeURIComponent(title)}`);
  return ((j && j.parse && j.parse.links) || []).filter(l => l.ns === 0 && ('exists' in l || l.exists !== false)).map(l => l['*'] || l.title).filter(t => t && !NOISE.test(t));
}
async function wpDescriptions(titles, lang){
  if (!titles.length) return {};
  const j = await getJSON(`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=description&redirects=1&titles=${encodeURIComponent(titles.join('|'))}`);
  const out = {}; for (const pg of Object.values((j && j.query && j.query.pages) || {})) if (pg.title) out[pg.title] = pg.description || '';
  return out;
}

/* ----- Wikidata facts ----- */
const PROPS = [
  ['P31','Is een'], ['P585','Datum'], ['P580','Begin'], ['P582','Einde'], ['P569','Geboren'], ['P19','Geboorteplaats'], ['P570','Overleden'], ['P20','Plaats van overlijden'],
  ['P1196','Doodsoorzaak'], ['P157','Gedood door'], ['P710','Betrokkenen'], ['P276','Plaats'], ['P131','Ligt in'], ['P17','Land'], ['P27','Nationaliteit'], ['P106','Beroep'], ['P39','Functie'],
  ['P22','Vader'], ['P25','Moeder'], ['P26','Partner'], ['P40','Kinderen'], ['P571','Opgericht / ontstaan'], ['P576','Opgeheven'], ['P1082','Inwoners'], ['P50','Auteur'], ['P577','Verschenen'], ['P800','Bekend werk'], ['P793','Belangrijke gebeurtenis']
];
const DATE_PROPS = new Set(['P585','P580','P582','P569','P570','P571','P576','P577']);
function wdTime(v){
  const m = /^([+-])(\d+)-(\d\d)-(\d\d)/.exec(v.time || ''); if (!m) return null;
  let y = +m[2]; if (m[1] === '-') y = -y;
  const mo = v.precision >= 10 ? +m[3] : 0, d = v.precision >= 11 ? +m[4] : 0;
  const yy = y < 0 ? `${-y} v.Chr.` : String(y);
  return (d ? d + ' ' : '') + (mo ? MONTHS[mo - 1] + ' ' : '') + yy;
}
async function wdFacts(qid){
  if (!qid) return null;
  const j = await getJSON(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${qid}&props=claims|labels|descriptions&languages=nl|en&format=json&origin=*`);
  const ent = j && j.entities && j.entities[qid]; if (!ent) return null;
  const rows = [], refIds = new Set();
  for (const [pid, label] of PROPS){
    const cl = (ent.claims[pid] || []).filter(c => c.mainsnak && c.mainsnak.datavalue && c.rank !== 'deprecated').slice(0, pid === 'P710' || pid === 'P40' ? 8 : 3);
    if (!cl.length) continue;
    const vals = cl.map(c => {
      const dv = c.mainsnak.datavalue;
      if (dv.type === 'wikibase-entityid'){ refIds.add(dv.value.id); return {ref: dv.value.id}; }
      if (dv.type === 'time') return {text: wdTime(dv.value), date: wdTime(dv.value)};
      if (dv.type === 'quantity') return {text: Number(dv.value.amount).toLocaleString('nl-NL')};
      if (dv.type === 'string') return {text: dv.value};
      if (dv.type === 'monolingualtext') return {text: dv.value.text};
      return null;
    }).filter(Boolean);
    if (vals.length) rows.push({pid, label, vals});
  }
  const ids = [...refIds].slice(0, 45);
  const labels = {};
  if (ids.length){
    const lj = await getJSON(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${ids.join('|')}&props=labels|sitelinks&sitefilter=nlwiki|enwiki&languages=nl|en&format=json&origin=*`);
    for (const [id, e] of Object.entries((lj && lj.entities) || {})){
      const l = e.labels && (e.labels.nl || e.labels.en);
      const sl = e.sitelinks && (e.sitelinks.nlwiki ? {lang:'nl', title: e.sitelinks.nlwiki.title} : e.sitelinks.enwiki ? {lang:'en', title: e.sitelinks.enwiki.title} : null);
      labels[id] = {label: l ? l.value : id, wiki: sl};
    }
  }
  for (const r of rows) for (const v of r.vals) if (v.ref){ v.text = (labels[v.ref] || {}).label || v.ref; v.wiki = (labels[v.ref] || {}).wiki; }
  const lab = ent.labels && (ent.labels.nl || ent.labels.en);
  return {qid, label: lab ? lab.value : qid, rows};
}

/* ----- Books (Open Library) & science (OpenAlex) ----- */
async function booksFor(q){
  const j = await getJSON(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=5&fields=key,title,author_name,first_publish_year,publisher,language,subject`);
  return ((j && j.docs) || []).map(d => ({kind:'book', title: d.title, authors: (d.author_name || []).slice(0, 3).join(', '), year: d.first_publish_year || '', site: 'Open Library', url: 'https://openlibrary.org' + d.key, excerpt: (d.subject || []).slice(0, 6).join(', ')}));
}
function oaAbstract(inv){
  if (!inv) return '';
  const words = []; for (const [w, pos] of Object.entries(inv)) for (const p of pos) words[p] = w;
  return words.join(' ').slice(0, 600);
}
async function papersFor(q){
  const j = await getJSON(`https://api.openalex.org/works?search=${encodeURIComponent(q)}&per-page=5&select=id,doi,title,publication_year,authorships,primary_location,abstract_inverted_index,cited_by_count`);
  return ((j && j.results) || []).filter(w => w.title).map(w => ({kind:'paper', title: w.title, authors: (w.authorships || []).slice(0, 3).map(a => a.author && a.author.display_name).filter(Boolean).join(', '), year: w.publication_year || '', site: (w.primary_location && w.primary_location.source && w.primary_location.source.display_name) || 'OpenAlex', url: w.doi || w.id, excerpt: oaAbstract(w.abstract_inverted_index), cited: w.cited_by_count || 0}));
}

/* ----- Term extraction from your paragraph ----- */
function termsFrom(text){
  text = String(text || '').replace(/\+\+[\s\S]*?\+\+/g, ' ').replace(/\[\[|\]\]/g, ' ').replace(/[#>*_=`]/g, ' ');
  const names = [], seen = new Set();
  for (const m of text.matchAll(/(^|[^\p{L}])(\p{Lu}[\p{L}’'-]+(?:\s+(?:van|de|der|den|von|la|le)?\s*\p{Lu}[\p{L}’'-]+)*)/gu)){
    const w = m[2].trim(), low = w.toLowerCase();
    const sentenceStart = /(^|[.!?]\s*|\n\s*)$/.test(text.slice(0, m.index + m[1].length));
    if (STOP.has(low) || low.length < 3 || (sentenceStart && STOP.has(low.split(' ')[0]))) continue;
    if (sentenceStart && !/\s/.test(w) && text.split(w).length < 3 && STOP.has(low)) continue;
    if (!seen.has(low)){ seen.add(low); names.push(w); }
  }
  const counts = {};
  for (const m of text.toLowerCase().matchAll(/[\p{L}][\p{L}’'-]{3,}/gu)){ const w = m[0]; if (STOP.has(w) || seen.has(w)) continue; counts[w] = (counts[w] || 0) + 1 + (w.length > 6 ? 0.5 : 0); }
  const keys = Object.entries(counts).sort((a, b) => b[1] - a[1]).map(x => x[0]).filter(w => !names.some(n => n.toLowerCase().includes(w)));
  return {names: names.slice(0, 5), keys: keys.slice(0, 4)};
}

/* ----- State & rendering ----- */
let disc = null;     // {terms:[{t,on}], data, trail:[{title,lang}], loading}
function discoverContext(){
  const sel = document.activeElement === ta || (ta.selectionEnd > ta.selectionStart) ? ta.value.slice(ta.selectionStart, ta.selectionEnd).trim() : '';
  if (sel) return sel;
  return currentId ? currentParagraph() : '';
}
async function startDiscover(text, allOn){
  const {names, keys} = termsFrom(text || discoverContext());
  const terms = [...names.map(t => ({t, on: true, name: true})), ...keys.map((t, i) => ({t, on: allOn || i < 2}))];
  disc = {terms, trail: [], loading: true, data: null};
  rpTab = 'discover'; rpSrc = null; rpLookup = null;
  if (!rpOpen) toggleResearch(true); else renderResearch();
  if (!terms.length){ disc.loading = false; disc.empty = true; renderResearch(); return; }
  runDiscover();
}
async function runDiscover(explicitTitle, lang){
  const d = disc; if (!d) return;
  d.loading = true; renderResearch();
  const q = explicitTitle || d.terms.filter(x => x.on).map(x => x.t).join(' ');
  const best = explicitTitle ? {main: await wpSummary(explicitTitle, lang || wikiLang()), hits: []} : await wpBest(q);
  if (disc !== d) return;
  const main = best && best.main;
  const L = main ? main.lang : wikiLang();
  const [facts, morelike, lead, books, papers, people, more] = await Promise.all([
    main ? wdFacts(main.qid) : null,
    main ? wpSearch('morelike:' + main.title, L, 6) : [],
    main ? wpLeadLinks(main.title, L) : [],
    booksFor(main ? main.title : q),
    papersFor(main && L === 'en' ? main.title : q),
    explicitTitle ? [] : Promise.all(d.terms.filter(x => x.on && x.name).slice(0, 3).map(async x => {
      const tr = t => L === 'en' ? toEnglish(t) : t;
      const hit = (await wpSearch(tr(x.t + ' ' + d.terms.filter(y => y.on && y !== x).map(y => y.t).join(' ')), L, 1))[0] || (await wpSearch(tr(x.t), L, 1))[0];
      if (!hit || (main && hit.title === main.title)) return null;
      const s = await wpSummary(hit.title, L); if (!s) return null;
      return {name: x.t, s, facts: await wdFacts(s.qid)};
    })),
    explicitTitle ? [] : wikiHits(q)
  ]);
  if (disc !== d) return;
  // Rank: named in the summary or a Wikidata fact > other intro links > search hits > "more like this"
  const ext = main ? main.extract.toLowerCase() : '';
  const factTitles = new Set(((facts && facts.rows) || []).flatMap(r => r.vals.filter(v => v.wiki && v.wiki.lang === L).map(v => v.wiki.title)));
  const scored = new Map();
  const add = (t, sc) => { if (!t || (main && t === main.title)) return; scored.set(t, Math.max(scored.get(t) || 0, sc)); };
  (lead || []).forEach((t, i) => { const base = t.toLowerCase().replace(/\s*\(.*\)$/, ''); const named = ext.includes(base) || ext.includes(base.split(' ').pop()); add(t, (named ? 6 : 3) - i * 0.02); });
  factTitles.forEach(t => add(t, 7));
  ((best && best.hits) || []).slice(1, 4).forEach(h => add(h.title, 2));
  (morelike || []).forEach(h => add(h.title, 1));
  const relTitles = [...scored.entries()].sort((a, b) => b[1] - a[1]).map(x => x[0]).slice(0, 10);
  const descs = await wpDescriptions(relTitles, L);
  const related = relTitles.map(t => ({title: t, desc: descs[t] || ''}));
  d.data = {q, main, facts, related, books, papers, people: (people || []).filter(Boolean), lang: L, more: (more || []).filter(m => !main || m.title !== main.title)};
  d.loading = false; renderResearch();
}
function moreHtml(list){
  return `<div class="rpk dsec">Meer op Wikipedia</div><div class="rel">${list.map(w => `<button data-dexp="${esc(w.title)}" data-dlang="${w.lang}"><b>${esc(w.title)} <small class="lg">${w.lang.toUpperCase()}</small></b>${w.desc ? `<span>${esc(w.desc)}</span>` : ''}</button>`).join('')}</div>`;
}
function factRowsHtml(f, max = 14, compact){
  if (!f || !f.rows.length) return '';
  return `<div class="facts">${f.rows.slice(0, max).filter(r => !compact || ['P31','P569','P570','P585','P580','P19','P20','P106','P276','P17','P710'].includes(r.pid)).map(r => `<div class="fr"><span>${esc(r.label)}</span><div>${r.vals.map(v => v.wiki ? `<button class="fx" data-dexp="${esc(v.wiki.title)}" data-dlang="${v.wiki.lang}">${esc(v.text)}</button>` : DATE_PROPS.has(r.pid) && v.date ? `<span class="fdate">${esc(v.text)}</span><button class="ftl" data-ftl="${esc(r.label)}|${esc(v.date)}|${esc(f.label)}" title="Op je tijdlijn zetten">＋ tijdlijn</button>` : `<span>${esc(v.text)}</span>`).join(' ')}</div></div>`).join('')}</div>`;
}
function discoverHtml(){
  if (!disc) return `<div class="empty" style="padding:20px 6px">${cat('curious')}Schrijf iets (bv. <i>Caesar werd vermoord door Brutus</i>) en druk op <b>Ontdek</b>, of selecteer een paar woorden.</div><div style="text-align:center"><button class="btn" data-dgo="1">Ontdek mijn alinea</button></div>`;
  const d = disc;
  let h = `<div class="dterms">${d.terms.map((x, i) => `<button class="${x.on ? 'on' : ''}" data-dterm="${i}">${esc(x.t)}</button>`).join('')}<button data-dgo="1" title="Opnieuw met je huidige alinea">↻</button><span class="grow"></span><span class="seg dlang"><button data-dlangset="nl" class="${wikiLang() === 'nl' ? 'on' : ''}">NL</button><button data-dlangset="en" class="${wikiLang() === 'en' ? 'on' : ''}">EN</button></span></div>`;
  if (d.trail.length) h += `<div class="dtrail"><button data-dback="1">‹ Terug</button> ${d.trail.map(t => esc(t.title)).join(' › ')}</div>`;
  if (d.empty) return h + '<p class="muted">Geen namen of kernwoorden gevonden in je alinea. Selecteer de woorden die je wilt onderzoeken.</p>';
  if (d.loading) return h + `<div class="dload">${cat('curious')}<p class="muted">Bezig met ontdekken…</p></div>`;
  const D = d.data;
  if (!D || !D.main) return h + `<p class="muted">Niets gevonden op Wikipedia voor “${esc(D ? D.q : '')}”. Zet woorden aan of uit hierboven, of probeer <a href="#" data-rptab="search" style="color:var(--accent);font-weight:800">Zoeken</a>.</p>`;
  const m = D.main;
  h += `<div class="rpi dmain">${m.thumb ? `<img src="${esc(m.thumb)}" alt="" loading="lazy">` : ''}<div class="rpk">Wikipedia${m.lang !== 'nl' ? ' (' + m.lang.toUpperCase() + ')' : ''}${m.desc ? ' · ' + esc(m.desc) : ''}</div>
    <h3 class="dh">${esc(m.title)}</h3><div class="rpt" style="-webkit-line-clamp:9">${esc(m.extract)}</div>
    <div class="rpa"><button data-dsave="main">Bewaar & lees</button><button data-dsnip="main" class="ghost">Als fragment</button>${m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener">Openen ↗</a>` : ''}</div></div>`;
  if (D.more && D.more.length) h += moreHtml(D.more);
  if (D.facts && D.facts.rows.length) h += `<div class="rpk dsec">Feiten · Wikidata</div>` + factRowsHtml(D.facts);
  if (D.people.length) h += `<div class="rpk dsec">Personen & plekken uit je tekst</div>` + D.people.map(p => `<div class="rpi"><div class="rpk">${esc(p.name)} → ${esc(p.s.title)}</div><div class="rpt" style="-webkit-line-clamp:4">${esc(p.s.extract)}</div>${factRowsHtml(p.facts, 8, true)}<div class="rpa"><button data-dexp="${esc(p.s.title)}" data-dlang="${p.s.lang}">Verder ontdekken</button></div></div>`).join('');
  if (D.related.length) h += `<div class="rpk dsec">Verwante onderwerpen</div><div class="rel">${D.related.map(r => `<button data-dexp="${esc(r.title)}" data-dlang="${D.lang}"><b>${esc(r.title)}</b>${r.desc ? `<span>${esc(r.desc)}</span>` : ''}</button>`).join('')}</div>`;
  const lit = [...D.books.slice(0, 3), ...D.papers.slice(0, 3)];
  if (lit.length){
    window.__lit = lit;
    h += `<div class="rpk dsec">Boeken & wetenschap</div>` + lit.map((x, i) => `<div class="rpi"><div class="rpk">${esc(KIND[x.kind])} · ${esc(x.site)}${x.year ? ' · ' + x.year : ''}${x.cited ? ' · ' + x.cited + '× geciteerd' : ''}</div><div class="rpt"><b>${esc(x.title)}</b>${x.authors ? '<br>' + esc(x.authors) : ''}${x.excerpt ? '<br><span class="muted">' + esc(x.excerpt.slice(0, 220)) + (x.excerpt.length > 220 ? '…' : '') + '</span>' : ''}</div><div class="rpa"><button data-dlit="${i}">Bewaar als bron</button><a href="${esc(x.url)}" target="_blank" rel="noopener">Openen ↗</a></div></div>`).join('');
  }
  const mine = related().items.slice(0, 4);
  if (mine.length) h += `<div class="rpk dsec">In je verzameling</div>` + mine.map(rpItem).join('');
  return h;
}
function saveLit(x){
  if (!requireLogin()) return;
  const dup = Object.values(sources).find(s => s.url === x.url); if (dup){ toast('Die had je al bewaard'); return; }
  const id = uid(), now = Date.now();
  const s = {id, grp: defaultProject(), kind: x.kind, url: x.url, title: x.title, site: [x.authors, x.site].filter(Boolean).join(' · '), byline: x.authors || '', published: x.year ? String(x.year) : '', excerpt: x.excerpt || '', tags: [], note: '', fav: false, created: now, updated: now};
  sources[id] = s; srcContent[id] = x.excerpt || ''; persistSources(); renderLib();
  srcUpsert({...s, content: x.excerpt || ''}).then(() => toast(KIND[x.kind] + ' bewaard als bron')).catch(e => { delete sources[id]; persistSources(); toast('Bewaren mislukt: ' + (e.message || e)); });
}
$('#research').addEventListener('click', e => {
  const t = e.target;
  const go = t.closest('[data-dgo]'); if (go){ startDiscover(); return; }
  const ls = t.closest('[data-dlangset]'); if (ls){ LS.set('wikiLang', ls.dataset.dlangset); if (disc){ disc.trail = []; runDiscover(); } return; }
  const tm = t.closest('[data-dterm]'); if (tm){ disc.terms[+tm.dataset.dterm].on = !disc.terms[+tm.dataset.dterm].on; disc.trail = []; runDiscover(); return; }
  const ex = t.closest('[data-dexp]');
  if (ex){ if (!disc || ex.dataset.fromtodo) disc = {terms: [], trail: [], loading: true, data: null}; rpTab = 'discover'; rpSrc = null; rpLookup = null; if (disc.data && disc.data.main) disc.trail.push({title: disc.data.main.title, lang: disc.data.main.lang}); runDiscover(ex.dataset.dexp, ex.dataset.dlang); $('#rpScroll') && ($('#rpScroll').scrollTop = 0); return; }
  const bk = t.closest('[data-dback]'); if (bk && disc){ const prev = disc.trail.pop(); if (prev && disc.trail.length) runDiscover(prev.title, prev.lang); else if (prev){ disc.trail = []; runDiscover(); } return; }
  const sv = t.closest('[data-dsave]');
  if (sv && disc && disc.data && disc.data.main){ const m = disc.data.main; sv.disabled = true; sv.textContent = 'Bewaren…'; saveWiki(m.lang, m.title, {stay: true}).then(id => { if (id){ rpSrc = id; renderResearch(); } }); return; }
  const sn = t.closest('[data-dsnip]');
  if (sn && disc && disc.data && disc.data.main){ const m = disc.data.main; snippetDialog({text: m.extract.split(/(?<=\.)\s/).slice(0, 2).join(' ') + '\n\n(Wikipedia: ' + m.title + ')', date: ''}); return; }
  const tl = t.closest('[data-ftl]');
  if (tl){ const [label, date, subj] = tl.dataset.ftl.split('|'); if (!requireLogin()) return; snippetDialog({text: `${subj} — ${label.toLowerCase()}: ${date}`, date, tags: ['wikidata']}); return; }
  const lt = t.closest('[data-dlit]'); if (lt && window.__lit){ saveLit(window.__lit[+lt.dataset.dlit]); lt.disabled = true; lt.textContent = 'Bewaard'; return; }
}, true);

/* ----- 7. Possible answers for ?? items ----- */
const answerCache = {};
function sentencesOf(t){ return String(t).split(/(?<=[.!?])\s+/).filter(s => s.length > 20); }
async function answerFor(todo){
  const key = todo.text; if (answerCache[key]) return answerCache[key];
  const q = todoKeywords(todo); if (!q) return null;
  const p = (async () => {
    const best = await wpBest(q); if (!best || !best.main) return null;
    const want = tokens(todo.question || todo.context);
    const wantsDate = /wanneer|welk jaar|hoe laat|datum|in welk/i.test(todo.question || todo.context);
    let top = null, score = -1;
    for (const s of sentencesOf(best.main.extract)){ const tk = tokens(s); let sc = 0; for (const w of want) if (tk.has(w)) sc++; if (wantsDate && /\d{3,4}|v\.Chr/.test(s)) sc += 1.5; if (sc > score){ score = sc; top = s; } }
    let fact = null;
    if (wantsDate){ const f = await wdFacts(best.main.qid); const r = f && f.rows.find(r => DATE_PROPS.has(r.pid)); if (r) fact = `${r.label}: ${r.vals.map(v => v.text).join(', ')}`; }
    return {title: best.main.title, lang: best.main.lang, url: best.main.url, sentence: top || sentencesOf(best.main.extract)[0] || best.main.extract.slice(0, 200), fact, confident: score >= 2};
  })();
  answerCache[key] = p;
  return p;
}
function fillAnswers(){
  document.querySelectorAll('[data-answer]').forEach(async el => {
    const t = todoList[+el.dataset.answer]; if (!t || el.dataset.done) return;
    el.dataset.done = '1';
    const a = await answerFor(t);
    if (!a){ el.innerHTML = '<span class="muted">Geen antwoord gevonden — probeer de zoekknoppen.</span>'; return; }
    el.innerHTML = `<div class="ans ${a.confident ? '' : 'weak'}"><div class="rpk">${a.confident ? 'Mogelijk antwoord' : 'Misschien relevant'} · Wikipedia: ${esc(a.title)}</div>
      ${a.fact ? `<div class="ansf">${esc(a.fact)}</div>` : ''}<div>${esc(a.sentence)}</div>
      <div class="rpa"><button data-ansnip="${el.dataset.answer}">Bewaar als fragment</button><button data-dexp="${esc(a.title)}" data-dlang="${a.lang}" data-fromtodo="1" class="ghost">Ontdek</button>${a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">Bron ↗</a>` : ''}</div></div>`;
    el._ans = a;
  });
}
$('#research').addEventListener('click', e => {
  const s = e.target.closest('[data-ansnip]');
  if (s){ const el = document.querySelector(`[data-answer="${s.dataset.ansnip}"]`); const a = el && el._ans; if (!a) return; const t = todoList[+s.dataset.ansnip];
    snippetDialog({text: (a.fact ? a.fact + '\n\n' : '') + a.sentence + '\n\n(Wikipedia: ' + a.title + ')', date: detectDate((a.fact || '') + ' ' + a.sentence), tags: ['uitgezocht']});
    if (t) toast('Tip: vink het punt daarna af met ✓ Klaar'); return; }
}, true);

/* ---------------- Boot ---------------- */
applySettings();
renderLib();
for (const [id, s] of Object.entries(sheets)) if (id !== currentId && !s.trashed && !(s.body || '').trim() && Date.now() - (s.updated || 0) > 10 * 60000){ delete sheets[id]; saveSheet(id, true); }
if (!sheets[currentId]) currentId = null;
openSheet(currentId);
if (!isMobile() && currentId) $('#app').dataset.view = 'editor';
if (rpOpen){ $('#app').classList.add('rp'); $('#btnResearch').classList.add('on'); renderResearch(); }
syncIdle();
$('#nudgeCat').innerHTML = cat('curious');
$('#rdCite').innerHTML = icon('quote',''); $('#rdOpen').innerHTML = icon('ext',''); $('#rdFav').innerHTML = icon('star',''); $('#rdDel').innerHTML = icon('trash','');
if ((view === 'board' || view === 'timeline') && useSupabase){ $('#app').classList.add('boardmode'); renderBoard(); if (isMobile()) $('#app').dataset.view = 'editor'; }
else if (view === 'board' || view === 'timeline') view = 'inbox';
if (view === 'sources'){ if (!useSupabase) view = 'inbox'; else { $('#app').classList.add('srcmode'); $('#q').placeholder = 'Zoeken in bronnen…'; renderList(); renderReader(); } }
connect();
})();
