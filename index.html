<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schrijfkamer</title>
<meta name="theme-color" content="#FBF8F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#24222A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schrijfkamer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Lora:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF8F4; --pane:#F5F0EA; --pane2:#FAF6F1; --card:#FFFFFF;
  --text:#3D3A44; --muted:#8A8594; --faint:#B9B4C1; --line:#ECE6DE;
  --sage:#B8D8C8; --lav:#CFC6EA; --peach:#F6D2BE; --blue:#C4DCEF; --butter:#F4E6B0; --coral:#E9A9A0;
  --accent:#8C7CC4; --accent-soft:#E9E4F7; --sel:rgba(207,198,234,.55);
  --h:#7E6BBE; --mk:#C6C0CE; --code:#F1ECE5; --hl:#F8EBB8; --cm:#DCEFE5; --link:#6D9CC4;
  --shadow:0 1px 2px rgba(61,58,68,.05),0 6px 20px rgba(61,58,68,.07);
  --radius:14px;
  --ed-font:'Nunito',system-ui,sans-serif; --ed-size:19px; --ed-width:680px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#24222A; --pane:#1E1C23; --pane2:#211F27; --card:#2D2B34;
  --text:#E6E2EC; --muted:#9C97A6; --faint:#6B6675; --line:#36333E;
  --sage:#8FAE9F; --lav:#A79FC6; --peach:#C9A897; --blue:#9DB4C8; --butter:#C9BD8F; --coral:#C98E86;
  --accent:#B6AAE6; --accent-soft:#38344A; --sel:rgba(167,159,198,.38);
  --h:#C3B8F0; --mk:#5E596A; --code:#34313C; --hl:#5A5236; --cm:#2F4A3E; --link:#9CC1E2;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Nunito',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
svg{display:block}
.app{display:grid;grid-template-columns:230px 300px 1fr;height:100vh;height:100dvh;overflow:hidden;transition:grid-template-columns .25s ease}
.app.hide-lib{grid-template-columns:0 300px 1fr}
.app.focus{grid-template-columns:0 0 1fr}
.app.focus .lib,.app.focus .list{opacity:0;pointer-events:none}
.app.hide-lib .lib{opacity:0;pointer-events:none}

/* ---------- Library ---------- */
.lib{background:var(--pane);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden;padding-top:var(--sat);transition:opacity .2s}
.lib-head{display:flex;align-items:center;gap:10px;padding:18px 18px 10px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--lav);display:grid;place-items:center;flex:none}
.lib-head h1{font-size:17px;font-weight:800;margin:0;letter-spacing:-.01em;white-space:nowrap}
.lib-scroll{flex:1;overflow:auto;padding:6px 10px 10px}
.sec{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:16px 10px 6px;display:flex;justify-content:space-between;align-items:center}
.sec button{color:var(--muted);border-radius:6px;padding:2px}
.sec button:hover{color:var(--text);background:var(--line)}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;font-weight:600;font-size:14.5px;text-align:left;color:var(--text)}
.nav:hover{background:rgba(140,124,196,.08)}
.nav.on{background:var(--card);box-shadow:var(--shadow)}
.nav .ic{width:18px;height:18px;flex:none;color:var(--muted)}
.nav.on .ic{color:var(--accent)}
.nav .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
.nav .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin:0 4px}
.lib-foot{padding:10px 14px calc(12px + var(--sab));border-top:1px solid var(--line);display:flex;align-items:center;gap:6px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{cursor:pointer}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.sync.ok i{background:#8FC4A8}.sync.busy i{background:var(--butter)}.sync.err i{background:var(--coral)}

/* ---------- Sheet list ---------- */
.list{background:var(--pane2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden;padding-top:var(--sat);transition:opacity .2s}
.list-head{padding:16px 16px 10px;display:flex;align-items:center;gap:8px}
.list-head h2{font-size:18px;font-weight:800;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{margin:0 14px 10px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 12px 9px 34px;font-size:14px;outline:none}
.search input:focus{border-color:var(--lav)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sheets{flex:1;overflow:auto;padding:2px 10px 16px}
.sheet{display:block;width:100%;text-align:left;padding:13px 14px 13px 16px;border-radius:12px;margin-bottom:6px;position:relative;border:1px solid transparent}
.sheet:hover{background:rgba(140,124,196,.06)}
.sheet.on{background:var(--card);box-shadow:var(--shadow);border-color:var(--line)}
.sheet .bar{position:absolute;left:6px;top:14px;bottom:14px;width:3px;border-radius:3px}
.sheet .t{font-weight:700;font-size:14.5px;margin-bottom:3px;display:flex;gap:6px;align-items:center}
.sheet .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .t svg{flex:none;color:#E2B54E}
.sheet .x{font-size:13px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:1.45em}
.sheet .m{font-size:11.5px;color:var(--faint);margin-top:6px;font-weight:700;display:flex;gap:10px}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;line-height:1.5}
.empty .cat{width:96px;height:96px;margin:0 auto 12px}

/* ---------- Editor ---------- */
.main{display:flex;flex-direction:column;min-width:0;position:relative;background:var(--bg);padding-top:var(--sat)}
.topbar{display:flex;align-items:center;gap:4px;padding:10px 14px;min-height:56px;transition:opacity .3s}
.topbar .grow{flex:1}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:rgba(140,124,196,.1);color:var(--text)}
.ib.on{color:var(--accent);background:var(--accent-soft)}
.ib svg{width:19px;height:19px}
.fmt{display:flex;gap:2px;align-items:center;background:var(--card);border-radius:12px;padding:3px;box-shadow:var(--shadow)}
.fmt .ib{width:34px;height:32px;font-weight:800;font-size:14px}
.sep{width:1px;height:18px;background:var(--line);margin:0 3px}
.wc{font-size:12.5px;color:var(--muted);font-weight:700;padding:0 8px;white-space:nowrap}
.app.focus .topbar:not(:hover){opacity:.12}
.app.typing .topbar:not(:hover){opacity:.25}
.back{display:none}

.scroll{flex:1;overflow:auto;scroll-behavior:auto}
.paper{max-width:calc(var(--ed-width) + 80px);margin:0 auto;padding:28px 40px 30vh}
.app.tw .paper{padding-bottom:60vh;padding-top:40vh}
.ed{position:relative}
.ed .mirror,.ed textarea{font-family:var(--ed-font);font-size:var(--ed-size);line-height:1.72;letter-spacing:.003em;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4;padding:0;margin:0;border:0;font-weight:400;font-variant-ligatures:none}
.ed .mirror{color:var(--text);min-height:60vh;pointer-events:none}
.ed textarea{position:absolute;inset:0;width:100%;height:100%;resize:none;outline:none;background:transparent;color:transparent;caret-color:var(--accent);overflow:hidden;-webkit-text-fill-color:transparent}
.ed textarea::selection{background:var(--sel);color:transparent}
.ed textarea::placeholder{color:var(--faint);-webkit-text-fill-color:var(--faint)}
.mk{color:var(--mk)}
.h{color:var(--h);text-shadow:.45px 0 0 currentColor}
.b{text-shadow:.5px 0 0 currentColor}
.i{color:var(--accent)}
.hl{background:var(--hl);border-radius:3px}
.cd{background:var(--code);border-radius:4px}
.cm{background:var(--cm);border-radius:3px;color:var(--muted)}
.ln{color:var(--link)}
.q{color:var(--muted)}
.li{color:var(--accent)}
.hr{color:var(--mk)}
.app.dim .mirror .para{opacity:.28;transition:opacity .2s}
.app.dim .mirror .para.cur{opacity:1}
.measure{position:absolute;visibility:hidden;left:0;right:0;top:0;pointer-events:none}

.nosheet{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}
.nosheet .cat{width:120px;height:120px;margin:0 auto 14px}
.nosheet h3{color:var(--text);margin:0 0 6px;font-size:19px}
.nosheet p{margin:0 0 18px;line-height:1.5;font-size:14.5px}
.btn{background:var(--accent);color:#fff;border-radius:11px;padding:10px 18px;font-weight:800;font-size:14px;box-shadow:var(--shadow)}
[data-theme="dark"] .btn{color:#24222A}
.btn.ghost{background:var(--card);color:var(--text)}
.btn.warn{background:var(--coral);color:#fff}

/* ---------- Info panel ---------- */
.panel{position:absolute;top:calc(56px + var(--sat));right:14px;width:310px;max-height:calc(100% - 76px - var(--sat));overflow:auto;background:var(--card);border-radius:16px;box-shadow:0 10px 40px rgba(61,58,68,.16);border:1px solid var(--line);padding:6px 18px 18px;z-index:20;display:none}
.panel.open{display:block;animation:pop .16s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.panel h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 10px;font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--pane2);border-radius:11px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-weight:800}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.goal{display:flex;gap:14px;align-items:center;background:var(--pane2);border-radius:12px;padding:12px}
.goal .ring{width:62px;height:62px;flex:none;position:relative}
.goal .ring .cat{position:absolute;inset:8px}
.goal .gt{font-size:13px;color:var(--muted);line-height:1.4}
.goal .gt b{color:var(--text);font-size:15px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row input[type=number]{width:96px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 9px;font-size:14px;outline:none}
.row select{flex:1;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 9px;font-size:14px;outline:none}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;background:var(--card)}
.chip:hover{border-color:var(--lav)}
.chip.on{background:var(--accent-soft);border-color:var(--lav);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.outline button{display:block;width:100%;text-align:left;padding:5px 8px;border-radius:7px;font-size:13.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.outline button:hover{background:var(--pane2)}
.outline .o2{padding-left:20px}.outline .o3{padding-left:32px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.act{background:var(--pane2);border-radius:10px;padding:9px 10px;font-size:13px;font-weight:700;text-align:left;display:flex;gap:8px;align-items:center}
.act:hover{background:var(--accent-soft)}
.act svg{width:16px;height:16px;color:var(--muted);flex:none}
.act.danger:hover{background:rgba(233,169,160,.3)}
.muted{color:var(--muted);font-size:12.5px;line-height:1.5}
input[type=range]{width:100%;accent-color:var(--accent)}

/* ---------- Preview ---------- */
.preview{font-family:var(--ed-font);font-size:var(--ed-size);line-height:1.72}
.preview h1,.preview h2,.preview h3{line-height:1.3;margin:1.2em 0 .5em}
.preview h1{font-size:1.7em}.preview h2{font-size:1.35em}.preview h3{font-size:1.12em}
.preview blockquote{margin:1em 0;padding:.2em 1em;border-left:3px solid var(--lav);color:var(--muted)}
.preview code{background:var(--code);padding:.1em .35em;border-radius:5px;font-size:.88em}
.preview mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px}
.preview a{color:var(--link)}
.preview hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.preview .cmt{display:none}
.preview p{margin:0 0 1em}

/* ---------- Modal & toast ---------- */
.modal{position:fixed;inset:0;background:rgba(36,34,42,.35);display:none;place-items:center;z-index:50;padding:20px;backdrop-filter:blur(2px)}
.modal.open{display:grid}
.dialog{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.dialog h3{margin:0 0 6px;font-size:18px}
.dialog a{color:var(--accent);font-weight:700}
.dialog p{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.5}
.dialog input[type=text],.dialog input[type=email],.dialog input[type=password]{width:100%;border:1px solid var(--line);background:var(--pane2);border-radius:11px;padding:11px 13px;font-size:15px;outline:none;margin-bottom:12px}
.dialog input[type=text]:focus,.dialog input[type=email]:focus,.dialog input[type=password]:focus{border-color:var(--lav)}
.swatches{display:flex;gap:8px;margin-bottom:18px}
.swatches button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.swatches button.on{border-color:var(--text)}
.dialog .btns{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.help{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;margin-bottom:16px}
.help code{background:var(--code);padding:1px 6px;border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;white-space:nowrap}

/* ---------- Mobile ---------- */
@media (max-width:820px){
  .app,.app.hide-lib,.app.focus{display:block;position:relative}
  .lib,.list,.main{position:absolute;inset:0;transition:transform .28s cubic-bezier(.3,.7,.2,1);opacity:1!important;pointer-events:auto!important}
  .app .lib{transform:translateX(0)}
  .app .list,.app .main{transform:translateX(100%)}
  .app[data-view="list"] .lib{transform:translateX(-30%)}
  .app[data-view="list"] .list{transform:translateX(0)}
  .app[data-view="editor"] .lib{transform:translateX(-30%)}
  .app[data-view="editor"] .list{transform:translateX(-30%)}
  .app[data-view="editor"] .main{transform:translateX(0)}
  .lib,.list{border-right:0}
  .back{display:grid}
  .hide-m{display:none!important}
  .paper{padding:14px 20px 40vh}
  .topbar{padding:8px 8px;gap:2px}
  .fmtbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 10px 8px;display:flex;overflow-x:auto;gap:2px;scrollbar-width:none}
  .fmtbar::-webkit-scrollbar{display:none}
  .fmtbar .fmt{flex:none}
  .panel{left:10px;right:10px;width:auto;top:calc(54px + var(--sat))}
  .sheet{padding:14px 14px 14px 18px}
  :root{--ed-size:18px}
  .app.focus .topbar:not(:hover),.app.typing .topbar:not(:hover){opacity:1}
}
@media (min-width:821px){ .fmtbar{display:none} }
@media (max-width:1100px) and (min-width:821px){ .app{grid-template-columns:0 290px 1fr}.app .lib{opacity:0;pointer-events:none}.app.show-lib{grid-template-columns:220px 290px 1fr}.app.show-lib .lib{opacity:1;pointer-events:auto}.app.focus{grid-template-columns:0 0 1fr} }
</style>
</head>
<body>
<div class="app" id="app" data-view="list">

  <!-- Library -->
  <aside class="lib">
    <div class="lib-head">
      <div class="logo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3D3A44" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></div>
      <h1>Schrijfkamer</h1>
    </div>
    <div class="lib-scroll" id="libNav"></div>
    <div class="lib-foot">
      <div class="sync" id="sync"><i></i><span>Laden…</span></div>
      <button class="ib" id="btnSettings" title="Instellingen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></button>
      <button class="ib" id="btnTheme" title="Licht / donker"></button>
    </div>
  </aside>

  <!-- Sheet list -->
  <section class="list">
    <div class="list-head">
      <button class="ib back" id="backLib" title="Bibliotheek"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <button class="ib hide-m" id="toggleLib" title="Bibliotheek tonen/verbergen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
      <h2 id="listTitle">Inbox</h2>
      <button class="ib" id="btnNew" title="Nieuwe tekst (Ctrl+Alt+N)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Zoeken in teksten…" autocomplete="off">
    </div>
    <div class="sheets" id="sheets"></div>
  </section>

  <!-- Editor -->
  <main class="main" id="main">
    <div class="topbar" id="topbar">
      <button class="ib back" id="backList" title="Terug"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="fmt hide-m" id="fmtDesk"></div>
      <div class="grow"></div>
      <span class="wc" id="wc"></span>
      <button class="ib" id="btnPreview" title="Voorbeeld (Ctrl+Alt+P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>

(() => {

const uid = () => (Date.now().toString(36) + Math.random().toString(36).slice(2, 9));
const COLORS = ['#B8D8C8','#CFC6EA','#F6D2BE','#C4DCEF','#F4E6B0','#E9A9A0'];

/* ---------------- Icons & cats ---------------- */
const I = {
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/>',

  down:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
  restore:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  dup:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',

};
const icon = (n, cls='ic', size) => `<svg class="${cls}" ${size?`width="${size}" height="${size}"`:''} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

function cat(mood){

    extra = `<text x="80" y="30" font-family="Nunito" font-weight="800" font-size="13" fill="${line}" opacity=".55">z</text><text x="89" y="21" font-family="Nunito" font-weight="800" font-size="10" fill="${line}" opacity=".4">z</text>`;
  } else if (mood === 'happy'){
    eyes = `<path d="M38 54q5-6 10 0M62 54q5-6 10 0" stroke="${line}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    mouth = `<path d="M48 61q7 8 14 0" stroke="${line}" stroke-width="2.6" fill="${blush}" stroke-linecap="round"/>`;
    extra = `<path d="M90 26l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#F4E6B0"/><path d="M20 30l1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5z" fill="#B8D8C8"/>`;
  } else { // curious
    eyes = `<circle cx="43" cy="52" r="4.5" fill="${line}"/><circle cx="67" cy="52" r="4.5" fill="${line}"/><circle cx="44.5" cy="50.5" r="1.4" fill="#fff"/><circle cx="68.5" cy="50.5" r="1.4" fill="#fff"/>`;
    mouth = `<path d="M50 62q2.5 3 5 0q2.5 3 5 0" stroke="${line}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    extra = `<text x="84" y="34" font-family="Nunito" font-weight="800" font-size="18" fill="${line}" opacity=".5">?</text>`;
  }
  return `<svg class="cat" viewBox="0 0 110 110"><circle cx="55" cy="55" r="52" fill="${bg}"/>
    <path d="M28 44 L30 18 L48 34 Z" fill="${fur}" stroke="${line}" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M82 44 L80 18 L62 34 Z" fill="${fur}" stroke="${line}" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M34 30l1 9 7-4z M76 30l-1 9-7-4z" fill="${blush}" opacity=".7"/>
    <ellipse cx="55" cy="58" rx="31" ry="26" fill="${fur}" stroke="${line}" stroke-width="2.6"/>
    <circle cx="38" cy="63" r="4.5" fill="${blush}" opacity=".55"/><circle cx="72" cy="63" r="4.5" fill="${blush}" opacity=".55"/>
    ${eyes}<path d="M53 57.5h4l-2 2.4z" fill="${line}"/>${mouth}
    <path d="M24 58h10M25 64l9-2M86 58H76M85 64l-9-2" stroke="${line}" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>${extra}</svg>`;
}

/* ---------------- State ---------------- */
let settings = Object.assign({theme:'auto', font:'sans', size:19, width:680, typewriter:false, dim:false}, LS.get('settings', {}));
let sheets = LS.get('sheets', {});     // id -> sheet
let groups = LS.get('groups', []);     // [{id,name,color}]
let view = LS.get('view', 'inbox');    // inbox | all | recent | fav | trash | g:<id>
let currentId = LS.get('current', null);
let query = '';
let cloud = 'pending';
const timers = {}, inflight = {}, again = {}, lastLocalEdit = {};

const titleOf = s => {
  const line = (s.body || '').split('\n').find(l => l.trim()) || '';
  return line.replace(/^#{1,6}\s+/, '').replace(/[*_=`~>]|\+\+/g, '').trim().slice(0, 90) || 'Naamloos';
};
const excerptOf = s => {
  const lines = (s.body || '').split('\n').filter(l => l.trim());
  return lines.slice(1).join(' ').replace(/^#{1,6}\s+/g, '').replace(/[*_=`#>]|\+\+/g, '').slice(0, 160);
};
const countWords = t => { const m = t.replace(/[#*_=`>\-+]/g, ' ').match(/[\p{L}\p{N}’'-]+/gu); return m ? m.length : 0; };
const fmtDate = ts => {
  const d = new Date(ts), now = new Date();
  const days = Math.floor((new Date(now.toDateString()) - new Date(d.toDateString())) / 864e5);
  const time = d.toLocaleTimeString('nl-NL', {hour:'2-digit', minute:'2-digit'});
  if (days === 0) return 'Vandaag ' + time;
  if (days === 1) return 'Gisteren ' + time;
  if (days < 7) return d.toLocaleDateString('nl-NL', {weekday:'long'});
  return d.toLocaleDateString('nl-NL', {day:'numeric', month:'short', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined});
};

function persistLocal(){ LS.set('sheets', sheets); LS.set('groups', groups); }

/* ---------------- Sync ---------------- */
// Backends: Supabase (when config.js is filled in), the claude.ai artifact store, or this device only.
const CFG = window.SCHRIJF_CONFIG || {};
const useSupabase = !!(CFG.supabaseUrl && CFG.supabaseKey);
let backend = null;          // {write(id, sheet), remove(id), saveGroups(groups)}
let sb = null, sbUser = null, sbChannel = null;

function setSync(state, text){
  const el = $('#sync'); el.className = 'sync ' + state; el.querySelector('span').textContent = text;
  el.title = text;
}
function syncIdle(){
  if (cloud === 'on') setSync('ok', 'Gesynchroniseerd');
  else if (cloud === 'pending') setSync('busy', 'Verbinden…');
  else if (cloud === 'login') setSync('err', 'Inloggen');
  else setSync('', 'Alleen op dit apparaat');
}
function cleanSheet(s){ return {body:s.body||'', group:s.group||'inbox', fav:!!s.fav, trashed:!!s.trashed, goal:s.goal||0, created:s.created||Date.now(), updated:s.updated||Date.now()}; }

function saveSheet(id, immediate){
  lastLocalEdit[id] = Date.now();
  persistLocalSoon();
  if (cloud !== 'on') return;
  setSync('busy', 'Opslaan…');
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => flush(id), immediate ? 0 : 800);
}
let lsTimer;
function persistLocalSoon(){ clearTimeout(lsTimer); lsTimer = setTimeout(persistLocal, 300); }

async function flush(id){
  delete timers[id];
  if (!backend) return;
  if (inflight[id]){ again[id] = true; return; }
  inflight[id] = true;
  do {
    again[id] = false;
    const s = sheets[id];
    try {
      if (s){ await backend.write(id, cleanSheet(s)); if (sheets[id]){ sheets[id].synced = true; persistLocalSoon(); } }
      else await backend.remove(id);
    } catch (e) { handleDbError(e); }
  } while (again[id]);
  inflight[id] = false;
  if (!Object.keys(timers).length && !Object.values(inflight).some(Boolean)) syncIdle();
}
function handleDbError(e){
  console.warn('sync', e);
  const code = e && e.code, msg = String((e && e.message) || '');
  if (code === 'quota_exceeded') toast('Opslag in de cloud is vol — verwijder oude teksten uit de prullenbak.');
  else if (code === 'revoked' || code === 'not_granted') { cloud = 'off'; }
  else if (/jwt|auth|401/i.test(msg) || code === 'PGRST301'){ cloud = 'login'; syncIdle(); return; }
  setSync('err', 'Opslaan mislukt — lokaal bewaard');
}
let profileBusy = false, profileAgain = false;
async function saveProfile(){
  persistLocalSoon();
  if (cloud !== 'on' || !backend) return;
  if (profileBusy){ profileAgain = true; return; }
  profileBusy = true;
  do { profileAgain = false; try { await backend.saveGroups(groups); } catch(e){ handleDbError(e); } } while (profileAgain);
  profileBusy = false;
}

/* Apply a sheet that came from the server. Returns true when something changed. */
function applyRemote(sid, d){
  const busy = timers[sid] || inflight[sid] || (Date.now() - (lastLocalEdit[sid]||0) < 2500);
  if (busy) return false;
  const local = sheets[sid];
  if (local && (local.updated||0) > (d.updated||0)){ if (cloud === 'on') saveSheet(sid, true); return false; }
  if (local && local.updated === d.updated && local.body === d.body){ local.synced = true; return false; }
  sheets[sid] = {...cleanSheet(d), body: String(d.body||''), synced:true};
  if (sid === currentId && ta.value !== sheets[sid].body){
    const pos = ta.selectionStart; ta.value = sheets[sid].body;
    if (document.activeElement === ta) ta.setSelectionRange(Math.min(pos, ta.value.length), Math.min(pos, ta.value.length));
    renderMirror(); updateCounts();
  }
  return true;
}
function applyRemoteDelete(sid){
  if (!sheets[sid] || timers[sid] || inflight[sid]) return false;
  delete sheets[sid]; return true;
}
function afterRemoteChange(){
  persistLocalSoon(); renderLib(); renderList();
  if (currentId && !sheets[currentId]) openSheet(null); else if (panelOpen) renderPanel();
}
/* Local sheets missing on the server: new ones are uploaded, ones that were synced before were deleted elsewhere. */
function reconcile(remoteIds){
  let changed = false;
  for (const sid of Object.keys(sheets)){
    if (remoteIds.has(sid)) continue;
    if (sheets[sid].synced && !timers[sid] && !inflight[sid]){ delete sheets[sid]; changed = true; }
    else saveSheet(sid, true);
  }
  return changed;
}
function mergeGroups(remote){
  const byId = new Map(remote.map(g => [g.id, {...g}]));
  let extra = false;
  for (const g of groups) if (!byId.has(g.id)){ byId.set(g.id, g); extra = true; }
  groups = [...byId.values()];
  return extra;
}

async function connect(){
  if (useSupabase) return connectSupabase();
  if (!window.claude || !window.claude.use){ cloud = 'off'; syncIdle(); return; }
  let user, db;
  try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch(e){ db = null; }
  const id = user ? await user.id() : null;
  if (!db || !id){ cloud = 'off'; syncIdle(); return; }
  const profileRef = db.doc('data/users/' + id + '/profile');
  const sheetsCol = profileRef.collection('sheets');
  backend = {
    write: (sid, s) => sheetsCol.doc(sid).set(s),
    remove: sid => sheetsCol.doc(sid).delete(),
    saveGroups: g => profileRef.set({groups: g})
  };
  let firstServer = false;
  const timeout = setTimeout(() => { if (!firstServer) setSync('err', 'Cloud niet bereikbaar — lokaal'); }, 10000);
  profileRef.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites || profileBusy) return;
    if (snap.exists){ const d = snap.data(); if (Array.isArray(d.groups)){ groups = d.groups.map(g => ({...g})); afterRemoteChange(); } }
  }, e => handleDbError(e));
  sheetsCol.onSnapshot(snap => {
    let changed = false;
    if (!snap.metadata.fromCache && !firstServer){
      firstServer = true; clearTimeout(timeout); cloud = 'on'; syncIdle();
      changed = reconcile(new Set(snap.docs.map(d => d.id))) || changed;
      if (!snap.docs.length && groups.length) saveProfile();
    }
    for (const ch of snap.docChanges()){
      if (ch.type === 'removed'){ if (!snap.metadata.fromCache) changed = applyRemoteDelete(ch.doc.id) || changed; }
      else changed = applyRemote(ch.doc.id, ch.doc.data()) || changed;
    }
    if (changed) afterRemoteChange();
  }, e => handleDbError(e));
}

/* ----- Supabase ----- */
const rowToSheet = r => ({body:r.body, group:r.grp, fav:r.fav, trashed:r.trashed, goal:r.goal, created:Number(r.created), updated:Number(r.updated)});
async function connectSupabase(){
  if (!window.supabase){ cloud = 'off'; setSync('err', 'Kan Supabase niet laden — lokaal'); return; }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((event, session) => {
    if (session && session.user && (!sbUser || sbUser.id !== session.user.id)) setTimeout(() => startSupabase(session.user), 0);
    if (event === 'SIGNED_OUT') stopSupabase();
    if (event === 'PASSWORD_RECOVERY') setTimeout(newPasswordDialog, 300);
  });
  const { data } = await sb.auth.getSession();
  if (data && data.session) startSupabase(data.session.user);
  else { cloud = 'login'; syncIdle(); if (!LS.get('loginLater', false)) loginDialog(); }
}
async function startSupabase(user){
  if (sbUser && sbUser.id === user.id) return;
  sbUser = user; cloud = 'pending'; syncIdle();
  backend = {
    async write(id, s){
      const { error } = await sb.from('sheets').upsert({id, user_id:user.id, body:s.body, grp:s.group, fav:s.fav, trashed:s.trashed, goal:s.goal, created:s.created, updated:s.updated});
      if (error) throw error;
    },
    async remove(id){ const { error } = await sb.from('sheets').delete().eq('id', id); if (error) throw error; },
    async saveGroups(g){ const { error } = await sb.from('profiles').upsert({user_id:user.id, groups:g}); if (error) throw error; }
  };
  await sbPull();
  sbChannel = sb.channel('sync-' + user.id)
    .on('postgres_changes', {event:'*', schema:'public', table:'sheets'}, p => {
      let changed;
      if (p.eventType === 'DELETE') changed = p.old && applyRemoteDelete(p.old.id);
      else if (p.new && p.new.user_id === user.id) changed = applyRemote(p.new.id, rowToSheet(p.new));
      if (changed) afterRemoteChange();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'profiles'}, p => {
      if (profileBusy || !p.new || p.new.user_id !== user.id || !Array.isArray(p.new.groups)) return;
      groups = p.new.groups; afterRemoteChange();
    })
    .subscribe();
}
let pulling = false;
async function sbPull(){
  if (!sbUser || pulling) return;
  pulling = true;
  try {
    const [res, prof] = await Promise.all([
      sb.from('sheets').select('*'),
      sb.from('profiles').select('groups').eq('user_id', sbUser.id).maybeSingle()
    ]);
    if (res.error) throw res.error;
    cloud = 'on';
    let changed = false;
    for (const r of res.data) changed = applyRemote(r.id, rowToSheet(r)) || changed;
    changed = reconcile(new Set(res.data.map(r => r.id))) || changed;
    const remoteGroups = prof && prof.data && Array.isArray(prof.data.groups) ? prof.data.groups : [];
    const before = JSON.stringify(groups);
    const extra = mergeGroups(remoteGroups);
    if (extra || !prof.data) saveProfile();
    if (changed || before !== JSON.stringify(groups)) afterRemoteChange();
    if (!Object.keys(timers).length) syncIdle();
  } catch(e){ handleDbError(e); }
  pulling = false;
}
function stopSupabase(){
  if (sbChannel){ sb.removeChannel(sbChannel); sbChannel = null; }
  sbUser = null; backend = null; cloud = 'login';
  for (const s of Object.values(sheets)) delete s.synced;
  persistLocal(); syncIdle();
}

function loginDialog(mode){
  mode = mode || (LS.get('hasAccount', false) ? 'login' : 'signup');
  const T = {
    login:  {h:'Inloggen', p:'Log in om je teksten te synchroniseren tussen je telefoon en computer.', btn:'Inloggen', alt:'Nog geen account? <a href="#" data-m="signup">Account aanmaken</a>'},
    signup: {h:'Account aanmaken', p:'Eenmalig: maak een account, dan worden je teksten op al je apparaten bewaard.', btn:'Account aanmaken', alt:'Heb je al een account? <a href="#" data-m="login">Inloggen</a>'},
    reset:  {h:'Wachtwoord vergeten', p:'Je krijgt een mail met een link om een nieuw wachtwoord in te stellen.', btn:'Stuur link', alt:'<a href="#" data-m="login">Terug naar inloggen</a>'}
  }[mode];
  openModal(`<h3>${T.h}</h3><p>${T.p}</p>
    <input type="email" id="lemail" placeholder="jij@voorbeeld.nl" autocomplete="email" value="${esc(LS.get('email',''))}">
    ${mode === 'reset' ? '' : `<input type="password" id="lpass" placeholder="Wachtwoord${mode === 'signup' ? ' (minstens 8 tekens)' : ''}" autocomplete="${mode === 'signup' ? 'new-password' : 'current-password'}">`}
    <div class="btns"><button class="btn ghost" id="llater">Later</button><button class="btn" id="lok">${T.btn}</button></div>
    <p class="muted" id="lmsg" style="margin:12px 0 0"></p>
    <p class="muted" style="margin:10px 0 0">${T.alt}${mode === 'login' ? ' · <a href="#" data-m="reset">Wachtwoord vergeten?</a>' : ''}</p>`);
  const msg = t => $('#lmsg').textContent = t;
  setTimeout(() => (LS.get('email','') && $('#lpass') ? $('#lpass') : $('#lemail')).focus(), 30);
  $('#dialog').addEventListener('click', e => { const a = e.target.closest('[data-m]'); if (a){ e.preventDefault(); LS.set('email', $('#lemail').value.trim()); loginDialog(a.dataset.m); } });
  const go = async () => {
    const email = $('#lemail').value.trim(), pass = $('#lpass') ? $('#lpass').value : '';
    if (!/.+@.+\..+/.test(email)) return msg('Vul een geldig e-mailadres in.');
    if (mode !== 'reset' && pass.length < (mode === 'signup' ? 8 : 1)) return msg(mode === 'signup' ? 'Kies een wachtwoord van minstens 8 tekens.' : 'Vul je wachtwoord in.');
    LS.set('email', email); $('#lok').disabled = true; msg('Even geduld…');
    const redirect = location.href.split('#')[0];
    let res;
    if (mode === 'login') res = await sb.auth.signInWithPassword({email, password: pass});
    else if (mode === 'signup') res = await sb.auth.signUp({email, password: pass, options:{emailRedirectTo: redirect}});
    else res = await sb.auth.resetPasswordForEmail(email, {redirectTo: redirect});
    $('#lok').disabled = false;
    const { data, error } = res;
    if (error){
      const m = String(error.message || '');
      if (/invalid login/i.test(m)) return msg('E-mailadres of wachtwoord klopt niet.');
      if (/not confirmed/i.test(m)) return msg('Bevestig eerst je e-mailadres via de link in je mail.');
      if (/already registered/i.test(m)) { LS.set('hasAccount', true); return msg('Dit adres heeft al een account — kies Inloggen.'); }
      if (/rate limit/i.test(m)) return msg('Te veel pogingen of mails. Wacht even en probeer het opnieuw.');
      return msg('Dat lukte niet: ' + m);
    }
    LS.set('hasAccount', true);
    if (mode === 'reset') return msg('Verstuurd! Open de link in je mail; je kunt dan een nieuw wachtwoord kiezen.');
    if (data && data.session){ LS.set('loginLater', false); closeModal(); toast('Ingelogd — je teksten worden gesynchroniseerd'); startSupabase(data.session.user); }
    else msg('Bijna klaar: klik op de bevestigingslink in je mail. Daarna kun je hier inloggen.');
  };

function inline(t){
  // t is already escaped
  return t
    .replace(/(`)([^`\n]+?)(`)/g, '<span class="cd"><span class="mk">$1</span>$2<span class="mk">$3</span></span>')
    .replace(/(\+\+)(.+?)(\+\+)/g, '<span class="cm"><span class="mk">$1</span>$2<span class="mk">$3</span></span>')
    .replace(/(\*\*|__)(?=\S)(.+?)(?<=\S)\1/g, '<span class="b"><span class="mk">$1</span>$2<span class="mk">$1</span></span>')
    .replace(/(^|[^*\w])(\*|_)(?=[^\s*_])([^*_\n]+?)(?<=\S)\2(?![*\w])/g, '$1<span class="i"><span class="mk">$2</span>$3<span class="mk">$2</span></span>')
    .replace(/(==)(?=\S)(.+?)(?<=\S)(==)/g, '<span class="hl"><span class="mk">$1</span>$2<span class="mk">$3</span></span>')
    .replace(/(~~)(.+?)(~~)/g, '<span class="mk">$1</span><s>$2</s><span class="mk">$3</span>')
    .replace(/(\[)([^\]\n]+)(\]\()([^)\s]+)(\))/g, '<span class="mk">$1</span><span class="ln">$2</span><span class="mk">$3$4$5</span>');
}
function highlight(text, caret){
  const lines = text.split('\n');
  let pos = 0, out = [], para = [], paraStart = 0, inCode = false;
  const flushPara = () => { if (para.length){ out.push({start:paraStart, end:pos, html:para.join('\n')}); para = []; } };
  lines.forEach((raw, i) => {
    const line = esc(raw);
    let html;
    if (/^```/.test(raw)){ inCode = !inCode; html = `<span class="mk">${line}</span>`; }
    else if (inCode) html = `<span class="cd">${line}</span>`;
    else if (/^#{1,6}\s/.test(raw)){ const m = line.match(/^(#{1,6}\s)(.*)$/); html = `<span class="h"><span class="mk">${m[1]}</span>${inline(m[2])}</span>`; }
    else if (/^&gt;\s?/.test(line)){ const m = line.match(/^(&gt;\s?)(.*)$/); html = `<span class="mk">${m[1]}</span><span class="q">${inline(m[2])}</span>`; }
    else if (/^\s*([-*+]|\d+\.)\s/.test(raw)){ const m = line.match(/^(\s*(?:[-*+]|\d+\.)\s)(.*)$/); html = `<span class="li">${m[1]}</span>${inline(m[2])}`; }
    else if (/^(\*\s*\*\s*\*|-{3,}|_{3,})\s*$/.test(raw)) html = `<span class="hr">${line}</span>`;
    else html = inline(line);
    if (!raw.trim() && !inCode){ flushPara(); out.push({start:pos, end:pos+raw.length, html, blank:true}); }
    else { if (!para.length) paraStart = pos; para.push(html); }
    pos += raw.length + 1;
    if (i === lines.length - 1) flushPara();
  });
  return out.map((p, idx) => {
    const sep = idx < out.length - 1 ? '\n' : '';
    if (p.blank) return p.html + sep;
    const cur = caret >= p.start && caret <= p.end ? ' cur' : '';
    return `<span class="para${cur}">${p.html}</span>${sep}`;
  }).join('') + '\n​';
}
function renderMirror(){

ta.addEventListener('click', () => { updateCurPara(); if (settings.typewriter) typewriter(); });
ta.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && !e.altKey){
    const k = e.key.toLowerCase();
    if (k === 'b'){ e.preventDefault(); wrap('**','**'); }
    else if (k === 'i'){ e.preventDefault(); wrap('*','*'); }
    else if (k === 'k'){ e.preventDefault(); link(); }
    return;
  }
  if (e.key === 'Enter' && !e.shiftKey && !mod){
    // continue lists & quotes
    const v = ta.value, p = ta.selectionStart;
    const ls = v.lastIndexOf('\n', p - 1) + 1, line = v.slice(ls, p);
    const m = line.match(/^(\s*)([-*+]|(\d+)\.|>)\s(.*)$/);
    if (m && ta.selectionStart === ta.selectionEnd){
      e.preventDefault();
      if (!m[4].trim()){ ta.setSelectionRange(ls, p); if (!document.execCommand('delete')){ ta.setRangeText('', ls, p, 'end'); ta.dispatchEvent(new Event('input')); } return; }
      const bullet = m[3] ? (parseInt(m[3]) + 1) + '.' : m[2];
      insert('\n' + m[1] + bullet + ' ');
    }
  }
  if (e.key === 'Tab' && !mod){
    e.preventDefault(); insert('\t');
  }
});

function insert(text){
  ta.focus();
  if (!document.execCommand || !document.execCommand('insertText', false, text)){
    const s = ta.selectionStart, en = ta.selectionEnd;
    ta.setRangeText(text, s, en, 'end');
    ta.dispatchEvent(new Event('input'));
  }
}
function wrap(a, b, placeholder='tekst'){
  if (ta.readOnly) return;
  const s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
  const sel = v.slice(s, e);
  // toggle off if already wrapped
  if (v.slice(s - a.length, s) === a && v.slice(e, e + b.length) === b){
    ta.setSelectionRange(s - a.length, e + b.length); insert(sel); ta.setSelectionRange(s - a.length, e - a.length); return;
  }
  const inner = sel || placeholder;
  insert(a + inner + b);
  ta.setSelectionRange(s + a.length, s + a.length + inner.length);
}
function linePrefix(prefix){
  if (ta.readOnly) return;
  const v = ta.value, s = ta.selectionStart, e = ta.selectionEnd;
  const ls = v.lastIndexOf('\n', s - 1) + 1;
  let le = v.indexOf('\n', e); if (le < 0) le = v.length;
  const block = v.slice(ls, le).split('\n');
  const re = /^(#{1,6}\s|>\s?|[-*+]\s|\d+\.\s)/;
  const allHave = block.every(l => l.startsWith(prefix));
  const res = block.map((l, i) => {
    const base = l.replace(re, '');
    if (allHave) return base;
    const p = prefix === '1. ' ? (i + 1) + '. ' : prefix;
    return p + base;
  }).join('\n');
  ta.setSelectionRange(ls, le); insert(res);
  ta.setSelectionRange(ls + res.length, ls + res.length);
}
function heading(){
  if (ta.readOnly) return;
  const v = ta.value, s = ta.selectionStart;
  const ls = v.lastIndexOf('\n', s - 1) + 1; let le = v.indexOf('\n', s); if (le < 0) le = v.length;
  const line = v.slice(ls, le); const m = line.match(/^(#{1,6})\s/);
  const lvl = m ? m[1].length : 0;
  const next = lvl >= 3 ? '' : '#'.repeat(lvl + 1) + ' ';
  const res = next + line.replace(/^#{1,6}\s/, '');
  ta.setSelectionRange(ls, le); insert(res);
  ta.setSelectionRange(ls + res.length, ls + res.length);
}
function link(){
  if (ta.readOnly) return;
  const s = ta.selectionStart, e = ta.selectionEnd, sel = ta.value.slice(s, e) || 'linktekst';
  insert('[' + sel + '](https://)');
  const p = s + sel.length + 3; ta.setSelectionRange(p, p + 8);
}

const FMT = [

  ['?', 'Markup-overzicht', () => helpDialog(), icon('help','',18)],
];
function buildFmt(el){
  el.innerHTML = FMT.map((f, i) => f[0] === '-' ? '<span class="sep"></span>' : `<button class="ib" data-f="${i}" title="${f[1]}" aria-label="${f[1]}">${f[3]}</button>`).join('');
  el.addEventListener('mousedown', e => { if (e.target.closest('[data-f]')) e.preventDefault(); });
  el.addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) FMT[+b.dataset.f][2](); });

function stats(text){
  const words = countWords(text);
  const chars = text.length;
  const charsNoSp = text.replace(/\s/g, '').length;
  const sentences = (text.match(/[^.!?\n]+[.!?]+/g) || []).length;
  const paras = text.split(/\n\s*\n/).filter(p => p.trim()).length;
  const read = Math.max(words ? 1 : 0, Math.round(words / 230));
  return {words, chars, charsNoSp, sentences, paras, read};
}
function updateCounts(){

}

/* typewriter: keep the caret line at ~42% of the viewport */
function typewriter(){
  const p = ta.selectionStart;
  measure.textContent = ta.value.slice(0, p);
  const span = document.createElement('span'); span.textContent = '​'; measure.appendChild(span);

/* ---------------- Preview ---------------- */
function mdToHtml(md){
  const lines = md.split('\n'); let html = '', list = null, para = [], code = null;
  const inl = t => esc(t)
    .replace(/\+\+(.+?)\+\+/g, '')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/(\*\*|__)(?=\S)(.+?)(?<=\S)\1/g, '<strong>$2</strong>')
    .replace(/(^|[^*\w])(\*|_)(?=[^\s*_])([^*_\n]+?)(?<=\S)\2(?![*\w])/g, '$1<em>$3</em>')
    .replace(/==(?=\S)(.+?)(?<=\S)==/g, '<mark>$1</mark>')
    .replace(/~~(.+?)~~/g, '<s>$1</s>')
    .replace(/\[([^\]]+)\]\(((?:https?:|mailto:)[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const flushP = () => { if (para.length){ html += '<p>' + para.map(inl).join('<br>') + '</p>\n'; para = []; } };
  const closeL = () => { if (list){ html += `</${list}>\n`; list = null; } };
  for (const raw of lines){
    if (code !== null){ if (/^```/.test(raw)){ html += '<pre><code>' + esc(code) + '</code></pre>\n'; code = null; } else code += (code ? '\n' : '') + raw; continue; }
    if (/^```/.test(raw)){ flushP(); closeL(); code = ''; continue; }
    let m;
    if (!raw.trim()){ flushP(); closeL(); continue; }
    if ((m = raw.match(/^(#{1,6})\s+(.*)$/))){ flushP(); closeL(); const n = m[1].length; html += `<h${n}>${inl(m[2])}</h${n}>\n`; continue; }
    if (/^(\*\s*\*\s*\*|-{3,}|_{3,})\s*$/.test(raw)){ flushP(); closeL(); html += '<hr>\n'; continue; }
    if ((m = raw.match(/^>\s?(.*)$/))){ flushP(); closeL(); html += `<blockquote><p>${inl(m[1])}</p></blockquote>\n`; continue; }
    if ((m = raw.match(/^\s*([-*+]|\d+\.)\s+(.*)$/))){
      flushP(); const t = /\d/.test(m[1]) ? 'ol' : 'ul';
      if (list !== t){ closeL(); html += `<${t}>`; list = t; }
      html += `<li>${inl(m[2])}</li>`; continue;
    }
    closeL(); para.push(raw);
  }
  if (code !== null) html += '<pre><code>' + esc(code) + '</code></pre>';
  flushP(); closeL();
  return html.replace(/<blockquote>([\s\S]*?)<\/blockquote>\n<blockquote>/g, '<blockquote>$1');
}
function plainText(md){
  return md.replace(/\+\+(.+?)\+\+/g, '').replace(/^#{1,6}\s+/gm, '').replace(/^>\s?/gm, '')
    .replace(/(\*\*|__)(.+?)\1/g, '$2').replace(/(^|[^*\w])[*_]([^*_\n]+?)[*_](?![*\w])/g, '$1$2')
    .replace(/==(.+?)==/g, '$1').replace(/~~(.+?)~~/g, '$1').replace(/`([^`]+)`/g, '$1')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1 ($2)');
}
function renderPreview(){ $('#preview').innerHTML = mdToHtml(ta.value) || '<p class="muted">Nog niets om te tonen.</p>'; }
function togglePreview(){
  previewOn = !previewOn;
  $('#ed').hidden = previewOn; $('#preview').hidden = !previewOn;
  $('#btnPreview').classList.toggle('on', previewOn);
  $('#fmtDesk').style.visibility = previewOn ? 'hidden' : '';
  $('#fmtMob').style.display = previewOn ? 'none' : '';
  if (previewOn) renderPreview(); else ta.focus();
}
$('#btnPreview').onclick = togglePreview;

/* ---------------- Info panel ---------------- */
let panelOpen = false;
function ring(pct, done){
  const r = 27, c = 2 * Math.PI * r, off = c * (1 - Math.min(1, pct));
  return `<svg viewBox="0 0 62 62" width="62" height="62"><circle cx="31" cy="31" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/>
    <circle cx="31" cy="31" r="${r}" fill="none" stroke="${done ? '#8FC4A8' : 'var(--lav)'}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 31 31)" style="transition:stroke-dashoffset .4s"/>
    ${done ? '' : `<text x="31" y="35.5" text-anchor="middle" font-size="13" font-weight="800" fill="var(--text)" font-family="Nunito">${Math.round(pct*100)}%</text>`}</svg>${done ? cat('happy') : ''}`;
}
function renderPanel(){
  const s = sheets[currentId]; if (!s){ closePanel(); return; }
  const st = stats(ta.value);
  const goal = s.goal || 0, pct = goal ? st.words / goal : 0, done = goal && st.words >= goal;
  const heads = (ta.value.match(/^#{1,3}\s+.+$/gm) || []);
  const p = $('#panel');
  p.innerHTML = `
    <h4>Statistieken</h4>
    <div class="stats">
      <div class="stat"><b>${st.words.toLocaleString('nl-NL')}</b><span>woorden</span></div>
      <div class="stat"><b>${st.chars.toLocaleString('nl-NL')}</b><span>tekens</span></div>
      <div class="stat"><b>${st.sentences}</b><span>zinnen</span></div>
      <div class="stat"><b>${st.paras}</b><span>alinea's</span></div>
      <div class="stat"><b>${st.read} min</b><span>leestijd</span></div>
      <div class="stat"><b>${st.charsNoSp.toLocaleString('nl-NL')}</b><span>tekens zonder spaties</span></div>
    </div>
    <h4>Schrijfdoel</h4>
    <div class="goal">
      <div class="ring">${goal ? ring(pct, done) : ring(0, false)}</div>
      <div class="gt">${goal ? (done ? `<b>Doel gehaald!</b><br>${st.words} van ${goal} woorden. Mooi werk.` : `<b>Nog ${goal - st.words} woorden</b><br>${st.words} van ${goal} woorden`) : '<b>Geen doel</b><br>Stel een aantal woorden in om je voortgang te zien.'}</div>
    </div>
    <div class="row"><input type="number" id="goalIn" min="0" step="50" placeholder="bv. 1000" value="${goal || ''}"><span class="muted">woorden</span></div>
    <div class="chips" style="margin-top:8px">${[300,500,1000,2000].map(n => `<button class="chip ${goal===n?'on':''}" data-goal="${n}">${n}</button>`).join('')}</div>
    <h4>Groep</h4>
    <div class="row" style="margin-top:0"><select id="grpSel"><option value="inbox">Inbox</option>${groups.map(g => `<option value="${g.id}" ${s.group===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select>
      <button class="chip ${s.fav?'on':''}" id="favBtn">${s.fav ? '★ Favoriet' : '☆ Favoriet'}</button></div>
    ${heads.length ? `<h4>Inhoud</h4><div class="outline">${heads.map((h, i) => `<button data-h="${i}" class="o${h.match(/^#+/)[0].length}">${esc(h.replace(/^#+\s+/, ''))}</button>`).join('')}</div>` : ''}
    <h4>Exporteren</h4>
    <div class="actions">
      <button class="act" data-a="copymd">${icon('copy','')}Kopieer Markdown</button>
      <button class="act" data-a="copytxt">${icon('copy','')}Kopieer platte tekst</button>
      <button class="act" data-a="dlmd">${icon('down','')}Download .md</button>
      <button class="act" data-a="dlhtml">${icon('down','')}Download .html</button>
    </div>
    <h4>Tekst</h4>
    <div class="actions">
      <button class="act" data-a="dup">${icon('dup','')}Dupliceren</button>
      ${s.trashed ? `<button class="act" data-a="restore">${icon('restore','')}Terugzetten</button><button class="act danger" data-a="destroy" style="grid-column:span 2">${icon('trash','')}Definitief verwijderen</button>`
        : `<button class="act danger" data-a="trash">${icon('trash','')}Naar prullenbak</button>`}
    </div>
    <p class="muted" style="margin-top:14px">Aangemaakt ${fmtDate(s.created)} · bewerkt ${fmtDate(s.updated)}</p>`;
}
function openPanel(){ panelOpen = true; renderPanel(); $('#panel').classList.add('open'); $('#btnInfo').classList.add('on'); }
function closePanel(){ panelOpen = false; $('#panel').classList.remove('open'); $('#btnInfo').classList.remove('on'); }
$('#btnInfo').onclick = () => panelOpen ? closePanel() : openPanel();
document.addEventListener('mousedown', e => { if (panelOpen && !e.target.closest('#panel') && !e.target.closest('#btnInfo') && !e.target.closest('.modal')) closePanel(); });

$('#panel').addEventListener('change', e => {
  const s = sheets[currentId]; if (!s) return;
  if (e.target.id === 'goalIn'){ s.goal = Math.max(0, parseInt(e.target.value) || 0); touch(s, false); renderPanel(); updateCounts(); }
  if (e.target.id === 'grpSel'){ s.group = e.target.value; touch(s, false); renderLib(); renderList(); toast('Verplaatst naar ' + (e.target.selectedOptions[0].textContent)); }
});
$('#panel').addEventListener('click', async e => {
  const s = sheets[currentId]; if (!s) return;
  const g = e.target.closest('[data-goal]');
  if (g){ s.goal = s.goal === +g.dataset.goal ? 0 : +g.dataset.goal; touch(s, false); renderPanel(); updateCounts(); return; }
  if (e.target.closest('#favBtn')){ s.fav = !s.fav; touch(s, false); renderPanel(); renderLib(); renderList(); return; }
  const h = e.target.closest('[data-h]');
  if (h){
    const heads = [...ta.value.matchAll(/^#{1,3}\s+.+$/gm)]; const m = heads[+h.dataset.h];
    if (m){ measure.textContent = ta.value.slice(0, m.index); const sp = document.createElement('span'); sp.textContent='​'; measure.appendChild(sp);
      scroller.scrollTo({top: sp.offsetTop + $('#paper').offsetTop - 30, behavior:'smooth'}); ta.focus({preventScroll:true}); ta.setSelectionRange(m.index, m.index); if (isMobile()) closePanel(); }
    return;
  }
  const a = e.target.closest('[data-a]'); if (!a) return;
  const name = (titleOf(s).replace(/[\\/:*?"<>|]+/g, '').slice(0, 60) || 'tekst');
  switch (a.dataset.a){
    case 'copymd': copy(ta.value.replace(/\+\+(.+?)\+\+/g, ''), 'Markdown gekopieerd'); break;
    case 'copytxt': copy(plainText(ta.value), 'Tekst gekopieerd'); break;
    case 'dlmd': download(name + '.md', ta.value.replace(/\+\+(.+?)\+\+/g, ''), 'text/markdown'); break;
    case 'dlhtml': download(name + '.html', `<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><title>${esc(titleOf(s))}</title><style>body{font-family:Georgia,serif;max-width:680px;margin:60px auto;padding:0 20px;line-height:1.7;color:#3D3A44}blockquote{border-left:3px solid #CFC6EA;margin:1em 0;padding:.2em 1em;color:#8A8594}mark{background:#F8EBB8}</style></head><body>${mdToHtml(ta.value)}</body></html>`, 'text/html'); break;
    case 'dup': { const id = uid(); sheets[id] = {...cleanSheet(s), created:Date.now(), updated:Date.now(), trashed:false}; saveSheet(id, true); openSheet(id); renderLib(); toast('Gedupliceerd'); break; }
    case 'trash': s.trashed = true; touch(s, false); closePanel(); openSheet(null); renderLib(); toast('Naar de prullenbak verplaatst'); break;
    case 'restore': s.trashed = false; touch(s, false); ta.readOnly = false; renderPanel(); renderLib(); renderList(); toast('Teruggezet'); break;
    case 'destroy': confirmDialog('Definitief verwijderen?', 'Deze tekst verdwijnt op al je apparaten en kan niet worden teruggehaald.', 'Verwijderen', () => {
        const id = currentId; delete sheets[id]; saveSheet(id, true); closePanel(); openSheet(null); renderLib(); }); break;
  }
});
function touch(s, bumpDate){ if (bumpDate !== false) s.updated = Date.now(); else s.updated = Math.max(s.updated||0, Date.now()); saveSheet(currentId, true); }

async function copy(text, msg){
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch(e){
    const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); toast(msg); } catch(_) { toast('Kopiëren lukt hier niet'); }
    t.remove();
  }
}
async function download(filename, data, type){
  let dl = null;
  try { dl = window.claude && await window.claude.use('downloads'); } catch(e){}
  if (dl){
    try { await dl.save({filename, data: new Blob([data], {type: type + ';charset=utf-8'})}); }
    catch(e){
      try { await dl.save({filename, data}); } catch(_) { /* declined */ }
    }
    return;
  }
  copy(data, 'Downloaden kan hier niet — inhoud gekopieerd');
}

/* ---------------- Focus, theme, settings ---------------- */
function applySettings(){
  const dark = settings.theme === 'dark' || (settings.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('#btnTheme').innerHTML = icon(dark ? 'sun' : 'moon', '');
  const fonts = {sans:"'Nunito',system-ui,sans-serif", serif:"'Lora',Georgia,serif", mono:"'IBM Plex Mono',ui-monospace,monospace"};
  const r = document.documentElement.style;
  r.setProperty('--ed-font', fonts[settings.font] || fonts.sans);
  if (!isMobile()) r.setProperty('--ed-size', settings.size + 'px'); else r.setProperty('--ed-size', Math.max(15, settings.size - 1) + 'px');
  r.setProperty('--ed-width', settings.width + 'px');
  $('#app').classList.toggle('tw', !!settings.typewriter);
  $('#app').classList.toggle('dim', !!settings.dim);
  LS.set('settings', settings);
  renderMirror();
}
$('#btnTheme').onclick = () => {
  const dark = document.documentElement.dataset.theme === 'dark';
  settings.theme = dark ? 'light' : 'dark'; applySettings(); renderList(); if (!currentId) openSheet(null);
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => settings.theme === 'auto' && applySettings());

function toggleFocus(){
  const app = $('#app'); app.classList.toggle('focus');
  $('#btnFocus').classList.toggle('on', app.classList.contains('focus'));
  ta.focus();
}
$('#btnFocus').onclick = toggleFocus;
$('#toggleLib').onclick = () => {
  const app = $('#app');
  if (innerWidth <= 1100) app.classList.toggle('show-lib'); else app.classList.toggle('hide-lib');
};

function settingsDialog(){
  const opt = (k, v, label) => `<button class="chip ${settings[k]===v?'on':''}" data-k="${k}" data-v="${v}">${label}</button>`;
  openModal(`<h3>Instellingen</h3><p>Maak de schrijfomgeving helemaal van jou.</p>
    <h4 class="sec" style="padding:4px 0 8px">Thema</h4><div class="chips">${opt('theme','auto','Automatisch')}${opt('theme','light','Licht')}${opt('theme','dark','Donker')}</div>
    <h4 class="sec" style="padding:16px 0 8px">Lettertype</h4><div class="chips">${opt('font','sans','Nunito')}${opt('font','serif','<span style="font-family:Lora">Lora</span>')}${opt('font','mono','<span style="font-family:IBM Plex Mono">Mono</span>')}</div>
    <h4 class="sec" style="padding:16px 0 4px">Tekstgrootte <span id="szv">${settings.size}px</span></h4><input type="range" min="15" max="26" value="${settings.size}" id="sz">
    <h4 class="sec" style="padding:12px 0 4px">Regelbreedte <span id="wdv">${settings.width}px</span></h4><input type="range" min="520" max="900" step="20" value="${settings.width}" id="wd">
    <h4 class="sec" style="padding:12px 0 8px">Schrijven</h4><div class="chips">
      <button class="chip ${settings.typewriter?'on':''}" data-t="typewriter">Typemachinemodus</button>
      <button class="chip ${settings.dim?'on':''}" data-t="dim">Alinea uitlichten</button></div>
    <p class="muted" style="margin:10px 0 18px">Typemachinemodus houdt de regel waarop je typt in het midden van het scherm. Alinea uitlichten dimt alles behalve de alinea waar je in werkt.</p>
    <div class="btns"><button class="btn" data-close>Klaar</button></div>`);
  const d = $('#dialog');
  d.addEventListener('click', e => {
    const c = e.target.closest('[data-k]');
    if (c){ settings[c.dataset.k] = c.dataset.v; d.querySelectorAll(`[data-k="${c.dataset.k}"]`).forEach(x => x.classList.toggle('on', x === c)); applySettings(); renderList(); }
    const t = e.target.closest('[data-t]');
    if (t){ settings[t.dataset.t] = !settings[t.dataset.t]; t.classList.toggle('on'); applySettings(); }
  });
  $('#sz').oninput = e => { settings.size = +e.target.value; $('#szv').textContent = settings.size + 'px'; applySettings(); };
  $('#wd').oninput = e => { settings.width = +e.target.value; $('#wdv').textContent = settings.width + 'px'; applySettings(); };
}
$('#btnSettings').onclick = settingsDialog;

/* ---------------- Dialogs ---------------- */
function openModal(html){ $('#dialog').innerHTML = html; $('#modal').classList.add('open'); const f = $('#dialog input[type=text]:not([hidden] *)'); if (f) setTimeout(() => f.focus(), 30); }
function closeModal(){ $('#modal').classList.remove('open'); $('#dialog').replaceWith($('#dialog').cloneNode(false)); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.closest('[data-close]')) closeModal(); });

function groupDialog(g){
  let color = g ? g.color : COLORS[groups.length % COLORS.length];
  openModal(`<h3>${g ? 'Groep bewerken' : 'Nieuwe groep'}</h3><p>Groepen houden je projecten overzichtelijk.</p>
    <input type="text" id="gname" placeholder="Naam, bv. Roman" value="${g ? esc(g.name) : ''}" maxlength="40">
    <div class="swatches">${COLORS.map(c => `<button style="background:${c}" data-c="${c}" class="${c===color?'on':''}" aria-label="kleur"></button>`).join('')}</div>
    <div class="btns">${g ? '<button class="btn ghost" id="gdel" style="margin-right:auto">Verwijderen</button>' : ''}<button class="btn ghost" data-close>Annuleren</button><button class="btn" id="gok">${g ? 'Opslaan' : 'Maken'}</button></div>`);
  const d = $('#dialog');
  d.addEventListener('click', e => {
    const c = e.target.closest('[data-c]');
    if (c){ color = c.dataset.c; d.querySelectorAll('[data-c]').forEach(x => x.classList.toggle('on', x === c)); }
    if (e.target.closest('#gok')) ok();
    if (e.target.closest('#gdel')){
      closeModal();
      confirmDialog('Groep verwijderen?', `De teksten in “${esc(g.name)}” gaan terug naar de Inbox.`, 'Verwijderen', () => {
        groups = groups.filter(x => x.id !== g.id);
        for (const [id, s] of Object.entries(sheets)) if (s.group === g.id){ s.group = 'inbox'; s.updated = Date.now(); saveSheet(id, true); }
        saveProfile(); if (view === 'g:' + g.id) view = 'inbox'; renderLib(); renderList();
      });
    }
  });
  $('#gname').addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
  function ok(){
    const name = $('#gname').value.trim(); if (!name) return $('#gname').focus();
    if (g){ g.name = name; g.color = color; }
    else { const ng = {id: uid(), name, color}; groups.push(ng); view = 'g:' + ng.id; LS.set('view', view); }
    saveProfile(); closeModal(); renderLib(); renderList();
  }
}
function confirmDialog(title, text, okLabel, fn){
  openModal(`<h3>${title}</h3><p>${text}</p><div class="btns"><button class="btn ghost" data-close>Annuleren</button><button class="btn warn" id="cok">${okLabel}</button></div>`);
  $('#cok').onclick = () => { closeModal(); fn(); };
}
function helpDialog(){
  openModal(`<h3>Markup</h3><p>Schrijf gewoon door — opmaak doe je met een paar tekens, net als in Markdown.</p>
  <div class="help">
    <code># Kop</code><span>Kop (## en ### voor kleinere)</span>
    <code>**vet**</code><span>Vet · Ctrl/⌘ B</span>
    <code>*cursief*</code><span>Cursief · Ctrl/⌘ I</span>
    <code>==markeren==</code><span>Gemarkeerd</span>
    <code>&gt; citaat</code><span>Citaat</span>
    <code>- punt</code><span>Lijst (Enter gaat door)</span>
    <code>1. punt</code><span>Genummerde lijst</span>
    <code>[tekst](url)</code><span>Link · Ctrl/⌘ K</span>
    <code>++notitie++</code><span>Notitie voor jezelf, niet in export</span>
    <code>---</code><span>Scheidingslijn</span>
  </div>
  <h4 class="sec" style="padding:0 0 8px">Sneltoetsen</h4>
  <div class="help">
    <code>Ctrl Alt N</code><span>Nieuwe tekst</span>
    <code>Ctrl Alt F</code><span>Focusmodus</span>
    <code>Ctrl Alt P</code><span>Voorbeeld</span>
    <code>Ctrl Alt I</code><span>Info & doelen</span>
  </div>
  <div class="btns"><button class="btn" data-close>Begrepen</button></div>`);
}

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

/* ---------------- Mobile navigation ---------------- */
const isMobile = () => innerWidth <= 820;
function setMobile(v){ $('#app').dataset.view = v; if (v !== 'editor') { ta.blur(); closePanel(); } }
$('#backLib').onclick = () => setMobile('lib');
$('#backList').onclick = () => { setMobile('list'); renderList(); };
addEventListener('resize', () => { applySettings(); });

/* ---------------- Global keys ---------------- */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if ($('#modal').classList.contains('open')) return closeModal();
    if (panelOpen) return closePanel();
    if ($('#app').classList.contains('focus')) return toggleFocus();
  }
  if ((e.ctrlKey || e.metaKey) && e.altKey){
    const k = e.code;
    if (k === 'KeyN'){ e.preventDefault(); newSheet(); }
    else if (k === 'KeyF' && currentId){ e.preventDefault(); toggleFocus(); }
    else if (k === 'KeyP' && currentId){ e.preventDefault(); togglePreview(); }
    else if (k === 'KeyI' && currentId){ e.preventDefault(); panelOpen ? closePanel() : openPanel(); }
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden){ persistLocal(); for (const id of Object.keys(timers)){ clearTimeout(timers[id]); flush(id); } } else if (sbUser) sbPull(); });

/* ---------------- Boot ---------------- */
applySettings();
renderLib();
if (!sheets[currentId]) currentId = null;
openSheet(currentId);
if (!isMobile() && currentId) $('#app').dataset.view = 'editor';
syncIdle();
connect();
})();
</script>
