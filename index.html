<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schrijfkamer</title>
<meta name="theme-color" content="#FFFDF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#232321" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schrijfkamer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="config.js?v=4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Lora:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFDF8; --pane:#F6F2EA; --pane2:#FBF8F2; --card:#FFFFFF;
  --text:#34322F; --muted:#8C877F; --faint:#BDB7AD; --line:#EDE7DC;
  --sage:#B8D8C8; --lav:#CFC6EA; --peach:#F6D2BE; --blue:#C4DCEF; --butter:#F4E6B0; --coral:#E9A9A0;
  --accent:#5E9C80; --accent-soft:#E5F1EA; --sel:rgba(184,216,200,.5);
  --h:#34322F; --mk:#CBC4B8; --code:#F3EEE5; --hl:#F8EBB8; --cm:#DCEFE5; --link:#5B8DB8;
  --shadow:0 1px 2px rgba(52,50,47,.04),0 6px 20px rgba(52,50,47,.06);
  --radius:14px;
  --ed-font:'Nunito',system-ui,sans-serif; --ed-size:19px; --ed-width:680px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#232321; --pane:#1D1D1B; --pane2:#20201E; --card:#2C2C29;
  --text:#E8E5DF; --muted:#9E998F; --faint:#6A665F; --line:#363531;
  --sage:#8FAE9F; --lav:#A79FC6; --peach:#C9A897; --blue:#9DB4C8; --butter:#C9BD8F; --coral:#C98E86;
  --accent:#9CCBB4; --accent-soft:#2E3B34; --sel:rgba(143,174,159,.35);
  --h:#E8E5DF; --mk:#5F5B55; --code:#33322E; --hl:#5A5236; --cm:#2F4A3E; --link:#9CC1E2;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Nunito',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
svg{display:block}
.app{display:grid;grid-template-columns:230px 300px 1fr;height:100vh;height:100dvh;overflow:hidden;transition:grid-template-columns .25s ease}
.app.hide-lib{grid-template-columns:0 300px 1fr}
.app.focus{grid-template-columns:0 0 1fr}
.app.focus .lib,.app.focus .list{opacity:0;pointer-events:none}
.app.hide-lib .lib{opacity:0;pointer-events:none}

/* ---------- Library ---------- */
.lib{background:var(--pane);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden;padding-top:var(--sat);transition:opacity .2s}
.lib-head{display:flex;align-items:center;gap:10px;padding:18px 18px 10px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--sage);display:grid;place-items:center;flex:none}
.lib-head h1{font-size:17px;font-weight:800;margin:0;letter-spacing:-.01em;white-space:nowrap}
.lib-scroll{flex:1;overflow:auto;padding:6px 10px 10px}
.sec{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:16px 10px 6px;display:flex;justify-content:space-between;align-items:center}
.sec button{color:var(--muted);border-radius:6px;padding:2px}
.sec button:hover{color:var(--text);background:var(--line)}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;font-weight:600;font-size:14.5px;text-align:left;color:var(--text)}
.nav:hover{background:rgba(140,124,196,.08)}
.nav.on{background:var(--card);box-shadow:var(--shadow)}
.nav .ic{width:18px;height:18px;flex:none;color:var(--muted)}
.nav.on .ic{color:var(--accent)}
.nav .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
.nav .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin:0 4px}
.lib-foot{padding:10px 14px calc(12px + var(--sab));border-top:1px solid var(--line);display:flex;align-items:center;gap:6px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{cursor:pointer}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.sync.ok i{background:#8FC4A8}.sync.busy i{background:var(--butter)}.sync.err i{background:var(--coral)}

/* ---------- Sheet list ---------- */
.list{background:var(--pane2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden;padding-top:var(--sat);transition:opacity .2s}
.list-head{padding:16px 16px 10px;display:flex;align-items:center;gap:8px}
.list-head h2{font-size:18px;font-weight:800;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{margin:0 14px 10px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 12px 9px 34px;font-size:14px;outline:none}
.search input:focus{border-color:var(--sage)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sheets{flex:1;overflow:auto;padding:2px 10px 16px}
.sheet{display:block;width:100%;text-align:left;padding:13px 14px 13px 16px;border-radius:12px;margin-bottom:6px;position:relative;border:1px solid transparent}
.sheet:hover{background:rgba(140,124,196,.06)}
.sheet.on{background:var(--card);box-shadow:var(--shadow);border-color:var(--line)}
.sheet .del{position:absolute;right:8px;top:9px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--faint);opacity:0;transition:opacity .15s}
.sheet:hover .del,.sheet.on .del,.src:hover .del,.src.on .del{opacity:1}
.src .del{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--faint);opacity:0;transition:opacity .15s}
.src .del:hover{color:#C9776B;background:rgba(233,169,160,.18)}
.src .del svg{width:16px;height:16px}
.src .t,.src .s{padding-right:28px}
.sheet .del:hover{color:#C9776B;background:rgba(233,169,160,.18)}
.sheet .del svg{width:16px;height:16px}
@media (hover:none){.sheet .del,.src .del{opacity:.7}}
.sheet .t{padding-right:26px}
.sheet .bar{position:absolute;left:6px;top:14px;bottom:14px;width:3px;border-radius:3px}
.sheet .t{font-weight:700;font-size:14.5px;margin-bottom:3px;display:flex;gap:6px;align-items:center}
.sheet .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .t svg{flex:none;color:#E2B54E}
.sheet .x{font-size:13px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:1.45em}
.sheet .m{font-size:11.5px;color:var(--faint);margin-top:6px;font-weight:700;display:flex;gap:10px}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;line-height:1.5}
.empty .cat{width:96px;height:96px;margin:0 auto 12px}

/* ---------- Editor ---------- */
.main{display:flex;flex-direction:column;min-width:0;position:relative;background:var(--bg);padding-top:var(--sat)}
.topbar{display:flex;align-items:center;gap:4px;padding:10px 14px;min-height:56px;transition:opacity .3s}
.topbar .grow{flex:1}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.ib:hover{background:rgba(140,124,196,.1);color:var(--text)}
.ib.on{color:var(--accent);background:var(--accent-soft)}
.ib svg{width:19px;height:19px}
.fmt{display:flex;gap:2px;align-items:center;background:var(--card);border-radius:12px;padding:3px;box-shadow:var(--shadow)}
.fmt .ib{width:34px;height:32px;font-weight:800;font-size:14px}
.sep{width:1px;height:18px;background:var(--line);margin:0 3px}
.wc{font-size:12.5px;color:var(--muted);font-weight:700;padding:0 8px;white-space:nowrap}
.app.focus .topbar{position:absolute;top:var(--sat);left:0;right:0;z-index:10;opacity:0;pointer-events:none;transition:opacity .35s;background:linear-gradient(var(--bg) 60%,transparent)}
.app.focus:not(.reveal) .topbar{opacity:0!important;pointer-events:none}
.app.focus.reveal .topbar{opacity:1!important;pointer-events:auto}
.app.focus .fmtbar{display:none!important}
.app.focus .paper{padding-top:14vh}
.app.focus .scroll{scrollbar-width:none}
.app.focus .scroll::-webkit-scrollbar{display:none}
.app.focus .panel{display:none}
.focus-exit{position:fixed;top:calc(12px + var(--sat));right:12px;z-index:11;width:38px;height:38px;border-radius:50%;display:none;place-items:center;color:var(--muted);opacity:.35;background:var(--bg)}
.focus-exit svg{width:18px;height:18px}
.app.focus .focus-exit{display:grid}
@media (min-width:821px){ .app.focus .focus-exit{opacity:0;pointer-events:none;transition:opacity .35s} .app.focus.reveal .focus-exit{opacity:.6;pointer-events:auto} }
.app.typing .topbar:not(:hover){opacity:.25}
.back{display:none}

.scroll{flex:1;overflow:auto;scroll-behavior:auto}
.paper{max-width:calc(var(--ed-width) + 80px);margin:0 auto;padding:28px 40px 30vh}
.app.tw .paper{padding-bottom:60vh;padding-top:40vh}
.ed{position:relative}
.ed .mirror,.ed textarea{font-family:var(--ed-font);font-size:var(--ed-size);line-height:1.72;letter-spacing:.003em;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4;padding:0;margin:0;border:0;font-weight:400;font-variant-ligatures:none}
.ed .mirror{color:var(--text);min-height:60vh;pointer-events:none}
.ed .mirror:not(.measure){position:relative;z-index:1}
.ed .checks{z-index:0}
.ed textarea{position:absolute;inset:0;z-index:2;width:100%;height:100%;resize:none;outline:none;background:transparent;color:transparent;caret-color:var(--accent);overflow:hidden;-webkit-text-fill-color:transparent}
.ed textarea::selection{background:var(--sel);color:transparent}
.ed textarea::placeholder{color:var(--faint);-webkit-text-fill-color:var(--faint)}
.mk{color:var(--mk)}
.h{color:var(--h);text-shadow:.6px 0 0 currentColor}
.h .mk{color:var(--accent);opacity:.7}
.b{text-shadow:.5px 0 0 currentColor}
.i{color:var(--accent)}
.hl{background:var(--hl);border-radius:3px}
.cd{background:var(--code);border-radius:4px}
.cm{background:var(--cm);border-radius:3px;color:var(--muted)}
.ln{color:var(--link)}
.q{color:var(--muted)}
.li{color:var(--accent)}
.hr{color:var(--mk)}
.app.dim .mirror .para{opacity:.3;transition:opacity .2s}
.app.dim .mirror .para.cur{opacity:1}
.measure{position:absolute;visibility:hidden;left:0;right:0;top:0;pointer-events:none}

.nosheet{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}
.nosheet .cat{width:120px;height:120px;margin:0 auto 14px}
.nosheet h3{color:var(--text);margin:0 0 6px;font-size:19px}
.nosheet p{margin:0 0 18px;line-height:1.5;font-size:14.5px}
.btn{background:var(--accent);color:#fff;border-radius:11px;padding:10px 18px;font-weight:800;font-size:14px;box-shadow:var(--shadow)}
[data-theme="dark"] .btn{color:#24222A}
.btn.ghost{background:var(--card);color:var(--text)}
.btn.warn{background:var(--coral);color:#fff}

/* ---------- Info panel ---------- */
.panel{position:absolute;top:calc(56px + var(--sat));right:14px;width:310px;max-height:calc(100% - 76px - var(--sat));overflow:auto;background:var(--card);border-radius:16px;box-shadow:0 10px 40px rgba(61,58,68,.16);border:1px solid var(--line);padding:6px 18px 18px;z-index:20;display:none}
.panel{color:var(--text)}
.panel.open{display:block;animation:pop .16s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.panel h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 10px;font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--pane2);border-radius:11px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-weight:800}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.goal{display:flex;gap:14px;align-items:center;background:var(--pane2);border-radius:12px;padding:12px}
.goal .ring{width:62px;height:62px;flex:none;position:relative}
.goal .ring .cat{position:absolute;inset:8px}
.goal .gt{font-size:13px;color:var(--muted);line-height:1.4}
.goal .gt b{color:var(--text);font-size:15px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row input[type=number]{width:96px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 9px;font-size:14px;outline:none}
.row select{flex:1;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 9px;font-size:14px;outline:none}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;background:var(--card)}
.chip:hover{border-color:var(--sage)}
.chip.on{background:var(--accent-soft);border-color:var(--sage);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.outline button{display:block;width:100%;text-align:left;padding:5px 8px;border-radius:7px;font-size:13.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.outline button:hover{background:var(--pane2)}
.outline .o2{padding-left:20px}.outline .o3{padding-left:32px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.act{background:var(--pane2);border-radius:10px;padding:9px 10px;font-size:13px;font-weight:700;text-align:left;display:flex;gap:8px;align-items:center}
.act:hover{background:var(--accent-soft)}
.act svg{width:16px;height:16px;color:var(--muted);flex:none}
.act.danger:hover{background:rgba(233,169,160,.3)}
.muted{color:var(--muted);font-size:12.5px;line-height:1.5}
input[type=range]{width:100%;accent-color:var(--accent)}

/* ---------- Preview ---------- */
.preview{font-family:var(--ed-font);font-size:var(--ed-size);line-height:1.72}
.preview h1,.preview h2,.preview h3{line-height:1.3;margin:1.2em 0 .5em}
.preview h1{font-size:1.7em}.preview h2{font-size:1.35em}.preview h3{font-size:1.12em}
.preview blockquote{margin:1em 0;padding:.2em 1em;border-left:3px solid var(--sage);color:var(--muted)}
.preview code{background:var(--code);padding:.1em .35em;border-radius:5px;font-size:.88em}
.preview mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px}
.preview a{color:var(--link)}
.preview hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.preview .cmt{display:none}
.preview p{margin:0 0 1em}

/* ---------- Modal & toast ---------- */
.modal{position:fixed;inset:0;background:rgba(36,34,42,.35);display:none;place-items:center;z-index:50;padding:20px;backdrop-filter:blur(2px)}
.modal.open{display:grid}
.dialog{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.dialog h3{margin:0 0 6px;font-size:18px}
.dialog a{color:var(--accent);font-weight:700}
.dialog p{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.5}
.dialog input[type=text],.dialog input[type=email],.dialog input[type=password]{width:100%;border:1px solid var(--line);background:var(--pane2);border-radius:11px;padding:11px 13px;font-size:15px;outline:none;margin-bottom:12px}
.dialog input[type=text]:focus,.dialog input[type=email]:focus,.dialog input[type=password]:focus{border-color:var(--sage)}
.swatches{display:flex;gap:8px;margin-bottom:18px}
.swatches button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.swatches button.on{border-color:var(--text)}
.dialog .btns{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.help{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;margin-bottom:16px}
.help code{background:var(--code);padding:1px 6px;border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;white-space:nowrap}

/* ---------- Coach ---------- */
.today{margin:4px 2px 6px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);width:calc(100% - 4px);text-align:left;display:block}
.today .tl{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.today .tw{font-size:15px;font-weight:800;color:var(--text);margin:4px 0 8px;text-transform:none;letter-spacing:0}
.today .tw span{color:var(--muted);font-weight:700;font-size:13px}
.bar2{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar2 i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .4s}
.bar2.done i{background:#8FC4A8}
.streak{display:inline-flex;align-items:center;gap:4px;color:#D9894E;font-weight:800;font-size:12.5px;text-transform:none;letter-spacing:0}
.streak.off{color:var(--faint)}
.streak svg{width:14px;height:14px}
.tabs{display:flex;gap:4px;background:var(--pane2);border-radius:11px;padding:3px;margin:12px 0 4px;position:sticky;top:0;z-index:2}
.tabs button{flex:1;padding:7px 4px;border-radius:9px;font-size:13px;font-weight:800;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.week{display:flex;gap:6px;align-items:flex-end;height:74px;margin:6px 0 2px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.week b{width:100%;border-radius:5px 5px 3px 3px;background:var(--sage);min-height:3px}
.week b.ok{background:#8FC4A8}.week b.today{outline:2px solid var(--accent);outline-offset:1px}
.week span{font-size:10.5px;color:var(--muted);font-weight:800}
.idea{background:var(--pane2);border-radius:13px;padding:13px 14px;margin-bottom:9px}
.idea .k{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
.idea .q{font-size:14.5px;line-height:1.45;font-weight:700;color:var(--text)}
.idea .w{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.45}
.idea .ia{display:flex;gap:6px;margin-top:9px}
.idea .ia button{font-size:12px;font-weight:800;padding:5px 10px;border-radius:8px;background:var(--card);color:var(--text);border:1px solid var(--line)}
.idea .ia button:hover{border-color:var(--sage)}
.ctx{font-size:12.5px;color:var(--muted);line-height:1.5;margin:4px 0 10px;font-style:italic}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--pane2);border-radius:12px;font-weight:700;font-size:14px;width:100%;text-align:left}
.sw{width:38px;height:22px;border-radius:22px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.toggle.on .sw{background:var(--accent)}.toggle.on .sw::after{left:19px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.45}
.chk:last-child{border-bottom:0}
.chk .sm{width:26px;flex:none;text-align:center;font-weight:800;border-radius:7px;padding:1px 0;font-size:12.5px}
.chk small{display:block;color:var(--muted);font-size:12px}
.meter{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.meter:last-child{border-bottom:0}
.meter b{font-weight:800}
.tip{background:var(--accent-soft);border-radius:11px;padding:10px 12px;font-size:13px;line-height:1.5;margin:6px 0}
.senses{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.senses span{font-size:12px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--pane2);color:var(--faint)}
.senses span.on{background:var(--accent-soft);color:var(--accent)}
/* style check layer: same metrics as the mirror, sits behind it */
.ed .checks{position:absolute;inset:0;color:transparent;pointer-events:none;font-family:var(--ed-font);font-size:var(--ed-size);line-height:1.72;letter-spacing:.003em;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4;font-weight:400;font-variant-ligatures:none}
.c-long{background:rgba(246,210,190,.42);border-radius:3px}
.c-xlong{background:rgba(233,169,160,.38);border-radius:3px}
.c-fill{text-decoration:underline wavy #E0A48F;text-decoration-thickness:1.5px;text-underline-offset:5px}
.c-pass{text-decoration:underline dashed #7DA7CF;text-decoration-thickness:1.5px;text-underline-offset:5px}
.c-rep{text-decoration:underline dotted #5E9C80;text-decoration-thickness:2.5px;text-underline-offset:5px}
.c-start{text-decoration:underline solid #D9B44A;text-decoration-thickness:2px;text-underline-offset:5px}
[data-theme="dark"] .c-long{background:rgba(201,168,151,.18)}[data-theme="dark"] .c-xlong{background:rgba(201,142,134,.22)}
/* sprint */
.sprint-badge{font-size:12.5px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:9px;padding:6px 10px;display:none;font-variant-numeric:tabular-nums}
.sprint-badge.on{display:inline-block}
.sprint-line{position:fixed;top:0;left:0;height:3px;background:var(--accent);opacity:.45;z-index:30;display:none;transition:width 1s linear}
.sprint-line.on{display:block}
/* nudge */
.nudge{position:absolute;right:18px;bottom:calc(18px + var(--sab));display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:8px 14px 8px 8px;font-size:13.5px;font-weight:700;z-index:15;opacity:0;transform:translateY(8px);pointer-events:none;transition:.35s}
.nudge.show{opacity:1;transform:none;pointer-events:auto}
.nudge .cat{width:40px;height:40px}
.nudge .x{color:var(--faint);margin-left:4px;font-size:16px}

/* ---------- Bronnen ---------- */
.reader{display:none;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.main{min-height:0;overflow:hidden}
#readerScroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.app.srcmode .reader{display:flex}
.app.srcmode .reader .topbar{opacity:1!important;position:static;pointer-events:auto}
.app.srcmode #topbar,.app.srcmode #fmtMob,.app.srcmode #scroll,.app.srcmode #nosheet,.app.srcmode #nudge,.app.srcmode .focus-exit{display:none!important}
.rd{max-width:720px;margin:0 auto;padding:10px 40px 30vh}
.rd h1{font-size:28px;line-height:1.25;margin:6px 0 8px;letter-spacing:-.01em}
.rd .meta{color:var(--muted);font-size:13.5px;font-weight:700;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-bottom:16px}
.rd .meta a{color:var(--accent);text-decoration:none}
.rd .ex{font-size:16px;line-height:1.6;color:var(--muted);border-left:3px solid var(--sage);padding-left:14px;margin:0 0 18px}
.rd .body{font-family:var(--ed-font);font-size:calc(var(--ed-size) - 1px);line-height:1.72}
.rd .body h2,.rd .body h3{line-height:1.3;margin:1.3em 0 .5em}
.rd .body blockquote{margin:1em 0;padding:.2em 1em;border-left:3px solid var(--sage);color:var(--muted)}
.rd .body a{color:var(--link)}
.rd .body p{margin:0 0 1em}
.rd .body ::selection{background:var(--hl)}
.notebox{background:var(--pane2);border-radius:14px;padding:12px 14px;margin:0 0 18px}
.notebox textarea{width:100%;border:0;background:transparent;resize:none;outline:none;font:inherit;font-size:15px;line-height:1.55;color:var(--text);min-height:48px}
.notebox .lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 16px}
.tag{font-size:12.5px;font-weight:800;padding:4px 6px 4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);display:inline-flex;gap:4px;align-items:center}
.tag button{color:var(--accent);opacity:.6;font-size:14px;line-height:1;padding:0 3px}
.tag button:hover{opacity:1}
.tagrow input{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12.5px;width:120px;outline:none}
.tagrow input:focus{border-color:var(--sage);border-style:solid}
.src{display:block;width:100%;text-align:left;padding:12px 14px 12px 16px;border-radius:12px;margin-bottom:6px;position:relative;border:1px solid transparent}
.src:hover{background:rgba(94,156,128,.06)}
.src.on{background:var(--card);box-shadow:var(--shadow);border-color:var(--line)}
.src .s{font-size:11px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;display:flex;gap:6px;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.src .t{font-weight:700;font-size:14.5px;line-height:1.35;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.src .x{font-size:13px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.src .tg{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.src .tg span{font-size:11px;font-weight:800;color:var(--muted);background:var(--pane);border-radius:999px;padding:2px 8px}
.src.loading .s::after{content:'ophalen…';color:var(--faint);text-transform:none;letter-spacing:0;font-weight:700}
.dialog.wide{max-width:600px}
.rtabs{display:flex;gap:4px;background:var(--pane2);border-radius:11px;padding:3px;margin:0 0 14px}
.rtabs button{flex:1;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:800;color:var(--muted)}
.rtabs button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.srow{display:flex;gap:8px;margin-bottom:12px}
.srow input{flex:1;margin:0!important}
.results{max-height:min(52vh,460px);overflow:auto;margin:0 -6px;padding:0 6px}
.res{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.res:last-child{border-bottom:0}
.res .rb{flex:1;min-width:0}
.res .rs{font-size:11.5px;color:var(--accent);font-weight:800;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.res .rt{font-weight:700;font-size:14.5px;line-height:1.35;margin:2px 0}
.res .rd2{font-size:13px;color:var(--muted);line-height:1.45}
.res .rt a{color:inherit;text-decoration:none}
.res .rt a:hover{text-decoration:underline}
.res .save{flex:none;font-size:12.5px;font-weight:800;padding:7px 12px;border-radius:9px;background:var(--accent-soft);color:var(--accent)}
.res .save[disabled]{background:var(--pane2);color:var(--muted)}
.dialog textarea{width:100%;border:1px solid var(--line);background:var(--pane2);border-radius:11px;padding:11px 13px;font:inherit;font-size:15px;outline:none;margin-bottom:12px;resize:vertical;min-height:110px;color:var(--text)}
.dialog textarea:focus{border-color:var(--sage)}
.citebar{position:fixed;z-index:40;background:var(--text);color:var(--bg);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.2);display:none}
.citebar.show{display:block}
@media (max-width:820px){ .rd{padding:6px 20px 40vh} .rd h1{font-size:23px} }

/* ---------- Braindump & tijdlijn ---------- */
.board{display:none;flex:1;min-height:0;overflow:auto;flex-direction:column}
.app.boardmode .board{display:flex}
.app.boardmode #topbar,.app.boardmode #fmtMob,.app.boardmode #scroll,.app.boardmode #nosheet,.app.boardmode #nudge,.app.boardmode .focus-exit,.app.boardmode #reader{display:none!important}
@media (min-width:821px){ .app.boardmode,.app.boardmode.show-lib{grid-template-columns:230px 0 1fr}.app.boardmode .list{opacity:0;pointer-events:none}.app.boardmode .lib{opacity:1;pointer-events:auto} }
.bhead{display:flex;align-items:center;gap:10px;padding:12px 22px;position:sticky;top:0;background:var(--bg);z-index:3}
.seg{display:flex;background:var(--pane2);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:9px;font-weight:800;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.btags{display:flex;gap:6px;flex-wrap:wrap;padding:0 22px 10px}
.bbody{padding:6px 22px 60px}
.capture{max-width:760px;margin:0 auto 18px}
.capture textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;font:inherit;font-size:15.5px;line-height:1.5;resize:none;outline:none;box-shadow:var(--shadow);color:var(--text);overflow:hidden}
.capture textarea:focus{border-color:var(--sage)}
.cards{columns:4 240px;column-gap:14px}
.card{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px 10px;margin:0 0 14px;box-shadow:var(--shadow);display:block}
.card .ct{font-size:14.5px;line-height:1.55;white-space:normal;overflow-wrap:anywhere}
.card .cn{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.45}
.card .cmeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.card .cmeta:empty{display:none}
.card .cdate{font-size:11.5px;font-weight:800;color:#B07A3C;background:rgba(244,230,176,.6);border-radius:999px;padding:2px 8px}
.card .ctag{font-size:11.5px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 8px;cursor:pointer}
.card .cs{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-top:8px;text-decoration:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card .cs:hover{color:var(--accent)}
.card .ca{display:flex;gap:4px;margin-top:8px;opacity:0;transition:opacity .15s}
.card:hover .ca{opacity:1}
@media (hover:none){.card .ca{opacity:1}}
.card .ca button{font-size:12px;font-weight:800;padding:4px 9px;border-radius:8px;color:var(--muted);background:var(--pane2)}
.card .ca button:hover{color:var(--accent);background:var(--accent-soft)}
.tline{max-width:760px;margin:0 auto;position:relative;padding-left:120px}
.tline::before{content:'';position:absolute;left:96px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:2px}
.ty{font-size:22px;font-weight:800;margin:22px 0 10px -120px;width:90px;text-align:right;color:var(--accent)}
.ty:first-child{margin-top:0}
.ti{position:relative;margin-bottom:14px}
.ti .tdot{position:absolute;left:-29px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--sage)}
.ti .tdl{position:absolute;left:-120px;width:86px;text-align:right;top:13px;font-size:12px;font-weight:800;color:var(--muted);line-height:1.3}
.ti .card{margin:0}
.sfrag{padding:8px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.5;cursor:pointer;display:flex;gap:10px;justify-content:space-between}
.sfrag:first-of-type{border-top:0}
.sfrag:hover span{color:var(--accent)}
.sfrag b{font-size:11.5px;color:#B07A3C;white-space:nowrap}
.citebar{padding:0;display:none;overflow:hidden}
.citebar.show{display:flex}
.citebar button{color:inherit;padding:8px 12px;font-weight:800;font-size:13px}
.citebar button + button{border-left:1px solid rgba(255,255,255,.2)}
.citebar button:hover{background:rgba(255,255,255,.12)}
@media (max-width:820px){
  .bhead{padding:10px 12px;gap:6px}.btags{padding:0 12px 8px}.bbody{padding:4px 12px 50vh}
  .cards{columns:1}
  .tl{padding-left:86px}.tline::before{left:66px}.ty{margin-left:-86px;width:60px;font-size:18px}.ti .tdl{left:-86px;width:52px;font-size:11px}.ti .tdot{left:-26px}
  .seg button{padding:7px 10px}
}

/* ---------- Projecten & onderzoekspaneel ---------- */
.pchips{display:flex;gap:6px;flex-wrap:wrap;padding:0 4px 10px}
.bhead + .pchips{padding:0 22px 8px}
.psel{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 9px;font-size:13.5px;outline:none;color:var(--text)}
.card .cproj{font-size:11.5px;font-weight:800;color:var(--text);border-radius:999px;padding:2px 8px;opacity:.85}
.research{position:absolute;top:calc(56px + var(--sat));right:0;bottom:0;width:380px;background:var(--pane2);border-left:1px solid var(--line);display:none;flex-direction:column;z-index:9}
.app.rp .research{display:flex}
.app.srcmode .research,.app.boardmode .research,.app.focus .research{display:none!important}
@media (min-width:821px){ .app.rp:not(.srcmode):not(.boardmode):not(.focus) #scroll{padding-right:380px} }
.rphead{display:flex;align-items:center;gap:4px;padding:10px 10px 8px 14px}
.rphead .ib{font-size:15px}
.rpscroll{flex:1;min-height:0;overflow:auto;padding:4px 14px 40px}
.rpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px}
.rpk{font-size:11px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.rpt{font-size:14px;line-height:1.5;margin-top:4px;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.rph{font-size:11.5px;color:var(--faint);margin-top:5px;font-weight:700}
.rpa{display:flex;gap:6px;margin-top:8px;align-items:center}
.rpa button,.rpa a{font-size:12px;font-weight:800;padding:5px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent);text-decoration:none}
.rpa a{background:var(--pane2);color:var(--muted)}
.rpa button[disabled]{opacity:.6}
.rpback{font-weight:800;color:var(--accent);font-size:13.5px;padding:4px 0}
.rpbody{font-size:15px;line-height:1.65;margin-top:8px}
.rpbody p{margin:0 0 .9em}.rpbody h2,.rpbody h3{font-size:16px;margin:1.1em 0 .4em}
.rpbody blockquote{margin:.8em 0;padding:.1em .9em;border-left:3px solid var(--sage);color:var(--muted)}
.rpbody a{color:var(--link)}
.rpbody ::selection{background:var(--hl)}
@media (max-width:820px){ .research{top:0;width:100%;z-index:26;padding-top:var(--sat);border-left:0} }

/* ---------- Uitzoeken, opzoeken, links ---------- */
.todo{background:rgba(244,230,176,.85);border-radius:3px;box-shadow:0 0 0 1px rgba(217,180,74,.35)}
[data-theme="dark"] .todo{background:rgba(201,189,143,.3)}
.wl{text-decoration:underline;text-decoration-color:rgba(91,141,184,.4);text-underline-offset:4px}
.rphead .seg button{padding:6px 9px;font-size:12.5px}
.rpa .ok{background:rgba(143,196,168,.25);color:#4E8C6E}
.rpa .ghost{background:var(--pane2);color:var(--muted)}
.rpa{flex-wrap:wrap}
.linkbox{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.lchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.lchips button{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(91,141,184,.12);color:var(--link)}
.lchips button.miss{background:var(--pane2);color:var(--faint);text-decoration:line-through}
.defs{margin:6px 0 0;padding-left:20px;font-size:14px;line-height:1.5}
.defs li{margin-bottom:4px}
.syns{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.syns button{font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.acbox{position:fixed;z-index:45;width:320px;max-height:260px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:5px;display:none}
.acbox.show{display:block}
.acbox button{display:flex;width:100%;justify-content:space-between;gap:10px;align-items:baseline;text-align:left;padding:7px 10px;border-radius:8px;font-size:14px}
.acbox button b{font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.acbox button span{font-size:11.5px;color:var(--muted);font-weight:800;flex:none}
.acbox button.on,.acbox button:hover{background:var(--accent-soft)}
.edpill{position:fixed;z-index:44;background:var(--text);color:var(--bg);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.2);display:none;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edpill.show{display:block}
.edpill b{font-weight:800}

/* ---------- Sneltoetsen ---------- */
kbd{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;background:var(--pane2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 7px;white-space:nowrap;color:var(--text)}
kbd.dupe{border-color:var(--coral);color:#C9776B}
.pal{max-height:min(56vh,440px);overflow:auto;margin:0 -6px}
.pal button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;text-align:left;font-size:14.5px;font-weight:600}
.pal button.on,.pal button:hover{background:var(--accent-soft)}
.keys{max-height:min(52vh,460px);overflow:auto;margin:0 -6px;padding:0 6px}
.krow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.krow span{flex:1}
.krow .chip{padding:4px 10px;font-size:12px}
/* ---------- Ontdek ---------- */
.rel{display:flex;flex-direction:column;gap:5px}
.rel button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.rel button:hover{border-color:var(--sage)}
.rel b{display:block;color:var(--link);font-size:13.5px}
.rel .lg{font-size:10px;color:var(--muted);background:var(--pane2);border-radius:5px;padding:1px 5px;margin-left:4px;vertical-align:1px}
.rel span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.dterms .grow{flex:1}
.dlang{padding:2px}.dlang button{padding:3px 9px!important;font-size:11.5px!important;text-decoration:none!important;color:var(--muted)!important;background:transparent!important}
.dlang button.on{background:var(--card)!important;color:var(--text)!important}
.dterms{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 10px}
.dterms button{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--pane);color:var(--faint);text-decoration:line-through}
.dterms button.on{background:var(--accent-soft);color:var(--accent);text-decoration:none}
.dterms button:last-child{text-decoration:none;color:var(--muted)}
.dtrail{font-size:12.5px;color:var(--muted);margin:-2px 0 10px;line-height:1.5}
.dtrail button{font-weight:800;color:var(--accent);margin-right:4px}
.dmain img{float:right;width:84px;height:84px;object-fit:cover;border-radius:10px;margin:0 0 6px 10px}
.dmain::after{content:'';display:block;clear:both}
.dh{margin:3px 0 4px;font-size:17px;line-height:1.3}
.dsec{margin:16px 0 8px}
.dload{text-align:center;padding:20px 0}.dload .cat{width:70px;height:70px;margin:0 auto 6px}
.facts{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin-bottom:9px}
.fr{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.45}
.fr:last-child{border-bottom:0}
.fr > span{color:var(--muted);font-weight:700;font-size:12.5px}
.fr .fx{color:var(--link);font-weight:700;text-align:left;font-size:13.5px}
.fr .fx:hover{text-decoration:underline}
.fr .fx + .fx::before{content:'· ';color:var(--faint)}
.fdate{font-weight:700}
.ftl{font-size:11px;font-weight:800;color:#B07A3C;background:rgba(244,230,176,.6);border-radius:999px;padding:1px 7px;margin-left:6px}
.rpi .facts{border:0;padding:0;margin:6px 0 0;background:transparent}
.ans{background:rgba(143,196,168,.14);border-radius:10px;padding:9px 10px;margin-top:8px;font-size:13.5px;line-height:1.5}
.ans.weak{background:var(--pane2)}
.ansf{font-weight:800;margin-bottom:3px}
.answer{margin-top:4px}

/* ---------- Mobile ---------- */
@media (max-width:820px){
  .app,.app.hide-lib,.app.focus{display:block;position:relative}
  .lib,.list,.main{position:absolute;inset:0;transition:transform .28s cubic-bezier(.3,.7,.2,1);opacity:1!important;pointer-events:auto!important}
  .app .lib{transform:translateX(0)}
  .app .list,.app .main{transform:translateX(100%)}
  .app[data-view="list"] .lib{transform:translateX(-30%)}
  .app[data-view="list"] .list{transform:translateX(0)}
  .app[data-view="editor"] .lib{transform:translateX(-30%)}
  .app[data-view="editor"] .list{transform:translateX(-30%)}
  .app[data-view="editor"] .main{transform:translateX(0)}
  .lib,.list{border-right:0}
  .back{display:grid}
  .hide-m{display:none!important}
  .paper{padding:14px 20px 40vh}
  .topbar{padding:8px 8px;gap:2px}
  .fmtbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 10px 8px;display:flex;overflow-x:auto;gap:2px;scrollbar-width:none}
  .fmtbar::-webkit-scrollbar{display:none}
  .fmtbar .fmt{flex:none}
  .panel{left:10px;right:10px;width:auto;top:calc(54px + var(--sat))}
  .sheet{padding:14px 14px 14px 18px}
  :root{--ed-size:18px}
  .app.typing .topbar:not(:hover){opacity:1}
  .app.focus .paper{padding-top:10vh}
}
@media (min-width:821px){ .fmtbar{display:none} }
@media (max-width:1100px) and (min-width:821px){ .app{grid-template-columns:0 290px 1fr}.app .lib{opacity:0;pointer-events:none}.app.show-lib{grid-template-columns:220px 290px 1fr}.app.show-lib .lib{opacity:1;pointer-events:auto}.app.focus{grid-template-columns:0 0 1fr} }
</style>
</head>

      <button class="ib" id="btnSettings" title="Instellingen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></button>

  <!-- Editor -->

    <div class="topbar" id="topbar">
      <button class="ib back" id="backList" title="Terug"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>

      <button class="ib" id="btnPreview" title="Voorbeeld (Ctrl+Alt+P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('sk_'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('sk_'+k, JSON.stringify(v)); }catch(e){} }
};
const uid = () => (Date.now().toString(36) + Math.random().toString(36).slice(2, 9));
const COLORS = ['#B8D8C8','#CFC6EA','#F6D2BE','#C4DCEF','#F4E6B0','#E9A9A0'];

/* ---------------- Icons & cats ---------------- */
const I = {
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z"/>',
  all:'<path d="M4 6h16M4 12h16M4 18h10"/>',
  recent:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
  down:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
  restore:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  dup:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>'
};
const icon = (n, cls='ic', size) => `<svg class="${cls}" ${size?`width="${size}" height="${size}"`:''} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

function cat(mood){
  const dark = document.documentElement.dataset.theme === 'dark';
  const fur = dark ? '#C9B8A8' : '#F6D2BE', line = dark ? '#E6E2EC' : '#3D3A44', bg = dark ? '#2E3B34' : '#E5F1EA', blush = '#E9A9A0';
  let eyes, mouth, extra = '';
  if (mood === 'sleepy'){
    eyes = `<path d="M38 52q5 4 10 0M62 52q5 4 10 0" stroke="${line}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    mouth = `<path d="M51 62q4 3 8 0" stroke="${line}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
    extra = `<text x="80" y="30" font-family="Nunito" font-weight="800" font-size="13" fill="${line}" opacity=".55">z</text><text x="89" y="21" font-family="Nunito" font-weight="800" font-size="10" fill="${line}" opacity=".4">z</text>`;
  } else if (mood === 'happy'){
    eyes = `<path d="M38 54q5-6 10 0M62 54q5-6 10 0" stroke="${line}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    mouth = `<path d="M48 61q7 8 14 0" stroke="${line}" stroke-width="2.6" fill="${blush}" stroke-linecap="round"/>`;
    extra = `<path d="M90 26l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#F4E6B0"/><path d="M20 30l1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5z" fill="#B8D8C8"/>`;
  } else { // curious
    eyes = `<circle cx="43" cy="52" r="4.5" fill="${line}"/><circle cx="67" cy="52" r="4.5" fill="${line}"/><circle cx="44.5" cy="50.5" r="1.4" fill="#fff"/><circle cx="68.5" cy="50.5" r="1.4" fill="#fff"/>`;
    mouth = `<path d="M50 62q2.5 3 5 0q2.5 3 5 0" stroke="${line}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    extra = `<text x="84" y="34" font-family="Nunito" font-weight="800" font-size="18" fill="${line}" opacity=".5">?</text>`;
  }
  return `<svg class="cat" viewBox="0 0 110 110"><circle cx="55" cy="55" r="52" fill="${bg}"/>
    <path d="M28 44 L30 18 L48 34 Z" fill="${fur}" stroke="${line}" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M82 44 L80 18 L62 34 Z" fill="${fur}" stroke="${line}" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M34 30l1 9 7-4z M76 30l-1 9-7-4z" fill="${blush}" opacity=".7"/>
    <ellipse cx="55" cy="58" rx="31" ry="26" fill="${fur}" stroke="${line}" stroke-width="2.6"/>
    <circle cx="38" cy="63" r="4.5" fill="${blush}" opacity=".55"/><circle cx="72" cy="63" r="4.5" fill="${blush}" opacity=".55"/>
    ${eyes}<path d="M53 57.5h4l-2 2.4z" fill="${line}"/>${mouth}
    <path d="M24 58h10M25 64l9-2M86 58H76M85 64l-9-2" stroke="${line}" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>${extra}</svg>`;
}

/* ---------------- State ---------------- */
let settings = Object.assign({theme:'light', font:'sans', size:19, width:680, typewriter:false, dim:false, check:false, nudge:true}, LS.get('settings', {}));
if (!LS.get('v2', false)){ settings.theme = 'light'; LS.set('v2', true); }
let sheets = LS.get('sheets', {});     // id -> sheet
let groups = LS.get('groups', []);     // [{id,name,color}]
let view = LS.get('view', 'inbox');    // inbox | all | recent | fav | trash | g:<id>
let currentId = LS.get('current', null);
let query = '';
let cloud = 'pending';
const timers = {}, inflight = {}, again = {}, lastLocalEdit = {};

const titleOf = s => {
  const line = (s.body || '').split('\n').find(l => l.trim()) || '';
  return line.replace(/^#{1,6}\s+/, '').replace(/[*_=`~>]|\+\+/g, '').trim().slice(0, 90) || 'Naamloos';
};
const excerptOf = s => {
  const lines = (s.body || '').split('\n').filter(l => l.trim());
  return lines.slice(1).join(' ').replace(/^#{1,6}\s+/g, '').replace(/[*_=`#>]|\+\+/g, '').slice(0, 160);
};
const countWords = t => { const m = t.replace(/[#*_=`>\-+]/g, ' ').match(/[\p{L}\p{N}’'-]+/gu); return m ? m.length : 0; };
const fmtDate = ts => {
  const d = new Date(ts), now = new Date();
  const days = Math.floor((new Date(now.toDateString()) - new Date(d.toDateString())) / 864e5);
  const time = d.toLocaleTimeString('nl-NL', {hour:'2-digit', minute:'2-digit'});
  if (days === 0) return 'Vandaag ' + time;
  if (days === 1) return 'Gisteren ' + time;
  if (days < 7) return d.toLocaleDateString('nl-NL', {weekday:'long'});
  return d.toLocaleDateString('nl-NL', {day:'numeric', month:'short', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined});
};

function persistLocal(){ LS.set('sheets', sheets); LS.set('groups', groups); }

/* ---------------- Sync ---------------- */
// Backends: Supabase (when config.js is filled in), the claude.ai artifact store, or this device only.
const CFG = window.SCHRIJF_CONFIG || {};
const useSupabase = !!(CFG.supabaseUrl && CFG.supabaseKey);
let backend = null;          // {write(id, sheet), remove(id), saveGroups(groups)}
let sb = null, sbUser = null, sbChannel = null, noStatsCol = false;

function setSync(state, text){
  const el = $('#sync'); el.className = 'sync ' + state; el.querySelector('span').textContent = text;
  el.title = text;
}
function syncIdle(){
  if (cloud === 'on') setSync('ok', 'Gesynchroniseerd');
  else if (cloud === 'pending') setSync('busy', 'Verbinden…');
  else if (cloud === 'login') setSync('err', 'Inloggen');
  else setSync('', 'Alleen op dit apparaat');
}
function cleanSheet(s){ return {body:s.body||'', group:s.group||'inbox', fav:!!s.fav, trashed:!!s.trashed, goal:s.goal||0, created:s.created||Date.now(), updated:s.updated||Date.now()}; }

let pendingDel = new Set(LS.get('pendingDel', []));
function saveSheet(id, immediate){
  lastLocalEdit[id] = Date.now();
  if (!sheets[id]){ pendingDel.add(id); LS.set('pendingDel', [...pendingDel]); }
  persistLocalSoon();
  if (cloud !== 'on') return;
  setSync('busy', 'Opslaan…');
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => flush(id), immediate ? 0 : 800);
}
let lsTimer;
function persistLocalSoon(){ clearTimeout(lsTimer); lsTimer = setTimeout(persistLocal, 300); }

async function flush(id){
  delete timers[id];
  if (!backend) return;
  if (inflight[id]){ again[id] = true; return; }
  inflight[id] = true;
  do {
    again[id] = false;
    const s = sheets[id];
    try {
      if (s){ await backend.write(id, cleanSheet(s)); if (sheets[id]){ sheets[id].synced = true; persistLocalSoon(); } }
      else { await backend.remove(id); if (!sheets[id]){ pendingDel.delete(id); LS.set('pendingDel', [...pendingDel]); } }
    } catch (e) { handleDbError(e); }
  } while (again[id]);
  inflight[id] = false;
  if (!Object.keys(timers).length && !Object.values(inflight).some(Boolean)) syncIdle();
}
function handleDbError(e){
  console.warn('sync', e);
  const code = e && e.code, msg = String((e && e.message) || '');
  if (code === 'quota_exceeded') toast('Opslag in de cloud is vol — verwijder oude teksten uit de prullenbak.');
  else if (code === 'revoked' || code === 'not_granted') { cloud = 'off'; }
  else if (/jwt|auth|401/i.test(msg) || code === 'PGRST301'){ cloud = 'login'; syncIdle(); return; }
  lastError = [code, msg].filter(Boolean).join(' · ') || 'onbekende fout';
  setSync('err', 'Opslaan mislukt — tik voor details');
}
let lastError = '';
let profileBusy = false, profileAgain = false;
async function saveProfile(){
  persistLocalSoon();
  if (cloud !== 'on' || !backend) return;
  if (profileBusy){ profileAgain = true; return; }
  profileBusy = true;
  do { profileAgain = false; try { await backend.saveProfile({groups, stats}); } catch(e){ handleDbError(e); } } while (profileAgain);
  profileBusy = false;
}

/* Apply a sheet that came from the server. Returns true when something changed. */
function applyRemote(sid, d){
  if (pendingDel.has(sid)){ if (cloud === 'on') saveSheet(sid, true); return false; }
  const busy = timers[sid] || inflight[sid] || (Date.now() - (lastLocalEdit[sid]||0) < 2500);
  if (busy) return false;
  const local = sheets[sid];
  if (local && (local.updated||0) > (d.updated||0)){ if (cloud === 'on') saveSheet(sid, true); return false; }
  if (local && local.updated === d.updated && local.body === d.body){ local.synced = true; return false; }
  sheets[sid] = {...cleanSheet(d), body: String(d.body||''), synced:true};
  if (sid === currentId && ta.value !== sheets[sid].body){
    const pos = ta.selectionStart; ta.value = sheets[sid].body;
    if (document.activeElement === ta) ta.setSelectionRange(Math.min(pos, ta.value.length), Math.min(pos, ta.value.length));
    renderMirror(); updateCounts(); curWords = countWords(ta.value); renderChecks();
  }
  return true;
}
function applyRemoteDelete(sid){
  if (!sheets[sid] || timers[sid] || inflight[sid]) return false;
  delete sheets[sid]; return true;
}
function afterRemoteChange(){
  persistLocalSoon(); renderLib(); renderList();
  if (currentId && !sheets[currentId]) openSheet(null); else if (panelOpen) renderPanel();
}
/* Local sheets missing on the server: new ones are uploaded, ones that were synced before were deleted elsewhere. */
function reconcile(remoteIds){
  let changed = false;
  for (const sid of Object.keys(sheets)){
    if (remoteIds.has(sid)) continue;
    if (sheets[sid].synced && !timers[sid] && !inflight[sid]){ delete sheets[sid]; changed = true; }
    else saveSheet(sid, true);
  }
  return changed;
}
function mergeGroups(remote){
  const byId = new Map(remote.map(g => [g.id, {...g}]));
  let extra = false;
  for (const g of groups) if (!byId.has(g.id)){ byId.set(g.id, g); extra = true; }
  groups = [...byId.values()];
  return extra;
}

async function connect(){
  if (useSupabase) return connectSupabase();
  if (!window.claude || !window.claude.use){ cloud = 'off'; syncIdle(); return; }
  let user, db;
  try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch(e){ db = null; }
  const id = user ? await user.id() : null;
  if (!db || !id){ cloud = 'off'; syncIdle(); return; }
  const profileRef = db.doc('data/users/' + id + '/profile');
  const sheetsCol = profileRef.collection('sheets');
  backend = {
    write: (sid, s) => sheetsCol.doc(sid).set(s),
    remove: sid => sheetsCol.doc(sid).delete(),
    saveProfile: d => profileRef.set(d)
  };
  let firstServer = false;
  const timeout = setTimeout(() => { if (!firstServer) setSync('err', 'Cloud niet bereikbaar — lokaal'); }, 10000);
  profileRef.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites || profileBusy) return;
    if (snap.exists){ const d = snap.data(); mergeStats(d.stats); if (Array.isArray(d.groups)){ groups = d.groups.map(g => ({...g})); afterRemoteChange(); } }
  }, e => handleDbError(e));
  sheetsCol.onSnapshot(snap => {
    let changed = false;
    if (!snap.metadata.fromCache && !firstServer){
      firstServer = true; clearTimeout(timeout); cloud = 'on'; syncIdle();
      for (const id of pendingDel) if (!sheets[id]) saveSheet(id, true);
      changed = reconcile(new Set(snap.docs.map(d => d.id))) || changed;
      if (!snap.docs.length && groups.length) saveProfile();
    }
    for (const ch of snap.docChanges()){
      if (ch.type === 'removed'){ if (!snap.metadata.fromCache) changed = applyRemoteDelete(ch.doc.id) || changed; }
      else changed = applyRemote(ch.doc.id, ch.doc.data()) || changed;
    }
    if (changed) afterRemoteChange();
  }, e => handleDbError(e));
}

/* ----- Supabase ----- */
const rowToSheet = r => ({body:r.body, group:r.grp, fav:r.fav, trashed:r.trashed, goal:r.goal, created:Number(r.created), updated:Number(r.updated)});
async function connectSupabase(){
  if (!window.supabase){ cloud = 'off'; setSync('err', 'Kan Supabase niet laden — lokaal'); return; }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((event, session) => {
    if (session && session.user && (!sbUser || sbUser.id !== session.user.id)) setTimeout(() => startSupabase(session.user), 0);
    if (event === 'SIGNED_OUT') stopSupabase();
    if (event === 'PASSWORD_RECOVERY') setTimeout(newPasswordDialog, 300);
  });
  const { data } = await sb.auth.getSession();
  if (data && data.session) startSupabase(data.session.user);
  else { cloud = 'login'; syncIdle(); if (!LS.get('loginLater', false)) loginDialog(); }
}
async function startSupabase(user){
  if (sbUser && sbUser.id === user.id) return;
  sbUser = user; cloud = 'pending'; syncIdle();
  backend = {
    async write(id, s){
      const { error } = await sb.from('sheets').upsert({id, user_id:user.id, body:s.body, grp:s.group, fav:s.fav, trashed:s.trashed, goal:s.goal, created:s.created, updated:s.updated});
      if (error) throw error;
    },
    async remove(id){ const { error } = await sb.from('sheets').delete().eq('id', id); if (error) throw error; },
    async saveProfile(d){
      let { error } = await sb.from('profiles').upsert(noStatsCol ? {user_id:user.id, groups:d.groups} : {user_id:user.id, groups:d.groups, stats:d.stats});
      if (error && /stats/i.test(error.message || '') && !noStatsCol){ noStatsCol = true; ({ error } = await sb.from('profiles').upsert({user_id:user.id, groups:d.groups})); }
      if (error) throw error;
    }
  };
  await sbPull();
  srcPull().then(processIncoming); snipPull();
  sbChannel = sb.channel('sync-' + user.id)
    .on('postgres_changes', {event:'*', schema:'public', table:'sources'}, p => srcRealtime(p))
    .on('postgres_changes', {event:'*', schema:'public', table:'snippets'}, p => snipRealtime(p))
    .on('postgres_changes', {event:'*', schema:'public', table:'sheets'}, p => {
      let changed;
      if (p.eventType === 'DELETE') changed = p.old && applyRemoteDelete(p.old.id);
      else if (p.new && p.new.user_id === user.id) changed = applyRemote(p.new.id, rowToSheet(p.new));
      if (changed) afterRemoteChange();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'profiles'}, p => {
      if (profileBusy || !p.new || p.new.user_id !== user.id) return;
      mergeStats(p.new.stats);
      if (Array.isArray(p.new.groups)){ groups = p.new.groups; afterRemoteChange(); }
    })
    .subscribe();
}
let pulling = false;
async function sbPull(){
  if (!sbUser || pulling) return;
  pulling = true;
  try {
    const [res, prof] = await Promise.all([
      sb.from('sheets').select('*'),
      sb.from('profiles').select('*').eq('user_id', sbUser.id).maybeSingle()
    ]);
    if (res.error) throw res.error;
    cloud = 'on'; lastError = '';
    for (const id of pendingDel) if (!sheets[id]) saveSheet(id, true);
    let changed = false;
    for (const r of res.data) changed = applyRemote(r.id, rowToSheet(r)) || changed;
    changed = reconcile(new Set(res.data.map(r => r.id))) || changed;
    const remoteGroups = prof && prof.data && Array.isArray(prof.data.groups) ? prof.data.groups : [];
    const before = JSON.stringify(groups);
    const extra = mergeGroups(remoteGroups);
    const statsChanged = prof.data ? mergeStats(prof.data.stats) : false;
    if (prof.data && !('stats' in prof.data)) noStatsCol = true;
    if (extra || !prof.data || (prof.data.stats && JSON.stringify(prof.data.stats) !== JSON.stringify(stats))) saveProfile();
    if (changed || before !== JSON.stringify(groups)) afterRemoteChange();
    if (!Object.keys(timers).length) syncIdle();
  } catch(e){ handleDbError(e); }
  pulling = false;
}
function stopSupabase(){
  if (sbChannel){ sb.removeChannel(sbChannel); sbChannel = null; }
  sbUser = null; backend = null; cloud = 'login';
  for (const s of Object.values(sheets)) delete s.synced;
  persistLocal(); syncIdle();
}

function counts(){
  const c = {inbox:0, all:0, recent:0, fav:0, trash:0};
  const wk = Date.now() - 7*864e5;
  for (const s of Object.values(sheets)){
    if (s.trashed){ c.trash++; continue; }
    c.all++; if ((s.group||'inbox') === 'inbox') c.inbox++;
    if (s.fav) c.fav++; if ((s.updated||0) > wk) c.recent++;
    if (s.group && s.group !== 'inbox') c['g:'+s.group] = (c['g:'+s.group]||0) + 1;
  }
  return c;
}

  if (q){

const ta = $('#ta'), mirror = $('#mirror'), measure = $('#measure'), scroller = $('#scroll');
let previewOn = false;

function inline(t){
  // t is already escaped
  return t
    .replace(/(`)([^`\n]+?)(`)/g, '<span class="cd"><span class="mk">$1</span>$2<span class="mk">$3</span></span>')
    .replace(/(\+\+)(.+?)(\+\+)/g, '<span class="cm"><span class="mk">$1</span>$2<span class="mk">$3</span></span>')
    .replace(/(\*\*|__)(?=\S)(.+?)(?<=\S)\1/g, '<span class="b"><span class="mk">$1</span>$2<span class="mk">$1</span></span>')
    .replace(/(^|[^*\w])(\*|_)(?=[^\s*_])([^*_\n]+?)(?<=\S)\2(?![*\w])/g, '$1<span class="i"><span class="mk">$2</span>$3<span class="mk">$2</span></span>')
    .replace(/(==)(?=\S)(.+?)(?<=\S)(==)/g, '<span class="hl"><span class="mk">$1</span>$2<span class="mk">$3</span></span>')
    .replace(/(~~)(.+?)(~~)/g, '<span class="mk">$1</span><s>$2</s><span class="mk">$3</span>')
    .replace(/(\[\[)([^\]\n]+?)(\]\])/g, '<span class="mk">$1</span><span class="ln wl">$2</span><span class="mk">$3</span>')
    .replace(/(\[)([^\]\n]+)(\]\()([^)\s]+)(\))/g, '<span class="mk">$1</span><span class="ln">$2</span><span class="mk">$3$4$5</span>')
    .replace(/\?\?|\[check(?::[^\]\n]*)?\]/gi, m => '<span class="todo">' + m + '</span>');
}
function highlight(text, caret){
  const lines = text.split('\n');
  let pos = 0, out = [], para = [], paraStart = 0, inCode = false;
  const flushPara = () => { if (para.length){ out.push({start:paraStart, end:pos, html:para.join('\n')}); para = []; } };
  lines.forEach((raw, i) => {
    const line = esc(raw);
    let html;
    if (/^```/.test(raw)){ inCode = !inCode; html = `<span class="mk">${line}</span>`; }
    else if (inCode) html = `<span class="cd">${line}</span>`;
    else if (/^#{1,6}\s/.test(raw)){ const m = line.match(/^(#{1,6}\s)(.*)$/); html = `<span class="h"><span class="mk">${m[1]}</span>${inline(m[2])}</span>`; }
    else if (/^&gt;\s?/.test(line)){ const m = line.match(/^(&gt;\s?)(.*)$/); html = `<span class="mk">${m[1]}</span><span class="q">${inline(m[2])}</span>`; }

    const sep = idx < out.length - 1 ? '\n' : '';

function wrap(a, b, placeholder='tekst'){

  const sel = v.slice(s, e);

  if (v.slice(s - a.length, s) === a && v.slice(e, e + b.length) === b){
    ta.setSelectionRange(s - a.length, e + b.length); insert(sel); ta.setSelectionRange(s - a.length, e - a.length); return;
  }

function linePrefix(prefix){
  if (ta.readOnly) return;

  const ls = v.lastIndexOf('\n', s - 1) + 1;
  let le = v.indexOf('\n', e); if (le < 0) le = v.length;

  const allHave = block.every(l => l.startsWith(prefix));
  const res = block.map((l, i) => {
    const base = l.replace(re, '');
    if (allHave) return base;
    const p = prefix === '1. ' ? (i + 1) + '. ' : prefix;
    return p + base;

  ta.setSelectionRange(ls, le); insert(res);
  ta.setSelectionRange(ls + res.length, ls + res.length);
}

function textStats(text){
  const words = countWords(text);
  const chars = text.length;
  const charsNoSp = text.replace(/\s/g, '').length;
  const sentences = (text.match(/[^.!?\n]+[.!?]+/g) || []).length;
  const paras = text.split(/\n\s*\n/).filter(p => p.trim()).length;
  const read = Math.max(words ? 1 : 0, Math.round(words / 230));
  return {words, chars, charsNoSp, sentences, paras, read};
}

function mdToHtml(md){
  const lines = md.split('\n'); let html = '', list = null, para = [], code = null;
  const inl = t => esc(t)
    .replace(/\+\+(.+?)\+\+/g, '')
    .replace(/\[\[([^\]|\n]+)(?:\|[^\]\n]*)?\]\]/g, '$1').replace(/\s?\?\?/g, '').replace(/\s?\[check(?::[^\]\n]*)?\]/gi, '')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/(\*\*|__)(?=\S)(.+?)(?<=\S)\1/g, '<strong>$2</strong>')
    .replace(/(^|[^*\w])(\*|_)(?=[^\s*_])([^*_\n]+?)(?<=\S)\2(?![*\w])/g, '$1<em>$3</em>')
    .replace(/==(?=\S)(.+?)(?<=\S)==/g, '<mark>$1</mark>')
    .replace(/~~(.+?)~~/g, '<s>$1</s>')
    .replace(/\[([^\]]+)\]\(((?:https?:|mailto:)[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const flushP = () => { if (para.length){ html += '<p>' + para.map(inl).join('<br>') + '</p>\n'; para = []; } };
  const closeL = () => { if (list){ html += `</${list}>\n`; list = null; } };
  for (const raw of lines){
    if (code !== null){ if (/^```/.test(raw)){ html += '<pre><code>' + esc(code) + '</code></pre>\n'; code = null; } else code += (code ? '\n' : '') + raw; continue; }
    if (/^```/.test(raw)){ flushP(); closeL(); code = ''; continue; }
    let m;
    if (!raw.trim()){ flushP(); closeL(); continue; }
    if ((m = raw.match(/^(#{1,6})\s+(.*)$/))){ flushP(); closeL(); const n = m[1].length; html += `<h${n}>${inl(m[2])}</h${n}>\n`; continue; }
    if (/^(\*\s*\*\s*\*|-{3,}|_{3,})\s*$/.test(raw)){ flushP(); closeL(); html += '<hr>\n'; continue; }
    if ((m = raw.match(/^>\s?(.*)$/))){ flushP(); closeL(); html += `<blockquote><p>${inl(m[1])}</p></blockquote>\n`; continue; }
    if ((m = raw.match(/^\s*([-*+]|\d+\.)\s+(.*)$/))){
      flushP(); const t = /\d/.test(m[1]) ? 'ol' : 'ul';
      if (list !== t){ closeL(); html += `<${t}>`; list = t; }
      html += `<li>${inl(m[2])}</li>`; continue;
    }
    closeL(); para.push(raw);
  }
  if (code !== null) html += '<pre><code>' + esc(code) + '</code></pre>';
  flushP(); closeL();
  return html.replace(/<blockquote>([\s\S]*?)<\/blockquote>\n<blockquote>/g, '<blockquote>$1');
}
function exportMd(v){ return v.replace(/\+\+(.+?)\+\+/g, '').replace(/\[\[([^\]|\n]+)(?:\|[^\]\n]*)?\]\]/g, '$1').replace(/\s?\?\?/g, '').replace(/\s?\[check(?::[^\]\n]*)?\]/gi, ''); }
function plainText(md){
  return md.replace(/\+\+(.+?)\+\+/g, '').replace(/\[\[([^\]|\n]+)(?:\|[^\]\n]*)?\]\]/g, '$1').replace(/\s?\?\?/g, '').replace(/\s?\[check(?::[^\]\n]*)?\]/gi, '').replace(/^#{1,6}\s+/gm, '').replace(/^>\s?/gm, '')
    .replace(/(\*\*|__)(.+?)\1/g, '$2').replace(/(^|[^*\w])[*_]([^*_\n]+?)[*_](?![*\w])/g, '$1$2')
    .replace(/==(.+?)==/g, '$1').replace(/~~(.+?)~~/g, '$1').replace(/`([^`]+)`/g, '$1')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1 ($2)');

    case 'trash': s.trashed = true; touch(s, false); closePanel(); openSheet(null); renderLib(); toast('Naar de prullenbak verplaatst'); break;
    case 'restore': s.trashed = false; touch(s, false); ta.readOnly = false; renderPanel(); renderLib(); renderList(); toast('Teruggezet'); break;

async function copy(text, msg){
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch(e){
    const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); toast(msg); } catch(_) { toast('Kopiëren lukt hier niet'); }
    t.remove();
  }
}
async function download(filename, data, type){
  let dl = null;
  try { dl = window.claude && await window.claude.use('downloads'); } catch(e){}
  if (dl){
    try { await dl.save({filename, data: new Blob([data], {type: type + ';charset=utf-8'})}); }
    catch(e){
      try { await dl.save({filename, data}); } catch(_) { /* declined */ }
    }
    return;
  }
  copy(data, 'Downloaden kan hier niet — inhoud gekopieerd');
}

const DEV = LS.get('dev', null) || (() => { const d = uid(); LS.set('dev', d); return d; })();
let stats = Object.assign({goal:500, goalAt:0, days:{}, sprints:[]}, LS.get('stats', {}));
let curWords = 0;
const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const dayTotal = k => Object.values(stats.days[k] || {}).reduce((a, b) => a + b, 0);
function streak(){
  if (!stats.goal) return 0;
  let n = 0; const d = new Date();
  if (dayTotal(dayKey(d)) >= stats.goal) n++;
  for (;;){ d.setDate(d.getDate() - 1); if (dayTotal(dayKey(d)) >= stats.goal) n++; else break; }
  return n;
}
let statsT;
function saveStatsSoon(){ LS.set('stats', stats); clearTimeout(statsT); statsT = setTimeout(() => saveProfile(), 4000); }
function addWords(delta){
  if (!delta) return;
  const k = dayKey(), before = dayTotal(k);
  const day = stats.days[k] = stats.days[k] || {};
  day[DEV] = Math.max(0, (day[DEV] || 0) + delta);
  const after = dayTotal(k);
  if (stats.goal && before < stats.goal && after >= stats.goal){
    toast('Dagdoel gehaald — ' + streak() + (streak() === 1 ? ' dag' : ' dagen') + ' op rij!');
  }
  saveStatsSoon(); renderToday();
  if (coachOpen && coachTab === 'today') renderCoach();
}
function mergeStats(r){
  if (!r || typeof r !== 'object') return false;
  const before = JSON.stringify(stats);
  if ((r.goalAt || 0) > (stats.goalAt || 0)){ stats.goal = r.goal; stats.goalAt = r.goalAt; }
  for (const [k, devs] of Object.entries(r.days || {})){
    const day = stats.days[k] = stats.days[k] || {};
    for (const [dev, n] of Object.entries(devs || {})) day[dev] = dev === DEV ? Math.max(day[dev] || 0, n) : n;
  }
  const ids = new Set(stats.sprints.map(s => s.id));
  for (const s of (r.sprints || [])) if (!ids.has(s.id)) stats.sprints.push(s);
  stats.sprints = stats.sprints.sort((a, b) => a.at - b.at).slice(-60);
  const cutoff = dayKey(new Date(Date.now() - 400 * 864e5));
  for (const k of Object.keys(stats.days)) if (k < cutoff) delete stats.days[k];
  const changed = before !== JSON.stringify(stats);
  if (changed){ LS.set('stats', stats); renderToday(); if (coachOpen) renderCoach(); }
  return changed;
}
